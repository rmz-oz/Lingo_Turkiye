:root{--kagit:#0f1720;--kart:#1a2430;--murekkep:#f2f5f8;--soluk:#8b98a6;
  --cizgi:#2c3947;--yesil:#2e9e5b;--sari:#e6b22e;--gri:#3a4756;
  --kirmizi:#d94a5a;--altin:#f4c95d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--kagit_zemin);color:var(--murekkep_yazi);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer}
#bar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--r91543_zemin);
  border-bottom:1px solid var(--cizgi_kenar);flex:none}
#bar .etap{font-size:13px;letter-spacing:1px;font-weight:700;color:var(--altin_yazi);
  text-transform:uppercase}
#bar a{color:var(--soluk_yazi);text-decoration:none;font-size:14px}
#bar .para{font-weight:800;font-variant-numeric:tabular-nums}
#bar #ydg{margin-left:auto;border:1px solid var(--cizgi_kenar);background:transparent;
  color:var(--r5855_yazi);border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:800;
  letter-spacing:.6px}
#bar #ydg.on{background:var(--yesil_zemin);border-color:var(--yesil_kenar);color:var(--r75636_yazi)}
#bar #sesd{border:1px solid var(--cizgi_kenar);background:transparent;border-radius:99px;
  width:32px;height:28px;padding:0;font-size:14px;line-height:1}
#bar #sesd.kapali{opacity:.45}
#sure{width:100%;height:4px;background:var(--r9515_zemin);flex:none}
#sure i{display:block;height:100%;background:var(--altin_zemin);width:100%}
#sure.az i{background:var(--kirmizi_zemin)}
#orta{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:12px;gap:10px;min-height:0}
#orta.ust{justify-content:flex-start}
.baslik{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--soluk_yazi);
  font-weight:700;text-align:center}
#tahta{display:grid;gap:5px;justify-content:center}
#tahta .satir{display:grid;gap:5px}
.hucre{width:var(--hg);height:var(--hg);border:2px solid var(--cizgi_kenar);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:800;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:calc(var(--hg)*.52);
  background:var(--r11340_zemin)}
.hucre.ilk{border-color:var(--r59059_kenar);color:var(--altin_yazi)}
.hucre.dolu{border-color:var(--r59059_kenar)}
.hucre.tam{background:var(--yesil_zemin);border-color:var(--yesil_kenar);color:var(--r75636_yazi)}
.hucre.var{background:var(--sari_zemin);border-color:var(--sari_kenar);color:var(--r23455_yazi)}
.hucre.yok{background:var(--gri_zemin);border-color:var(--gri_kenar);color:var(--r46147_yazi)}
.satir.aktif .hucre{border-color:var(--r61643_kenar)}
.satir.sarsil{animation:sars .35s}
@keyframes sars{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
#klavye{flex:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  background:var(--r91543_zemin);border-top:1px solid var(--cizgi_kenar)}
#klavye .sr{display:flex;gap:4px;justify-content:center;margin-bottom:4px}
#klavye button{flex:1 1 0;min-width:0;height:46px;border:0;border-radius:7px;
  background:var(--r13553_zemin);color:var(--r75636_yazi);font-weight:700;font-size:16px;padding:0}
#klavye button.gnis{flex:1.9 1 0;font-size:13px;letter-spacing:.5px}
#klavye button.dar{flex:1.9 1 0;font-size:13px;letter-spacing:.5px}
#klavye button.tam{background:var(--yesil_zemin)}
#klavye button.var{background:var(--sari_zemin);color:var(--r23455_yazi)}
#klavye button.yok{background:var(--r56935_zemin);color:var(--r61440_yazi)}
.kutu{background:var(--kart_zemin);border:1px solid var(--cizgi_kenar);border-radius:16px;
  padding:20px 18px;max-width:520px;width:100%;text-align:center}
.kutu h1{font-size:30px;margin:0 0 6px;letter-spacing:-.5px}
.kutu h2{font-size:20px;margin:0 0 8px}
.kutu p{color:var(--soluk_yazi);margin:0 0 10px;font-size:15.5px;line-height:1.55}
.kutu p b{color:var(--murekkep_yazi)}
.buton{display:block;width:100%;background:var(--altin_zemin);color:var(--r23984_yazi);border:0;
  border-radius:12px;padding:15px;font-weight:800;font-size:17px;margin-top:10px}
.buton.ikinci{background:transparent;color:var(--murekkep_yazi);border:1.5px solid var(--cizgi_kenar)}
.kucuk{font-size:13.5px;color:var(--soluk_yazi);line-height:1.5}
.tutar{font-size:44px;font-weight:800;color:var(--altin_yazi);letter-spacing:-1px;line-height:1.1}
.uyari{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--r64892_zemin);
  color:var(--r44327_yazi);padding:9px 16px;border-radius:999px;font-weight:700;font-size:14.5px;
  z-index:20;box-shadow:0 6px 22px var(--r2153_golge)}
/* degerlendirme */
.dgr{max-width:560px;width:100%;text-align:left}
.dgr .yanlis{background:var(--kart_zemin);border:1px solid var(--kirmizi_kenar);border-radius:14px;
  padding:14px 16px;text-align:center;margin-bottom:10px}
.dgr .yanlis span{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--kirmizi_yazi);font-weight:700;display:block;margin-bottom:4px}
.dgr .yanlis b{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:3px}
.dgr .yanlis i{display:block;font-style:normal;font-size:14px;color:var(--soluk_yazi);
  margin-top:6px;line-height:1.45}
.dgr .oner{background:var(--r59595_zemin);border:1px solid var(--r65111_kenar);border-radius:14px;
  padding:14px 16px;text-align:center;margin-bottom:12px}
.dgr .oner span{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--r4031_yazi);font-weight:700;display:block;margin-bottom:6px}
.dgr .oner b{font-family:ui-monospace,Menlo,monospace;font-size:23px;letter-spacing:2px;
  display:block}
.dgr .oner i{font-style:normal;font-size:13.5px;color:var(--r12133_yazi);display:block;margin-top:5px}
.dgr h3{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--soluk_yazi);
  margin:14px 0 8px}
.wrap{display:flex;flex-wrap:wrap;gap:5px}
.k{display:inline-block;padding:4px 8px;border-radius:6px;font-size:14px;font-weight:700;
  font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px;white-space:nowrap}
.k em{font-style:normal;font-size:9.5px;letter-spacing:0;margin-left:3px;opacity:.75;
  font-family:inherit;vertical-align:2px}
.k.bu{outline:2.5px solid var(--kirmizi_kenar);outline-offset:1.5px}
.c1{background:var(--r99900_zemin);color:var(--r64712_yazi)}.c2{background:var(--r9380_zemin);color:var(--r27086_yazi)}
.c3{background:var(--r97302_zemin);color:var(--r33905_yazi)}.c4{background:var(--r44885_zemin);color:var(--r98903_yazi)}
.c5{background:var(--r53582_zemin);color:var(--r80376_yazi)}.c6{background:var(--r85040_zemin);color:var(--r28175_yazi)}
.c7{background:var(--r52658_zemin);color:var(--r75636_yazi)}.c8{background:var(--r76178_zemin);color:var(--r75636_yazi)}
.c9{background:var(--r61391_zemin);color:var(--r75636_yazi)}.c10{background:var(--r98670_zemin);color:var(--r75636_yazi)}
.k.hic{background:transparent;border:1px solid var(--cizgi_kenar);color:var(--soluk_yazi);
  font-weight:600}
.lej{display:flex;gap:3px;flex-wrap:wrap;align-items:center;margin:6px 0 0;
  font-size:11.5px;color:var(--soluk_yazi)}
.lej i{font-style:normal;padding:2px 6px;border-radius:4px;font-weight:700;font-size:11px}
/* harf secimi */
.sec{max-width:560px;width:100%}
.sec h1{font-size:26px;margin:0 0 6px;letter-spacing:-.5px;text-align:center}
.sec .not{color:var(--soluk_yazi);font-size:14.5px;line-height:1.5;text-align:center;
  margin:0 0 12px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.hgrid button{border:0;border-radius:11px;padding:9px 4px 7px;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.hgrid b{font-size:22px;font-weight:800;letter-spacing:.5px}
.hgrid i{font-style:normal;font-size:10px;opacity:.85;font-weight:700;white-space:nowrap}
.hgrid em{font-style:normal;font-size:9px;opacity:.72;white-space:nowrap}
.z1{background:var(--r19654_zemin);color:var(--r75636_yazi)}
.z2{background:var(--r65558_zemin);color:var(--r56631_yazi)}
.z3{background:var(--r82942_zemin);color:var(--r75636_yazi)}
.karis{margin-top:14px;background:linear-gradient(135deg,var(--r11385_zemin) 0%,var(--r76604_zemin) 100%);
  color:var(--r75636_yazi);border:0;box-shadow:0 4px 14px var(--r50993_golge);
  display:flex;align-items:center;justify-content:center;gap:9px}
.karis .em{font-size:21px;line-height:1}
.karis small{display:block;font-size:12.5px;font-weight:600;opacity:.85;
  letter-spacing:.2px;margin-top:1px}
.karis .tx{text-align:left}
.rapb{display:flex;align-items:center;gap:12px;margin-top:14px;padding:13px 14px;
  background:var(--r84220_zemin);border:1px solid var(--cizgi_kenar);border-radius:13px;
  text-decoration:none;color:var(--murekkep_yazi)}
.rapb .ik{width:38px;height:38px;border-radius:10px;background:var(--r9515_zemin);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:19px}
.rapb .tx{flex:1;min-width:0;text-align:left}
.rapb .tx b{display:block;font-size:15px;letter-spacing:.2px;line-height:1.25}
.rapb .tx span{display:block;font-size:12.5px;color:var(--soluk_yazi);margin-top:3px;
  line-height:1.45}
.rapb .ok{color:var(--soluk_yazi);font-size:20px;line-height:1;flex:none}
.lej3{display:flex;gap:5px;justify-content:center;align-items:center;
  margin:10px 0 2px;font-size:12px;color:var(--soluk_yazi);flex-wrap:wrap}
.lej3 i{font-style:normal;padding:2px 9px;border-radius:5px;font-weight:700;font-size:11.5px}
/* yardimli mod */
.yrd{width:100%;max-width:620px;margin-top:2px;display:flex;gap:10px;
  align-items:flex-start;max-height:20vh;overflow-y:auto}
/* yardim acikken klavye biraz kisilir, tahta buyuk kalir */
body.yrdac #klavye{--tush:clamp(44px,7.2vh,62px)}
body.yrdac #klavye button{font-size:clamp(15px,2vh,19px)}
.ysol{flex:0 0 150px;background:var(--r59595_zemin);border:1px solid var(--r65111_kenar);border-radius:10px;
  padding:9px 10px}
.ysag{flex:1;min-width:0}
.ysol .yh{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--r4031_yazi);font-weight:800;margin-bottom:6px;line-height:1.3}
.ysol .yp{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;
  color:var(--r99056_yazi);letter-spacing:.4px;margin-bottom:4px}
@media(max-width:560px){
  .yrd{flex-direction:column;gap:7px}
  .ysol{flex:none;width:100%}
  .ysol .yp{display:inline-flex;margin:0 10px 3px 0}
}
.yrd .yb{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--soluk_yazi);
  letter-spacing:.6px;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.yrd .yb b{color:var(--yesil_yazi);font-size:15px}
.yrd .yb u{margin-left:auto;text-decoration:none;color:var(--r5855_yazi);font-weight:600}
.yw{display:flex;flex-wrap:wrap;gap:4px;max-height:34vh;overflow-y:auto;
  padding:2px 1px 4px}
.yw span{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;
  padding:2px 6px;border-radius:5px;letter-spacing:.5px;white-space:nowrap}
.yw span.ok{background:var(--r64378_zemin);color:var(--r34930_yazi);border:1px solid var(--r19654_kenar)}
.yw span.no{background:transparent;color:var(--r97990_yazi);text-decoration:line-through;
  border:1px solid var(--r43363_kenar);font-weight:600}
.anah{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--kart_zemin);border:1px solid var(--cizgi_kenar);border-radius:12px;
  padding:11px 14px;margin-top:12px;cursor:pointer}
.anah .t{text-align:left}
.anah .t b{display:block;font-size:15.5px}
.anah .t b u{text-decoration:none;color:var(--soluk_yazi);font-size:13px}
.anah.on .t b u{color:var(--yesil_yazi)}
.anah .t i{font-style:normal;font-size:12.5px;color:var(--soluk_yazi);line-height:1.35;
  display:block;margin-top:2px}
.anah .sw{width:46px;height:26px;border-radius:99px;background:var(--r13553_zemin);flex:none;
  position:relative;transition:background .15s}
.anah .sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:99px;background:var(--r75636_zemin);transition:left .15s}
.anah.on .sw{background:var(--yesil_zemin)}
.anah.on .sw:after{left:23px}
/* kutlama */
.kutla{position:fixed;inset:0;z-index:60;background:var(--r41594_zemin);
  display:flex;align-items:center;justify-content:center;padding:22px}
.kutla canvas{position:absolute;inset:0;width:100%;height:100%}
.kutla .ki{position:relative;text-align:center;max-width:400px;width:100%}
.kutla .kt{font-size:13px;letter-spacing:3.5px;text-transform:uppercase;
  color:var(--altin_yazi);font-weight:800;margin-bottom:8px}
.kutla .kb{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
.kutla .kw{font-family:ui-monospace,Menlo,monospace;font-size:30px;font-weight:800;
  letter-spacing:5px;color:var(--r75636_yazi);background:var(--yesil_zemin);border-radius:12px;
  padding:12px 10px;margin-bottom:10px}
.kutla .kn{font-size:15px;color:var(--soluk_yazi);margin-bottom:16px}
/* kisi */
.kisi{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  background:var(--kart_zemin);border:1px solid var(--cizgi_kenar);border-radius:999px;
  padding:7px 14px;margin:0 auto 10px;font-size:14px;color:var(--soluk_yazi);
  cursor:pointer;max-width:340px}
.kisi b{color:var(--murekkep_yazi);font-size:15px}
.kisi u{text-decoration:none;color:var(--yesil_yazi);font-weight:700;font-size:13px;
  margin-left:8px;white-space:nowrap}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;
  margin:10px 0}
.kgrid button{background:var(--r9515_zemin);border:1.5px solid var(--cizgi_kenar);border-radius:11px;
  padding:14px 6px;color:var(--murekkep_yazi);font-weight:700;font-size:16px}
.kgrid button.on{background:var(--yesil_zemin);border-color:var(--yesil_kenar);color:var(--r75636_yazi)}
/* rozet */
.rozkut{background:linear-gradient(135deg,var(--r55748_zemin),var(--r60013_zemin));border:1px solid var(--altin_kenar);
  border-radius:13px;padding:12px 14px;margin-top:12px;text-align:left}
.rozkut .bs{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--altin_yazi);
  font-weight:800;margin-bottom:8px}
.rozsat{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.rozsat:last-child{margin-bottom:0}
.rozsat .em{font-size:26px;line-height:1}
.rozsat b{font-size:15.5px;display:block}
.rozsat span{font-size:12.5px;color:var(--soluk_yazi)}
.unvkut{background:var(--kart_zemin);border:1px solid var(--cizgi_kenar);border-radius:12px;
  padding:11px 14px;margin-top:10px;text-align:left}
.unvkut b{color:var(--altin_yazi);font-size:15.5px}
.unvkut span{display:block;font-size:12.5px;color:var(--soluk_yazi);margin-top:2px}
.unvkut .c{height:5px;background:var(--r9515_zemin);border-radius:3px;margin-top:7px;overflow:hidden}
.unvkut .c i{display:block;height:100%;background:var(--altin_zemin)}
.lgroz{font-size:15px;margin-right:2px}
.unvyeni{background:linear-gradient(135deg,var(--r68982_zemin),var(--r1502_zemin));color:var(--r23984_yazi);
  border-radius:14px;padding:14px;margin-top:12px;text-align:center;
  box-shadow:0 5px 18px var(--r48163_golge)}
.unvyeni .uy1{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;
  opacity:.75}
.unvyeni .uy2{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:3px 0 2px}
.unvyeni .uy3{font-size:12.5px;opacity:.8}
.uret{background:linear-gradient(135deg,var(--r55748_zemin),var(--r60013_zemin));border:1px solid var(--altin_kenar);
  border-radius:13px;padding:14px;margin:10px 0 4px;text-align:center}
.uret b{display:block;font-size:19px;color:var(--altin_yazi);letter-spacing:-.2px;
  margin-bottom:10px}
.ub{display:flex;gap:8px}
.ub .buton{margin-top:0;font-size:14px;padding:12px 6px}
input.adg{width:100%;background:var(--r9515_zemin);border:1.5px solid var(--cizgi_kenar);border-radius:11px;
  padding:13px;color:var(--murekkep_yazi);font:inherit;font-weight:700;text-align:center;
  margin:8px 0}
.sifir{font-size:12.5px;color:var(--r59778_yazi);text-align:center;margin-top:14px;line-height:1.6}
.sifir span{color:var(--kirmizi_yazi);cursor:pointer;text-decoration:underline}
.gizli{display:none!important}

/* centik payi: saat ve kamera cubugunun altina girmesin */
#bar{padding-top:calc(9px + env(safe-area-inset-top,0px))}

/* --- geri oku: buyuk ve rahat dokunulur --- */
#bar .geri,header .geri{font-size:30px;line-height:1;font-weight:400;
  text-decoration:none;color:var(--murekkep_yazi);opacity:.9;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  min-width:46px;height:44px;margin-left:-6px;padding:0}
#bar .geri:active,header .geri:active{opacity:.5}

/* --- uc nokta menusu --- */
.mnk{width:44px;height:38px;flex:none;border:1px solid var(--cizgi);border-radius:99px;
  background:transparent;color:var(--murekkep);font-size:22px;line-height:1;
  padding:0 0 4px;margin-left:10px;cursor:pointer;font-family:inherit}
.mnk:active{opacity:.6}
.mnf{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none}
.mnf.acik{display:block}
.mnl{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:10px;z-index:61;
  background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;
  box-shadow:0 12px 34px rgba(0,0,0,.45);padding:6px;display:none;min-width:212px}
.mnl.acik{display:block}
.mnl button,.mnl a{display:flex;align-items:center;gap:12px;width:100%;
  background:transparent;border:0;border-radius:10px;padding:13px 12px;
  color:var(--murekkep);font:inherit;font-size:16px;font-weight:600;text-align:left;
  text-decoration:none;cursor:pointer}
.mnl button:active,.mnl a:active{background:rgba(127,127,127,.18)}
.mnl i{font-style:normal;font-size:19px;width:24px;text-align:center}

/* --- sesle yazma --- */
.sesyaz{display:flex;justify-content:center;margin-top:6px}
.seskayan{position:fixed;right:10px;bottom:12px;z-index:40;display:flex;
  flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.seskayan.klv{position:absolute;right:10px;bottom:100%;margin-bottom:8px}
#klavye{position:relative}
.seskayan .sesbtn,.sesyaz .sesbtn{pointer-events:auto}
.sesbtn{background:linear-gradient(135deg,#6c5ce7,#8e6ce8);color:#fff;border:0;
  border-radius:999px;padding:12px 17px;font:inherit;font-size:14.5px;font-weight:800;
  letter-spacing:.4px;cursor:pointer;box-shadow:0 5px 16px rgba(108,92,231,.45)}
.sesbtn:active{transform:scale(.97)}
.sesbtn.dinle{background:linear-gradient(135deg,#d94a5a,#e2576a);color:#fff;
  box-shadow:0 5px 16px rgba(217,74,90,.5);animation:sesnabiz 1.1s infinite}
@keyframes sesnabiz{0%,100%{opacity:1}50%{opacity:.55}}
.sesdurum{font-size:12.5px;color:var(--soluk);text-align:right;line-height:1.35;
  max-width:230px;background:var(--kart);border-radius:10px;padding:0 8px}
.sesdurum:empty{display:none}
.sesdurum b{color:var(--altin);font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
.sesdurum s{text-decoration:none;color:var(--kirmizi)}

/* --- klavye buyutuldu: rahat yazilsin --- */
#klavye{--tush:clamp(50px,9.4vh,78px)}
#klavye button{height:var(--tush);font-size:clamp(17px,2.5vh,22px);border-radius:8px}
#klavye .sr{margin-bottom:5px}
#klavye button.gnis,#klavye button.dar{font-size:clamp(12.5px,1.7vh,15px)}

  const agirlik = uygun.map(L => VERI.arsiv[N].filter(x => x[0][0] === L).length + 1);
  const sec = [];
  const kalan = uygun.slice(), ag = agirlik.slice();
  while(sec.length < BLOKSAY && kalan.length){
    let t = ag.reduce((x, y) => x + y, 0), r = Math.random()*t, i = 0;
    while(i < kalan.length - 1 && (r -= ag[i]) > 0) i++;
    sec.push(kalan[i]); kalan.splice(i, 1); ag.splice(i, 1);
  }
  return sec;
}
function kumul(){
  if(KUM) return KUM;
  const c = []; let t = 0;
  for(const [w, k] of ARS){ t += k; c.push(t); }
  return KUM = {c, t};
}
function agirlikli(){
  if(!ARS.length) return null;
  const {c, t} = kumul(), r = Math.random()*t;
  let lo = 0, hi = c.length-1;
  while(lo < hi){ const m = (lo+hi)>>1; if(c[m] <= r) lo = m+1; else hi = m; }
  return ARS[lo][0];
}
function kelimeSec(){
  if(OZEL && OZEL.length){                       // rapordan gelen kelime listesi
    const w = OZEL.shift(); kullanilan.add(w); return w;
  }
  for(let t = 0; t < 500; t++){
    let w;
    if((Math.random() < 0.80 || !YEN.length) && ARS.length) w = agirlikli();
    else if(YEN.length) w = YEN[Math.floor(Math.pow(Math.random(), 1.8) * YEN.length)];
    else w = agirlikli();
    if(w && !kullanilan.has(w)){ kullanilan.add(w); return w; }
  }
  const kalan = ARS.map(x => x[0]).concat(YEN).filter(w => !kullanilan.has(w));
  const w = kalan.length ? kalan[0] : (ARS[0] ? ARS[0][0] : YEN[0]);
  kullanilan.add(w); return w;
}

function uyar(m){
  const d = document.createElement("div"); d.className = "uyari"; d.textContent = m;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1300);

function renk(g, t){
  const n = g.length, r = new Array(n).fill("yok"), kal = {};
  for(let i = 0; i < n; i++)
    if(t[i] === g[i]) r[i] = "tam"; else kal[g[i]] = (kal[g[i]]||0)+1;
  for(let i = 0; i < n; i++)
    if(r[i] !== "tam" && kal[t[i]] > 0){ r[i] = "var"; kal[t[i]]--; }
  return r;
}

function klavyeCiz(gir, sil, gonder){
  klv.innerHTML = ""; klvTus = {};
  DIZ.forEach((sr, k) => {
    const d = document.createElement("div"); d.className = "sr";
    for(const c of sr){
      const b = document.createElement("button"); b.textContent = TRU(c);
      b.onclick = () => gir(c); klvTus[c] = b; d.appendChild(b);
    }
    if(k === 1){ const b = document.createElement("button");     // SİL, TAMAM'in ustunde
      b.className = "dar"; b.textContent = "SİL"; b.onclick = sil; d.appendChild(b); }
    if(k === 2){ const b = document.createElement("button");
      b.className = "gnis"; b.textContent = "TAMAM"; b.onclick = gonder; d.appendChild(b); }
    klv.appendChild(d);
  });
  klv.classList.remove("gizli");
}
function klvBoya(t, r){
  const o = {tam:3, var:2, yok:1};
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if((o[klvDurum[c]]||0) < o[r[i]]){ klvDurum[c] = r[i];
      if(klvTus[c]) klvTus[c].className = r[i]; }
  }
}
function hucreBoy(n, kucuk){
  const g = Math.min(window.innerWidth - 26, 430);
  const enBoy = Math.floor((g - (n-1)*5) / n);
  /* klavye once yerini alir, tahta kalanla yetinir */
  const kl = (klv && !klv.classList.contains("gizli"))
    ? klv.getBoundingClientRect().height : Math.round(window.innerHeight * 0.30);
  const yrdPay = kucuk ? Math.round(window.innerHeight * 0.20) + 40 : 0;
  const kalanY = window.innerHeight - kl - yrdPay - 110;
  const boyY = Math.floor((kalanY - (SATIR - 1) * 5) / SATIR);
  return Math.max(24, Math.min(56, enBoy, boyY > 0 ? boyY : enBoy));
}

           ${ok.map(w => `<span class="ok">${TRU(w)}</span>`).join("")}
           ${no.map(w => `<span class="no">${TRU(w)}</span>`).join("")}</div></div>`;

  const tahta = $("#tahta");
  for(let r = 0; r < SATIR; r++){
    const d = document.createElement("div"); d.className = "satir";
    d.style.gridTemplateColumns = `repeat(${N}, var(--hg))`;

    tahta.appendChild(d);
  }
  const satirlar = [...tahta.children];
  function ustYaz(){
    $("#ust").textContent =
      (KARISIK
        ? `${TRU(HARF)} · ${sira % BLOKBOY + 1}/${BLOKBOY} · TOPLAM ${sira+1}/${HEDEF}`

      + ` · ${SATIR - sat} HAK · ${kalanSn} SN`;

      h[i].className = "hucre" + (giris[i] ? " dolu" : "");
    }
  }
  function tik(){
    durdur(); sureGoster(true); sureKap.classList.remove("az");
    kalanSn = SURE; ustYaz();
    const bas = Date.now(), top = SURE*1000;
    sayac = setInterval(() => {
      const kalan = Math.max(0, top - (Date.now()-bas));
      sureBar.style.width = (100*kalan/top) + "%";
      sureKap.classList.toggle("az", kalan < top*0.3);
      const s2 = Math.ceil(kalan/1000);
      if(s2 !== kalanSn){ kalanSn = s2; ustYaz(); if(s2 <= 5 && s2 > 0) LG_ses("sure"); }
      if(kalan <= 0){ durdur(); bitirSatir(null); }
    }, 100);
  }
  function sarsil(){
    satirlar[sat].classList.add("sarsil");
    setTimeout(() => satirlar[sat].classList.remove("sarsil"), 360);
  }
  function bitirSatir(tah){
    if(kapandi) return;
    durdur();
    if(tah === null){
      const h = satirlar[sat].children;
      for(let i = 1; i < N; i++){ h[i].textContent = "·"; h[i].className = "hucre yok"; }

        gecmis.push({w: gizli, ok: true}); defterYaz(gizli, sat + 1);
        return setTimeout(() => kutla(gizli, sat + 1), 560);

    sat++; giris = gizli[0];
    if(sat >= SATIR){
      kapandi = true; sureGoster(false); sira++; skorYaz();
      gecmis.push({w: gizli, ok: false}); defterYaz(gizli, 0); LG_ses("bitti");
      return setTimeout(() => degerlendir(gizli), 550);

    ustYaz(); yaz(); tik();

  ustYaz(); yaz(); yardimCiz();
  klavyeCiz(
    c => { if(giris.length < N){ giris += c; yaz(); } },
    () => { if(giris.length > 1){ giris = giris.slice(0, -1); yaz(); } },
    () => {

      if(!GECERLI.has(giris)){ LG_ses("gecersiz"); uyar("Sözlükte yok"); sarsil(); return; }

    });
  tik();

let fisekRAF = null;
function durdurFisek(){ if(fisekRAF){ cancelAnimationFrame(fisekRAF); fisekRAF = null; } }
function havaiFisek(cv){
  const az = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ctx = cv.getContext("2d");
  const W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  const RENK = ["#f4c95d","#2e9e5b","#e6b22e","#6c5ce7","#d94a5a","#7fe0a6","#fff"];
  let par = [], son = 0, bas = 0;
  function patlat(){
    const x = W*(0.18 + Math.random()*0.64), y = H*(0.12 + Math.random()*0.42);
    const c = RENK[Math.floor(Math.random()*RENK.length)];
    const n = 34 + Math.floor(Math.random()*20);
    for(let i = 0; i < n; i++){
      const a = Math.PI*2*i/n + Math.random()*0.25, v = 1.5 + Math.random()*2.8;
      par.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, c,
                o: 1, r: 1.5 + Math.random()*1.5});
    }
  }
  function tur(t){
    if(!bas) bas = t;
    ctx.clearRect(0, 0, W, H);
    if(t - son > 500 && t - bas < 3200){ son = t; patlat(); }
    par = par.filter(p => p.o > 0.02);
    for(const p of par){
      p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.vx *= 0.986; p.vy *= 0.986; p.o *= 0.971;
      ctx.globalAlpha = p.o; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.284); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if(par.length || t - bas < 3200) fisekRAF = requestAnimationFrame(tur);
    else fisekRAF = null;
  }
  if(az){ patlat(); ctx.globalAlpha = 1; return; }
  patlat(); fisekRAF = requestAnimationFrame(tur);
}

function giris(){
  const hs = Object.keys(DERS.harf).map(L => ({L, ...DERS.harf[L]}));
  const zs = hs.slice().sort((a, b) => a.er - b.er);   // renk: kolaydan zora
  const ucte = Math.ceil(zs.length/3);
