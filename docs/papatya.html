:root{
  --kagit:#0f1720; --kart:#1a2430; --murekkep:#f2f5f8; --soluk:#8b98a6;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--kagit_zemin);color:var(--murekkep_yazi);

  padding:0 4px 2px;flex:none;display:flex;align-items:center}
#bar .geri:active{opacity:.6}
#orta{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  padding:16px 12px 24px;gap:11px;min-height:0;-webkit-overflow-scrolling:touch}
#orta.ort{justify-content:flex-start}
#orta.ort > :first-child{margin-top:auto}
#orta.ort > :last-child{margin-bottom:auto}
.kutu{background:var(--kart_zemin);border:1px solid var(--cizgi_kenar);border-radius:16px;
  padding:18px 16px;max-width:470px;width:100%}
.kutu.ort{text-align:center}
.kutu h1{font-size:26px;margin:0 0 5px;letter-spacing:-.4px;line-height:1.16}
.kutu h2{font-size:19px;margin:0 0 8px}
.kutu p{color:var(--soluk_yazi);margin:0 0 10px;font-size:14.5px;line-height:1.6}
.kutu p b{color:var(--murekkep_yazi)}

.buton{display:block;width:100%;background:var(--altin_zemin);color:var(--r23984_yazi);border:0;
  border-radius:12px;padding:14px;font-weight:800;font-size:16.5px;margin-top:9px;
  text-align:center;text-decoration:none}
.buton.ikinci{background:transparent;color:var(--murekkep_yazi);border:1.5px solid var(--cizgi_kenar)}
.buton.yesil{background:var(--sap_zemin);color:var(--r94169_yazi)}

.kucuk{font-size:13px;color:var(--soluk_yazi);line-height:1.55}

  background:var(--r90998_zemin);border:1.6px solid var(--r84194_kenar);
  border-radius:52% 52% 44% 44%/66% 66% 34% 34%;

  font-family:ui-monospace,"SF Mono",Menlo,monospace}

  background:var(--altin_zemin);color:var(--r82618_yazi);font-size:30px;font-weight:800;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;

.dgm{display:flex;gap:7px;justify-content:center;margin-top:11px;width:100%;

.saksilar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;
  max-width:470px;width:100%}
.saksilar .sk{position:relative;border:1.5px dashed var(--cizgi_kenar);border-radius:14px;
  min-height:62px;padding:8px 4px 9px;text-align:center;background:var(--r11340_zemin);
  font-size:13px;line-height:1.25;font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-weight:800;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;overflow:hidden;
  transition:transform .14s,border-color .14s,background .14s}
.saksilar .sk .ik{font-size:17px;line-height:1;opacity:.55;font-family:-apple-system,system-ui,sans-serif}
.saksilar .sk i{font-style:normal;font-family:-apple-system,system-ui,sans-serif;font-size:9px;
  letter-spacing:.1em;color:var(--soluk_yazi);text-transform:uppercase;font-weight:700}
.saksilar .sk.dolu{border-style:solid;border-color:var(--sap_kenar);color:var(--r37010_yazi);
  background:var(--r34619_zemin);box-shadow:0 3px 12px rgba(63,125,77,.18)}
.saksilar .sk.dolu .ik{opacity:1}
.saksilar .sk.yeni{animation:skac .45s ease-out}
@keyframes skac{0%{transform:scale(.82)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
.saksilar .sk.tam{border-color:var(--altin_kenar);border-width:2px}
.saksilar .sk.tam.dolu{border-color:var(--altin_kenar);background:var(--r1419_zemin);color:var(--altin_yazi);
  box-shadow:0 3px 14px rgba(224,169,46,.25)}
.saksilar .sk.ipucu{border-color:var(--sari_kenar)}
.yard{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:470px;width:100%}
.yard button{flex:1 1 auto;background:transparent;border:1px solid var(--cizgi_kenar);
  color:var(--soluk_yazi);border-radius:99px;padding:8px 11px;font-size:12.5px;font-weight:700}

#not{max-width:470px;width:100%;font-size:14px;line-height:1.55;color:var(--soluk_yazi);

.bahce{max-width:470px;width:100%;border:1px solid rgba(90,166,106,.38);

  background:rgba(90,166,106,.16);border:1px solid rgba(90,166,106,.3);
  border-radius:99px;padding:4px 10px}
.uyari{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;background:var(--r64892_zemin);

  z-index:20;box-shadow:0 6px 22px var(--r55744_golge);max-width:88vw;text-align:center}
.ozet{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0 4px}
.ozet div{background:var(--r11340_zemin);border:1px solid var(--cizgi_kenar);border-radius:10px;padding:8px 4px}
.ozet b{display:block;font-size:19px;font-variant-numeric:tabular-nums;color:var(--altin_yazi)}
.ozet span{display:block;font-size:9.5px;color:var(--soluk_yazi);text-transform:uppercase;
  letter-spacing:.4px;margin-top:2px}
.tutar{font-size:40px;font-weight:800;color:var(--altin_yazi);letter-spacing:-1px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.tumk{max-width:470px;width:100%;text-align:left;margin-top:8px}
.tumk>div{border-top:1px solid var(--cizgi_kenar);padding:9px 0 8px}
.tumk>div:last-child{border-bottom:1px solid var(--cizgi_kenar)}
.tumk i{display:block;font-style:normal;font-size:10px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--soluk_yazi);font-weight:800;margin-bottom:5px}
.tumk p{margin:0;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;
  line-height:1.85;letter-spacing:.04em;color:var(--r7739_yazi)}
.tumk p b{color:var(--r37997_yazi);font-weight:800}

table.rk{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.rk td{padding:6px 3px;border-bottom:1px solid var(--cizgi_kenar);color:var(--soluk_yazi)}

  font-variant-numeric:tabular-nums}
table.rk tr:last-child td{border-bottom:0}

/* --- gezinme tuslari buyutuldu: rahat dokunulsun --- */
#bar{gap:13px;padding-top:9px;padding-bottom:9px}
#bar .geri{font-size:31px;line-height:1;padding:0 8px 4px 2px;min-width:30px;
  color:var(--murekkep_yazi);opacity:.85}

#bar #sesd,#bar #temad{width:44px;height:38px;font-size:20px;border-radius:99px;
  padding:0;flex:none}

/* centik payi: saat ve kamera cubugunun altina girmesin */

#bar .geri,header .geri{font-size:30px;line-height:1;font-weight:400;
  text-decoration:none;color:var(--murekkep_yazi);opacity:.9;flex:none;

  min-width:46px;height:44px;margin-left:-6px;padding:0}

/* --- uc nokta menusu --- */
.mnk{width:44px;height:38px;flex:none;border:1px solid var(--cizgi);border-radius:99px;
  background:transparent;color:var(--murekkep);font-size:19px;line-height:1;
  padding:0;margin-left:auto;cursor:pointer;font-family:inherit}

    <span class="sk" id="bsaksi"></span>

    <button id="sesd">🔊</button>
  </span>
</div>
<div id="orta" class="ort"></div>

<script src="rozet.js?v=7"></script>
<script>if(typeof LG_papatyaMeta !== "function") window.LG_papatyaMeta = function(){ return {}; };</script>
<script src="ses.js?v=3"></script>
<script src="odul.js?v=1"></script>
<script>
const $ = s => document.querySelector(s);
const TRU = s => s.replace(/i/g,"İ").replace(/ı/g,"I").toUpperCase();
const TL  = n => n.toLocaleString("tr-TR");
const orta = $("#orta");

const SAKSI = [4,4,4,4,4, 5,5,5,5, 6,6, "T"];
const PUAN  = {4:2, 5:4, 6:6, 7:12};
const TAMBONUS = 15;
const ZORAD = ["kolay","orta","zor"];

let PAP = null, GECERLI = {}, KAC = {}, TANIM = null;
const KISI_VAR = ["Serpil","Zeynep"];
let KISILER = LG_kisiler(KISI_VAR), KISI = LG_kisiDogrula(KISILER) || KISILER[0];
let S = null, M = null, ADAY = null, giris = "", sira = [];

const anahtar = () => "lingo_papatya_" + KISI;
const metaAnahtar = () => "lingo_papatya_meta_" + KISI;
function bosMeta(){ return {tam:0, demlik:0, yardimsiz:0, kelime:0, oynanan:0,
  enPuan:0, enSeri:0, gunSeri:0, sonGun:"", rekor:[]}; }
function metaOku(){
  try{ const v = JSON.parse(localStorage.getItem(metaAnahtar()) || "null");
       M = Object.assign(bosMeta(), v && typeof v === "object" ? v : {}); }
  catch(e){ M = bosMeta(); }
  if(!Array.isArray(M.rekor)) M.rekor = [];
  return M;
}
function metaYaz(){ try{ localStorage.setItem(metaAnahtar(), JSON.stringify(M)); }catch(e){} }
function kaydet(){ try{ localStorage.setItem(anahtar(), JSON.stringify(S)); }catch(e){} }
function oku(){ try{ return JSON.parse(localStorage.getItem(anahtar()) || "null"); }
  catch(e){ return null; } }
function sil(){ try{ localStorage.removeItem(anahtar()); }catch(e){} S = null; }

/* ---- gun ---- */
function bugun(){ const t = new Date();
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" +
         String(t.getDate()).padStart(2,"0"); }
function karma(s){ let h = 2166136261;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h); }
function gunPapatyasi(){ return karma("papatya" + bugun()) % PAP.length; }
function gunYapragi(i, tohum){ const p = PAP[i][0].slice(1);
  return p[karma(tohum + p) % p.length]; }

/* ---- kelime havuzu ---- */
function adaylariKur(i){
  const harf = PAP[i][0], gobek = PAP[i][1], kume = new Set(harf.split(""));
  const out = {4:[], 5:[], 6:[], 7:[], tam:[]};
  for(const n of [4,5,6,7]){
    for(const w of GECERLI[n]){
      if(w.indexOf(gobek) < 0) continue;
      let ok = true;
      for(let k = 0; k < w.length; k++) if(!kume.has(w[k])){ ok = false; break; }
      if(!ok) continue;
      out[n].push(w);
      if(n === 7 && new Set(w).size === 7) out.tam.push(w);
    }
  }
  /* tam papatya cevabi gunluk kullanimdaki kelimelerden secilir */
  const gunlukTam = (PAP[i][4] || "").split(" ").filter(Boolean);
  if(gunlukTam.length) out.tam = gunlukTam;
  out.harf = harf; out.gobek = gobek; out.kume = kume;
  out.ars = {4:[], 5:[], 6:[], 7:[]};
  for(const n of [4,5,6,7]) out.ars[n] = out[n].filter(w => KAC[w] > 0);
  return out;
}
const arsivmi = w => (KAC[w] || 0) > 0;
const tammi = w => w.length === 7 && new Set(w).size === 7;

/* ---- durum ---- */
function bosDurum(i, gun){
  return {i:i, harf:PAP[i][0], gun:gun || null, saksi:SAKSI.map(() => null), bahce:[], puan:0,
          yardim:{filiz:0, su:0, tanim:0}, ipucu:{}, bitti:false, jokerKalan:2,
          jokerli:[], yaprak: gunYapragi(i, gun || ("s" + Date.now()))};
}

/* ---- ust bar ---- */
function barYaz(){
  if(!S){ $("#yer").textContent = "Papatya Çayı";
    $("#bsaksi").textContent = ""; $("#bpuan").textContent = ""; return; }
  const z = ZORAD[PAP[S.i][2]];
  $("#yer").textContent = (S.gun ? "Günün papatyası" : "Serbest papatya") + " · " + z;
  $("#bsaksi").textContent = "🫖 " + S.saksi.filter(Boolean).length + "/12";
  $("#bpuan").textContent = "🌼 " + TL(S.puan);
}
function uyar(m){
  const d = document.createElement("div"); d.className = "uyari"; d.textContent = m;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1600);
}
function ekran(html, ortala){
  orta.classList.toggle("ort", ortala !== false);
  orta.innerHTML = html; orta.scrollTop = 0; barYaz();
}
const SURUM = () => {
  try{ return new Date(document.lastModified).toLocaleString("tr-TR",
    {day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"}); }
  catch(e){ return "?"; }
};
const SURUMSAT = () => `<p class="kucuk" style="opacity:.45;margin-top:10px;
  text-align:center">Yüklü sürüm: ${SURUM()}</p>`;

/* ---- papatya cizimi ---- */
function papHtml(){
  const yp = sira.map((c, k) =>
    `<button type="button" class="yp"
      style="transform:rotate(${k*60}deg)" onclick="bas('${c}')"
      aria-label="${TRU(c)} harfi"><span
      style="display:block;transform:rotate(${-k*60}deg)">${TRU(c)}</span></button>`).join("");
  return `<div class="pap">${yp}
    <button type="button" class="gb" onclick="bas('${ADAY.gobek}')"
      aria-label="Göbek harfi ${TRU(ADAY.gobek)}">${TRU(ADAY.gobek)}</button></div>`;
}
function saksiHtml(){
  return `<div class="saksilar">` + SAKSI.map((t, k) => {
    const w = S.saksi[k], tam = t === "T";
    const ip = S.ipucu[k];
    const ik = w ? (tam ? "🌻" : "🌼") : (ip ? "🌱" : "🪴");
    return `<div class="sk${w ? " dolu" : ""}${tam ? " tam" : ""}${
      !w && ip ? " ipucu" : ""}" data-k="${k}">
      <span class="ik">${ik}</span>
      <i>${tam ? "tam papatya" : t + " harf"}</i>
      ${w ? TRU(w) : (ip ? TRU(ip) + "···" : "")}</div>`;
  }).join("") + `</div>`;
}
function oyunCiz(mesaj){
  const bos = S.saksi.filter(x => !x).length;
  ekran(papHtml() +
    `<input id="giris" type="text" inputmode="text" autocomplete="off"
       autocapitalize="characters" autocorrect="off" spellcheck="false"
       enterkeyhint="done" maxlength="9" placeholder="kelimeyi yaz ya da yaprağa dokun"
       aria-label="Kelime yaz" value="${TRU(giris)}"
       oninput="girisDegisti(this)"
       onkeydown="if(event.key==='Enter'){event.preventDefault();gonder();}">
     <div class="jok"><button type="button" onclick="jokerBas()"
       ${S.jokerKalan <= 0 || giris.indexOf("?") >= 0 ? "disabled" : ""}>🃏 JOKER HARF
       (${S.jokerKalan})</button></div>
     <div class="dgm">
       <button type="button" onclick="karistir()">🔀 ÇEVİR</button>
       <button type="button" onclick="geriSil()">← SİL</button>
       <button type="button" class="ana" onclick="gonder()">EKLE</button>
     </div>` + saksiHtml() +
    `<div class="yard">
       <button type="button" onclick="yardimSor('filiz')"
         ${S.yardim.filiz >= 2 || !bos ? "disabled" : ""}
         >🌱 filiz (${2 - S.yardim.filiz})</button>
       <button type="button" onclick="yardimSor('su')"
         ${S.yardim.su >= 1 || !bos ? "disabled" : ""}>💧 su</button>
       <button type="button" onclick="yardimSor('sozluk')"
         ${S.yardim.tanim >= 1 || !bos ? "disabled" : ""}>📖 sözlük</button>
       <button type="button" onclick="durEkran()">☰ menü</button>
     </div>
     <div id="not">${mesaj || `Göbek harfi <b>${TRU(ADAY.gobek)}</b> zorunlu ·
       kurallar için <b>☰ menü</b>`}</div>` +
    (S.bahce.length ? `<div class="bahce"><b>🪴 Bahçe · ${S.bahce.length} kelime</b>
       <div class="fisler">${S.bahce.map(w =>
         `<span class="fis">${TRU(w)}</span>`).join("")}</div></div>` : ""), false);
}

/* ---- giris ---- */
const KUC = s => s.replace(/I/g,"ı").replace(/İ/g,"i").toLowerCase();
window.bas = function(c){ if(giris.length < 9){ giris += c; girisYaz(); LG_ses("tus"); } };
window.geriSil = function(){ giris = giris.slice(0, -1); girisYaz(); jokerYaz(); };
function girisYaz(){ const e = $("#giris"); if(e) e.value = TRU(giris); }
function jokerYaz(){
  const b = document.querySelector(".jok button"); if(!b) return;
  b.textContent = `🃏 JOKER HARF (${S.jokerKalan})`;
  b.disabled = S.jokerKalan <= 0 || giris.indexOf("?") >= 0;
}
window.girisDegisti = function(el){
  const ham = KUC(el.value);
  let temiz = "";
  for(const c of ham){
    if(c === "?" && temiz.indexOf("?") < 0 && S.jokerKalan > 0){ temiz += "?"; continue; }
    if(ADAY && ADAY.kume.has(c)) temiz += c;
    if(temiz.length >= 9) break;
  }
  giris = temiz; el.value = TRU(giris);
};
window.jokerBas = function(){
  if(S.jokerKalan <= 0) return uyar("Joker harf kalmadı");
  if(giris.indexOf("?") >= 0) return uyar("Bir kelimede tek joker");
  if(giris.length >= 9) return;
  giris += "?"; girisYaz(); jokerYaz(); LG_ses("tus");
};
window.karistir = function(){
  for(let i = sira.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [sira[i], sira[j]] = [sira[j], sira[i]];
  }
  oyunCiz();
};
function not(h){ const e = $("#not"); if(e) e.innerHTML = h; }

const HARFLER = "abcçdefgğhıijklmnoöprsştuüvyz";
function jokerCoz(kalip){
  const n = kalip.length, k = kalip.indexOf("?");
  const kullanilan = new Set(S.saksi.filter(Boolean).concat(S.bahce));
  const bulunan = [];
  for(const c of HARFLER){
    const w = kalip.slice(0, k) + c + kalip.slice(k + 1);
    if(w.indexOf(ADAY.gobek) < 0) continue;
    if(kullanilan.has(w)) continue;
    if(GECERLI[n].indexOf(w) >= 0) bulunan.push(w);
  }
  bulunan.sort((a, b) => (KAC[b] || 0) - (KAC[a] || 0));
  return bulunan;
}
window.gonder = function(){
  const ham = giris; giris = ""; girisYaz();
  if(!ham) return;
  if(ham.length < 4){ jokerYaz(); return yanlis("En az <b>dört harf</b> gerekiyor."); }
  if(ham.length > 7){ jokerYaz(); return yanlis("En çok <b>yedi harf</b>."); }

  let w = ham, jokerli = false;
  if(ham.indexOf("?") >= 0){
    const bulunan = jokerCoz(ham);
    if(!bulunan.length){ jokerYaz();
      return yanlis(`<b>${TRU(ham)}</b>, jokerle de kelime çıkmadı,
        joker harcanmadı.`); }
    w = bulunan[0]; jokerli = true; S.jokerKalan--;
  } else {
    if(w.indexOf(ADAY.gobek) < 0)
      return yanlis(`Göbek harfi yok, her kelime <b>${TRU(ADAY.gobek)}</b> içermeli.`);
    for(let i = 0; i < w.length; i++) if(!ADAY.kume.has(w[i]))
      return yanlis(`<b>${TRU(w[i])}</b> bu papatyada yok.`);
    if(S.saksi.indexOf(w) >= 0 || S.bahce.indexOf(w) >= 0)
      return yanlis(`<b>${TRU(w)}</b> zaten yazıldı.`);
    if(ADAY[w.length].indexOf(w) < 0)
      return yanlis(`<b>${TRU(w)}</b>, sözlükte yok.`);
  }

  const ars = KAC[w] || 0, tam = tammi(w);
  let p = PUAN[w.length] * (ars ? 2 : 1);
  if(tam) p += TAMBONUS;
  if(jokerli){ p = Math.max(1, Math.round(p / 2)); S.jokerli.push(w); }
  let yer = -1;
  if(tam && !S.saksi[11]) yer = 11;
  else if(ars) for(let k = 0; k < SAKSI.length; k++)
    if(SAKSI[k] === w.length && !S.saksi[k]){ yer = k; break; }
  S.puan += p;
  if(yer >= 0){ S.saksi[yer] = w; delete S.ipucu[yer]; LG_ses("dogru"); }
  else { S.bahce.push(w); LG_ses("rozet"); }
  defterYaz(w);
  M.kelime = (M.kelime || 0) + 1;
  if(tam) M.tam = (M.tam || 0) + 1;
  /* kazanim: her kelime akce, tam papatya bir joker kuponu */
  if(window.LG_Odul) LG_Odul.kazan(tam ? 50 : 5, tam ? 1 : 0);
  metaYaz();

  let m = `<span class="iyi">${TRU(w)}</span> · +${p} puan`;
  if(jokerli) m += ` · 🃏 joker harf <b>${TRU(w[ham.indexOf("?")])}</b>, puanın yarısı`;
  if(tam) m += ` · <span class="ars">🌼 TAM PAPATYA +${TAMBONUS}</span>`;
  if(ars) m += ` · <span class="ars">yayında ${ars} kez soruldu</span>`;
  else m += ` · sözlükten geldi, <b>bahçeye</b> girdi`;
  if(S.saksi.filter(Boolean).length === 12) return bitir();
  kaydet(); oyunCiz(m);
};
function yanlis(m){ LG_ses("gecersiz"); not(`<span class="kotu">${m}</span>`); barYaz(); }

function defterYaz(w){
  if(!KISI || KISI === LG_KAYITSIZ) return;
  try{
    const a = "lingo_defter_" + KISI;
    const d = JSON.parse(localStorage.getItem(a) || "[]");
    d.push({w:w, n:w.length, h:w[0], k:2, t:Date.now()});
    while(d.length > 3000) d.shift();
    localStorage.setItem(a, JSON.stringify(d));
  }catch(e){}
}

/* ---- yardimlar ---- */
function bosSaksilar(){
  return SAKSI.map((t, k) => k).filter(k => !S.saksi[k]);
}
function saksiAdaylari(k){
  const t = SAKSI[k];
  const kullanilan = new Set(S.saksi.filter(Boolean).concat(S.bahce));
  if(t === "T") return ADAY.tam.filter(w => !kullanilan.has(w));
  return ADAY.ars[t].filter(w => !kullanilan.has(w));
}
/* --- yardimlarin ne yaptigini anlat, sonra kullan --- */
const YARDIMBILGI = {
  filiz: {em:"🌱", ad:"Filiz",
    ne:"Boş saksılardan birinin kelimesinin <b>ilk harfini</b> açar, o saksıda küçük bir filiz belirir.",
    hak:"Oyun başına 2 hak"},
  su: {em:"💧", ad:"Su",
    ne:"Boş saksıların her birinde <b>kaç aday kelime kaldığını</b> söyler; hangisinin kolay olduğunu görürsün.",
    hak:"Oyun başına 1 hak"},
  sozluk: {em:"📖", ad:"Sözlük",
    ne:"Boş saksılardan birinin kelimesinin <b>sözlük anlamını</b> gösterir, kelimeyi tarifinden bulursun.",
    hak:"Oyun başına 1 hak"}
};
window.yardimSor = function(tip){
  const y = YARDIMBILGI[tip]; if(!y) return;
  ekran(`<div class="kutu">
      <div class="eyebrow">Yardım</div>
      <h2>${y.em} ${y.ad}</h2>
      <p class="kucuk" style="font-size:14.5px;line-height:1.6">${y.ne}</p>
      <p class="kucuk" style="color:var(--altin_yazi)">${y.hak}</p>
      <button class="buton yesil" onclick="yardimKullan('${tip}')">KULLAN ▸</button>
      <button class="buton ikinci" onclick="geri()">VAZGEÇ</button>
    </div>`);
};
window.yardimKullan = function(tip){
  if(tip === "filiz") return filiz();
  if(tip === "su") return su();
  if(tip === "sozluk") return sozluk();
};
window.filiz = function(){
  const bos = bosSaksilar().filter(k => !S.ipucu[k]);
  if(!bos.length) return uyar("Açacak saksı kalmadı");
  /* ayni harfi iki kez acmasin: once kullanilmamis harflere bak */
  const kullanilan = new Set(Object.keys(S.ipucu || {}).map(k => S.ipucu[k]));
  const secenek = [];
  bos.forEach(k => saksiAdaylari(k).forEach(w => secenek.push([k, w[0]])));
  if(!secenek.length) return uyar("Bu saksı için aday kalmadı");
  const taze = secenek.filter(x => !kullanilan.has(x[1]));
  const havuz = taze.length ? taze : secenek;
  const sec = havuz[Math.floor(Math.random() * havuz.length)];
  const k = sec[0];
  S.ipucu[k] = sec[1];
  S.yardim.filiz++; kaydet();
  const tur = SAKSI[k] === "T" ? "tam papatya" : SAKSI[k] + " harfli";
  oyunCiz(`🌱 Bir filiz açtı: <b>${tur}</b> saksının kelimesi
    <b>${TRU(S.ipucu[k])}</b> ile başlıyor.`);
};
window.su = function(){
  S.yardim.su++; kaydet();
  const say = {};
  bosSaksilar().forEach(k => { const t = SAKSI[k] === "T" ? "tam papatya" : SAKSI[k] + " harf";
    say[t] = (say[t] === undefined ? saksiAdaylari(k).length : say[t]); });
  const m = Object.keys(say).map(t => `${t}: <b>${say[t]}</b> aday`).join(" · ");
  oyunCiz("💧 Boş saksılarda kaç kelime kaldı, " + m);
};
window.sozluk = function(){
  const bos = bosSaksilar();
  if(!bos.length) return uyar("Boş saksı yok");
  const sec = [];
  bos.forEach(k => saksiAdaylari(k).forEach(w => { if(TANIM && TANIM[w]) sec.push([k, w]); }));
  if(!sec.length) return uyar("Sözlük kaydı bulunamadı");
  /* daha once anlami verilen kelimeyi tekrarlamasin */
  S.verilen = S.verilen || [];
  const taze = sec.filter(x => S.verilen.indexOf(x[1]) < 0);
  const havuz = taze.length ? taze : sec;
  const [k, w] = havuz[Math.floor(Math.random() * havuz.length)];
  S.verilen.push(w);
  S.yardim.tanim++; kaydet();
  const t = SAKSI[k] === "T" ? "tam papatya" : SAKSI[k] + " harfli";
  oyunCiz(`📖 Bir ${t} saksının kelimesinin anlamı: <b>${TANIM[w]}</b>`);
};

/* ---- bitis ---- */
function bitir(){
  S.bitti = true;
  const yardimsiz = !S.yardim.filiz && !S.yardim.su && !S.yardim.tanim;
  M.demlik = (M.demlik || 0) + 1;
  M.oynanan = (M.oynanan || 0) + 1;
  if(yardimsiz) M.yardimsiz = 1;
  M.enPuan = Math.max(M.enPuan || 0, S.puan);
  if(S.gun){
    const d = new Date(S.gun + "T12:00:00");
    const onceki = M.sonGun ? new Date(M.sonGun + "T12:00:00") : null;
    const fark = onceki ? Math.round((d - onceki) / 86400000) : 99;
    M.gunSeri = (fark === 1) ? (M.gunSeri || 0) + 1 : 1;
    M.sonGun = S.gun;
    M.enSeri = Math.max(M.enSeri || 0, M.gunSeri);
  }
  if(window.LG_Odul) LG_Odul.kazan(100, 0);      /* 12 saksi tamam primi */
  M.rekor.push({p:S.puan, z:ZORAD[PAP[S.i][2]], h:PAP[S.i][0],
    t:new Date().toLocaleDateString("tr-TR")});
  M.rekor.sort((a, b) => b.p - a.p); M.rekor = M.rekor.slice(0, 5);
  metaYaz(); kaydet();
  LG_ses("rozet");
  sonEkran();
}
function tumKelimeler(){
  const bulundu = new Set(S.saksi.filter(Boolean).concat(S.bahce));
  let top = 0, bul = 0, blok = "";
  for(const n of [4,5,6,7]){
    const lst = ADAY[n];
    if(!lst.length) continue;
    top += lst.length;
    const parca = lst.map(w => {
      const v = bulundu.has(w);
      if(v) bul++;
      return v ? `<b>${TRU(w)}</b>` : (arsivmi(w) ? `<em>${TRU(w)}</em>` : TRU(w));
    }).join("  ");
    blok += `<div><i>${n} harf · ${lst.length} kelime</i><p>${parca}</p></div>`;
  }
  return {top:top, bul:bul, html:blok};
}
function sonEkran(){
  const yeniRoz = LG_yeni(KISI);
  const tamW = S.saksi[11];
  const tk = tumKelimeler();
  ekran(`<div class="kutu ort">
      <div class="eyebrow">Demlik doldu</div>
      <h1 style="margin-top:5px">🫖 On iki saksı tamam</h1>
      <div class="tutar" style="margin:12px 0 2px">${TL(S.puan)}</div>
      <p class="kucuk">puan · ${ZORAD[PAP[S.i][2]]} papatya · göbek
        <b>${TRU(PAP[S.i][1])}</b></p>
      <div class="ozet">
        <div><b>12</b><span>saksı</span></div>
        <div><b>${S.bahce.length}</b><span>bahçe</span></div>
        <div><b>${S.saksi.filter(w => arsivmi(w)).length}</b><span>yayından</span></div>
        <div><b>${LG_acik(KISI).length}</b><span>nişan</span></div>
      </div>
      ${tamW ? `<p class="kucuk">Tam papatya: <b>${TRU(tamW)}</b></p>` : ""}

  let i;
  if(gun){ i = gunPapatyasi(); }
  else {
    const oynanan = new Set((M.rekor || []).map(r => r.h));
    let dene = 0;
    do { i = Math.floor(Math.random() * PAP.length); dene++; }
    while(oynanan.has(PAP[i][0]) && dene < 40);
  }
  S = bosDurum(i, gun || null);
  ADAY = adaylariKur(i);
  sira = PAP[i][0].slice(1).split("");
  giris = ""; kaydet(); oyunCiz();
};

  ekran(`<div class="kutu">

  KISI = a; try{ localStorage.setItem("lingo_kisi", a); }catch(e){}

function devamEkran(){
  ekran(`<div class="kutu">
      <div class="eyebrow">Yarım kalan papatya</div>
      <h2>${KISI}, çayın demleniyor</h2>

      <button class="buton ikinci" onclick="kasaEkran()">📓 REKORLAR</button>
      <a class="buton ikinci" href="index.html">ANA SAYFA</a>
      ${SURUMSAT()}

function basla(){
  KISILER = LG_kisiler(KISI_VAR);
  if(!KISI || KISI === LG_KAYITSIZ || KISILER.indexOf(KISI) < 0) return kisiEkran();
  metaOku();
  S = oku();
  /* papatya listesi degisince eski kayit baska bir papatyaya denk gelebilir */
  if(S && (!PAP[S.i] || S.harf !== PAP[S.i][0] ||
     !Array.isArray(S.saksi) || S.saksi.length !== 12)) S = null;
  if(!S) return girisEkran();
  ADAY = adaylariKur(S.i);
  sira = PAP[S.i][0].slice(1).split("");
  if(!S.yaprak) S.yaprak = gunYapragi(S.i, S.gun || "s");
  if(!S.ipucu) S.ipucu = {};
  if(typeof S.jokerKalan !== "number") S.jokerKalan = 2;
  if(!Array.isArray(S.jokerli)) S.jokerli = [];
  if(S.bitti) return sonEkran();
  if(!S.saksi.filter(Boolean).length && !S.bahce.length) return oyunCiz();
  devamEkran();
}

document.addEventListener("keydown", e => {
  if(!S || S.bitti || !ADAY) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const el = $("#giris"); if(!el) return;
  if(document.activeElement === el) return;   /* input kendi isini yapiyor */
  const k = e.key;
  if(k === "Enter"){ e.preventDefault(); gonder(); }
  else if(k === "Backspace"){ e.preventDefault(); geriSil(); }
  else if(k === "?"){ e.preventDefault(); jokerBas(); }
  else if(k.length === 1){
    const c = k.toLocaleLowerCase("tr");
    if(ADAY.kume.has(c)){ e.preventDefault(); bas(c); }
  }
});

function yukle(){
  LG_sesDugme($("#sesd"));
  orta.innerHTML = `<div class="kutu ort"><h2>Papatya demleniyor…</h2>
    <p class="kucuk">Kelime havuzları yükleniyor.</p></div>`;
  Promise.all([
    fetch("papatya-veri.json").then(r => r.json()),
    fetch("oyun-veri.json").then(r => r.json())
  ]).then(([pv, ov]) => {
    PAP = pv.p; KAC = ov.kac || {};
    for(const n of [4,5,6,7]) GECERLI[n] = ov.gecerli[n];
    fetch("oyun-tanim.json").then(r => r.json()).then(t => { TANIM = t; }).catch(() => {});
    basla();
  }).catch(e => {
    orta.classList.add("ort");
    orta.innerHTML = `<div class="kutu ort"><h2>Açılamadı</h2>
      <p class="kucuk">Sayfa güncellendiği için tarayıcıda eski bir dosya kalmış

      <button class="buton" onclick="location.reload(true)">TEMİZ YÜKLE</button>
      <a class="buton ikinci" href="index.html">ANA SAYFA</a></div>`;
  });
}
