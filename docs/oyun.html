<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1720">
<title>Lingo Türkiye</title>
<style>
:root{
  --kagit:#0f1720; --kart:#1a2430; --murekkep:#f2f5f8; --soluk:#8b98a6;
  --cizgi:#2c3947; --yesil:#2e9e5b; --sari:#e6b22e; --gri:#3a4756;
  --kirmizi:#d94a5a; --altin:#f4c95d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--kagit);color:var(--murekkep);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
button{font:inherit;cursor:pointer}
/* ust bar */
#bar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0a1119;
  border-bottom:1px solid var(--cizgi);flex:none}
#bar .etap{font-size:13px;letter-spacing:1px;font-weight:700;color:var(--altin);
  text-transform:uppercase}
#bar .para{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
#bar .para em{font-style:normal;color:var(--soluk);font-weight:600;font-size:13px}
#sure{width:100%;height:4px;background:#22303d;flex:none}
#sure i{display:block;height:100%;background:var(--altin);width:100%;transition:width .1s linear}
#sure.az i{background:var(--kirmizi)}
/* orta alan */
#orta{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:10px 12px;gap:10px;min-height:0}
.baslik{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--soluk);
  font-weight:700;text-align:center}
/* tahta */
#tahta{display:grid;gap:5px;justify-content:center}
#tahta .satir{display:grid;gap:5px}
.hucre{width:var(--hg);height:var(--hg);border:2px solid var(--cizgi);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:800;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:calc(var(--hg)*.52);
  background:#141d27;transition:background .15s,border-color .15s}
.hucre.ilk{border-color:#4a5a6b;color:var(--altin)}
.hucre.dolu{border-color:#4a5a6b}
.hucre.tam{background:var(--yesil);border-color:var(--yesil);color:#fff}
.hucre.var{background:var(--sari);border-color:var(--sari);color:#231a00}
.hucre.yok{background:var(--gri);border-color:var(--gri);color:#8fa0b0}
.satir.aktif .hucre{border-color:#5d6f82}
.satir.sarsil{animation:sars .35s}
@keyframes sars{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
/* puzzle */
.ipucu{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;
  padding:13px 15px;max-width:460px;text-align:center;font-size:17px;line-height:1.45}
.ipucu b{color:var(--altin);display:block;font-size:12px;letter-spacing:1.2px;
  text-transform:uppercase;margin-bottom:6px}
/* klavye */
#klavye{flex:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  background:#0a1119;border-top:1px solid var(--cizgi)}
#klavye .sr{display:flex;gap:4px;justify-content:center;margin-bottom:4px}
#klavye button{flex:1 1 0;min-width:0;height:46px;border:0;border-radius:7px;
  background:#3a4756;color:#fff;font-weight:700;font-size:16px;padding:0}
#klavye button.gnis{flex:1.9 1 0;font-size:13px;letter-spacing:.5px}
#klavye button.dar{flex:1.25 1 0;font-size:12.5px;letter-spacing:.5px}
#klavye button.tam{background:var(--yesil)}
#klavye button.var{background:var(--sari);color:#231a00}
#klavye button.yok{background:#1e2933;color:#5d6b7a}
#klavye button:active{opacity:.7}
/* kartlar / ekranlar */
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;
  padding:22px 20px;max-width:460px;width:100%;text-align:center}
.kutu h1{font-size:32px;margin:0 0 4px;letter-spacing:-.5px}
.kutu h2{font-size:21px;margin:0 0 10px}
.kutu p{color:var(--soluk);margin:0 0 12px;font-size:15.5px;line-height:1.55}
.kutu p b{color:var(--murekkep)}
.buton{display:block;width:100%;background:var(--altin);color:#1a1200;border:0;
  border-radius:12px;padding:15px;font-weight:800;font-size:17px;margin-top:8px}
.buton.ikinci{background:transparent;color:var(--murekkep);border:1.5px solid var(--cizgi)}
.tutar{font-size:40px;font-weight:800;color:var(--altin);letter-spacing:-1px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.kucuk{font-size:13.5px;color:var(--soluk);line-height:1.5}
.kural{text-align:left;font-size:14.5px;color:var(--soluk);line-height:1.6;
  margin:10px 0 0;padding-left:18px}
.kural li{margin-bottom:5px}
.kural b{color:var(--murekkep)}
.ornekler{display:flex;gap:6px;justify-content:center;margin:10px 0}
.ornekler span{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-family:ui-monospace,Menlo,monospace}
.uyari{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#f2f5f8;
  color:#0f1720;padding:9px 16px;border-radius:999px;font-weight:700;font-size:14.5px;
  z-index:20;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.sonuc{font-size:17px;font-weight:700;text-align:center}
.sonuc.iyi{color:var(--yesil)} .sonuc.kotu{color:var(--kirmizi)}
.sonuc .kw{font-family:ui-monospace,Menlo,monospace;letter-spacing:2px;
  color:var(--altin);display:block;font-size:22px;margin-top:3px}
table.merd{width:100%;border-collapse:collapse;margin:12px 0 4px;font-size:15.5px}
table.merd td{padding:6px 2px;border-bottom:1px solid var(--cizgi);text-align:left;
  color:var(--soluk)}
table.merd td:last-child{text-align:right;color:var(--murekkep);
  font-variant-numeric:tabular-nums}
table.merd tr:last-child td{border-bottom:0;color:var(--altin)}
table.merd tr:last-child td b{color:var(--altin)}
.gizli{display:none!important}
</style></head><body>

<div id="bar"><span class="etap" id="etapAd">LİNGO TÜRKİYE</span>
  <span class="para" id="para"><em>₺</em>0</span></div>
<div id="sure" class="gizli"><i></i></div>
<div id="orta"></div>
<div id="klavye" class="gizli"></div>

<script src="rozet.js"></script>
<script>
let VERI = null, TANIM = {};
const TRU = s => s.replace(/i/g,"İ").replace(/ı/g,"I").toUpperCase();
const TL  = n => n.toLocaleString("tr-TR");
const $   = s => document.querySelector(s);
const orta = $("#orta"), klv = $("#klavye"), bar = $("#etapAd"), paraEl = $("#para");
const sureKap = $("#sure"), sureBar = sureKap.querySelector("i");

const SATIR = 5, SURE = 20;
const ETAPLAR = [
  {ad:"1. ETAP", kelime:[4,4,4], puz:[8,9],   pk:1000, pp:2000},
  {ad:"2. ETAP", kelime:[5,5,5], puz:[9,10],  pk:2000, pp:3000},
  {ad:"3. ETAP", kelime:[6,6,6], puz:[10,11], pk:3000, pp:4000}
];
const TAMBONUS = 1000;
const FINAL = {sure:200, dizi:[4,5,6,7], carpan:{4:0.5, 5:1, 6:2, 7:2},
               superEk:250000, satir:5};

let para = 0, kullanilan = new Set(), sayac = null;
const GECERLI = {};

/* ---------------- istatistige dayali kelime secimi ---------------- */
const KUM = {};
function kumul(n){
  if(KUM[n]) return KUM[n];
  const a = VERI.arsiv[n], c = []; let t = 0;
  for(const [w, k] of a){ t += k; c.push(t); }
  return KUM[n] = {c, t, a};
}
function agirlikliArsiv(n){
  const {c, t, a} = kumul(n), r = Math.random()*t;
  let lo = 0, hi = c.length-1;
  while(lo < hi){ const m = (lo+hi)>>1; if(c[m] <= r) lo = m+1; else hi = m; }
  return a[lo][0];
}
function kelimeSec(n){
  n = String(n);
  const Y = VERI.yeni[n] || [];
  for(let t = 0; t < 400; t++){
    let w;
    if(Math.random() < 0.80 || !Y.length) w = agirlikliArsiv(n);
    else w = Y[Math.floor(Math.pow(Math.random(), 1.8) * Y.length)];
    if(w && !kullanilan.has(w)){ kullanilan.add(w); return w; }
  }
  return agirlikliArsiv(n);
}
function puzzleSec(nler){
  for(let t = 0; t < 400; t++){
    const n = String(nler[Math.floor(Math.random()*nler.length)]);
    const L = VERI.puzzle[n]; if(!L || !L.length) continue;
    const cikmis = Math.random() < 0.80;
    const alt = L.filter(x => (x[2] > 0) === cikmis);
    const hav = alt.length ? alt : L;
    let sec;
    if(cikmis && alt.length){
      let top = 0; for(const x of hav) top += x[2];
      let r = Math.random()*top;
      for(const x of hav){ r -= x[2]; if(r <= 0){ sec = x; break; } }
      sec = sec || hav[0];
    } else sec = hav[Math.floor(Math.pow(Math.random(),1.6)*hav.length)];
    if(sec && !kullanilan.has(sec[0])){ kullanilan.add(sec[0]); return sec; }
  }
  return VERI.puzzle["9"][0];
}

/* ---------------- yardimcilar ---------------- */
function defterYaz(w, hak){
  try{
    const ad = localStorage.getItem("lingo_kisi");
    if(!ad || ad === "__kayitsiz__") return;
    const k = "lingo_defter_" + ad;
    const d = JSON.parse(localStorage.getItem(k) || "[]");
    d.push({w: w, n: w.length, h: w[0], k: hak, t: Date.now()});
    while(d.length > 3000) d.shift();
    localStorage.setItem(k, JSON.stringify(d));
  }catch(e){}
}
function paraYaz(){ paraEl.innerHTML = '<em>₺</em>' + TL(para); }
function uyar(m){
  const d = document.createElement("div"); d.className = "uyari"; d.textContent = m;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1300);
}
function renk(gizli, tah){
  const n = gizli.length, r = new Array(n).fill("yok"), kal = {};
  for(let i = 0; i < n; i++)
    if(tah[i] === gizli[i]) r[i] = "tam"; else kal[gizli[i]] = (kal[gizli[i]]||0)+1;
  for(let i = 0; i < n; i++)
    if(r[i] !== "tam" && kal[tah[i]] > 0){ r[i] = "var"; kal[tah[i]]--; }
  return r;
}
function durdur(){ if(sayac){ clearInterval(sayac); sayac = null; } }
function sureGoster(g){ sureKap.classList.toggle("gizli", !g); }
function sureBasla(sn, bitince, tikla){
  durdur(); sureGoster(true); sureKap.classList.remove("az");
  const bas = Date.now(), top = sn*1000; let son = sn;
  sayac = setInterval(() => {
    const kalan = Math.max(0, top - (Date.now()-bas));
    sureBar.style.width = (100*kalan/top) + "%";
    sureKap.classList.toggle("az", kalan < top*0.31);
    const s2 = Math.ceil(kalan/1000);
    if(tikla && s2 !== son){ son = s2; tikla(s2); }
    if(kalan <= 0){ durdur(); bitince(); }
  }, 100);
}

/* ---------------- klavye ---------------- */
const DIZ = ["ertyuıopğü", "asdfghjklşi", "zcvbnmöç"];   // Türkçe Q
let klvDurum = {}, klvTus = {};
function klavyeCiz(gir, sil, gonder){
  klv.innerHTML = ""; klvTus = {};
  DIZ.forEach((sr, k) => {
    const d = document.createElement("div"); d.className = "sr";
    for(const c of sr){
      const b = document.createElement("button"); b.textContent = TRU(c);
      b.onclick = () => gir(c); klvTus[c] = b; d.appendChild(b);
    }
    if(k === 1){ const b = document.createElement("button");     // SİL, TAMAM'in ustunde
      b.className = "dar"; b.textContent = "SİL"; b.onclick = sil; d.appendChild(b); }
    if(k === 2){ const b = document.createElement("button");
      b.className = "gnis"; b.textContent = "TAMAM"; b.onclick = gonder; d.appendChild(b); }
    klv.appendChild(d);
  });
  klv.classList.remove("gizli");
  for(const c in klvDurum) if(klvTus[c]) klvTus[c].className = klvDurum[c];
}
function klvBoya(tah, r){
  const oncelik = {tam:3, var:2, yok:1};
  for(let i = 0; i < tah.length; i++){
    const c = tah[i];
    if((oncelik[klvDurum[c]]||0) < oncelik[r[i]]){
      klvDurum[c] = r[i]; if(klvTus[c]) klvTus[c].className = r[i];
    }
  }
}

/* ---------------- lingo kelimesi ---------------- */
function hucreBoy(n){
  const g = Math.min(window.innerWidth - 30, 430);
  return Math.max(30, Math.min(56, Math.floor((g - (n-1)*5) / n)));
}
function kelimeOyna(n, odul, opt, bitti){
  opt = opt || {};
  const gizli = opt.kelime || kelimeSec(n);
  const satirSay = opt.satir || SATIR;
  let sat = 0, giris = gizli[0];
  klvDurum = {};
  orta.innerHTML = `<div class="baslik" id="ust"></div>
    <div id="tahta" style="--hg:${hucreBoy(n)}px"></div>
    ${opt.pas ? '<button class="buton ikinci" id="pasb" disabled>PAS</button>' : ''}
    <div class="kucuk" id="alt"></div>`;
  const tahta = $("#tahta");
  for(let r = 0; r < satirSay; r++){
    const d = document.createElement("div"); d.className = "satir";
    d.style.gridTemplateColumns = `repeat(${n}, var(--hg))`;
    for(let i = 0; i < n; i++){
      const h = document.createElement("div"); h.className = "hucre" + (i===0?" ilk":"");
      if(i === 0) h.textContent = TRU(gizli[0]);
      d.appendChild(h);
    }
    tahta.appendChild(d);
  }
  const satirlar = [...tahta.children];
  let pasli = false;
  if(opt.pas){
    const pb = $("#pasb");
    pb.style.cssText = "margin-top:8px;max-width:430px";
    pb.onclick = () => {
      if(!pasli && sat > 0){ pasli = true; cevabiGoster("Pas", opt.pas); } };
  }
  function cevabiGoster(etiket, sonra){
    if(!opt.sureyok) durdur();              // finalde global saat calismaya devam eder
    const pb = $("#pasb"); if(pb){ pb.disabled = true; }
    klv.classList.add("gizli");
    const alt = $("#alt");
    if(alt) alt.innerHTML =
      `<div style="margin-top:9px;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;
         color:var(--soluk);font-weight:700">${etiket} · doğru cevap</div>
       <div style="font-family:ui-monospace,Menlo,monospace;font-size:25px;font-weight:800;
         letter-spacing:4px;color:var(--altin);margin-top:3px">${TRU(gizli)}</div>`;
    setTimeout(sonra, 1900);
  }
  function pasYaz(){
    const pb = $("#pasb");
    if(pb){ pb.disabled = sat < 1;
      pb.textContent = sat < 1 ? "PAS — önce bir tahmin yapın" : "PAS — başka kelime ▸"; }
  }
  let kalanSn = SURE;
  function ustYaz(){
    const sn = opt.sureyok ? "" : ` · ${kalanSn} SN`;
    $("#ust").textContent = `${n} HARFLİ · ${satirSay - sat} HAK${sn} · ₺${TL(odul)}`;
    satirlar.forEach((s, k) => s.classList.toggle("aktif", k === sat));
  }
  function yaz(){
    const h = satirlar[sat].children;
    for(let i = 1; i < n; i++){
      h[i].textContent = giris[i] ? TRU(giris[i]) : "";
      h[i].className = "hucre" + (giris[i] ? " dolu" : "");
    }
  }
  function tik(){
    if(opt.sureyok) return;
    kalanSn = SURE; ustYaz();
    sureBasla(SURE, () => sonuclandir(null), sn => { kalanSn = sn; ustYaz(); });
  }
  function gir(c){ if(giris.length < n){ giris += c; yaz(); } }
  function sil(){ if(giris.length > 1){ giris = giris.slice(0, -1); yaz(); } }
  function gonder(){
    if(giris.length < n){ uyar("Harfler eksik"); sarsil(); return; }
    if(!GECERLI[n].has(giris)){ uyar("Sözlükte yok"); sarsil(); return; }
    sonuclandir(giris);
  }
  function sarsil(){
    satirlar[sat].classList.add("sarsil");
    setTimeout(() => satirlar[sat].classList.remove("sarsil"), 360);
  }
  function sonuclandir(tah){
    if(!opt.sureyok) durdur();
    if(tah === null){
      const h = satirlar[sat].children;
      for(let i = 1; i < n; i++){ h[i].textContent = "·"; h[i].className = "hucre yok"; }
      uyar("Süre doldu");
    } else {
      const r = renk(gizli, tah), h = satirlar[sat].children;
      for(let i = 0; i < n; i++) h[i].className = "hucre " + r[i];
      klvBoya(tah, r);
      if(tah === gizli){
        defterYaz(gizli, sat + 1);
        if(!opt.odulYok){ para += odul; paraYaz(); }
        if(!opt.sureyok) sureGoster(false);
        return setTimeout(() => bitti(true, gizli), 620);
      }
    }
    sat++; giris = gizli[0];
    if(sat >= satirSay){
      defterYaz(gizli, 0);
      if(!opt.sureyok) sureGoster(false);
      if(opt.sureyok) return cevabiGoster("Bilinemedi", () => bitti(false, gizli));
      return setTimeout(() => bitti(false, gizli), 500); }
    ustYaz(); yaz(); pasYaz(); tik();
  }
  ustYaz(); yaz(); pasYaz();
  klavyeCiz(gir, sil, gonder);
  tik();
  return {gonder, sil, gir};
}

/* ---------------- puzzle ---------------- */
function puzzleOyna(nler, tamOdul, bitti){
  const [kelime, tanim] = puzzleSec(nler);
  const n = kelime.length;
  const TOPSURE = 60, ARALIK = 8, TABAN = 0.2;
  let acik = new Set([0]), gir = new Array(n).fill(null), odul = tamOdul, kapandi = false;
  gir[0] = kelime[0];
  klvDurum = {};
  orta.innerHTML = `<div class="baslik" id="ust"></div>
    <div class="ipucu"><b>${n} harfli · puzzle</b><span id="tn"></span></div>
    <div id="tahta" style="--hg:${hucreBoy(n)}px"></div>
    <div class="kucuk" id="alt">Süre azaldıkça harfler açılır, açılan her harf ödülü düşürür.</div>`;
  $("#tn").textContent = tanim;
  const tahta = $("#tahta");
  const d = document.createElement("div"); d.className = "satir aktif";
  d.style.gridTemplateColumns = `repeat(${n}, var(--hg))`;
  for(let i = 0; i < n; i++) d.appendChild(Object.assign(
    document.createElement("div"), {className: "hucre"}));
  tahta.appendChild(d);
  const h = d.children;
  let kalanSn = TOPSURE;
  function odulHesap(){
    const ek = acik.size - 1;
    const v = Math.max(tamOdul*TABAN, tamOdul*(1 - 0.2*ek));
    odul = Math.round(v/100)*100;
  }
  function ustYaz(){
    $("#ust").textContent = `PUZZLE · ${kalanSn} SN · ₺${TL(odul)}`;
  }
  function yaz(){
    for(let i = 0; i < n; i++){
      if(acik.has(i)){ h[i].textContent = TRU(kelime[i]); h[i].className = "hucre ilk"; }
      else { h[i].textContent = gir[i] ? TRU(gir[i]) : "";
             h[i].className = "hucre" + (gir[i] ? " dolu" : ""); }
    }
  }
  function tahmin(){
    let t = "";
    for(let i = 0; i < n; i++){
      if(acik.has(i)) t += kelime[i];
      else if(gir[i]) t += gir[i];
      else return null;
    }
    return t;
  }
  function harfAc(){
    const kapali = [];
    for(let i = 1; i < n; i++) if(!acik.has(i)) kapali.push(i);
    if(!kapali.length) return false;
    const yeni = kapali[Math.floor(Math.random()*kapali.length)];
    acik.add(yeni); gir[yeni] = null;
    odulHesap(); ustYaz(); yaz();
    return true;
  }
  function harfGir(c){
    for(let i = 0; i < n; i++){
      if(acik.has(i)) continue;
      if(!gir[i]){ gir[i] = c; return yaz(); }
    }
  }
  function sil(){
    for(let i = n-1; i >= 0; i--){
      if(acik.has(i)) continue;
      if(gir[i]){ gir[i] = null; return yaz(); }
    }
  }
  function bitirPuzzle(kazandi){
    if(kapandi) return; kapandi = true;
    durdur(); sureGoster(false);
    for(let i = 0; i < n; i++){
      h[i].textContent = TRU(kelime[i]);
      h[i].className = "hucre " + (kazandi ? "tam" : "yok");
    }
    if(kazandi){ para += odul; paraYaz(); }
    setTimeout(() => bitti(kazandi, kelime), kazandi ? 750 : 950);
  }
  function dene(t){
    if(kapandi) return;
    if(t === kelime) return bitirPuzzle(true);
    uyar("Olmadı — bir harf açılıyor");
    sonAcma = Date.now() - bas;          // sayaci sifirla
    if(!harfAc()) return bitirPuzzle(false);
    yaz();
  }
  ustYaz(); yaz();
  klavyeCiz(harfGir, sil, () => {
    const t = tahmin();
    if(t === null){ uyar("Boş kutular var"); return; }
    dene(t);
  });
  durdur(); sureGoster(true); sureKap.classList.remove("az");
  const bas = Date.now(); let sonAcma = 0;
  sayac = setInterval(() => {
    const gecen = Date.now() - bas, kalan = Math.max(0, TOPSURE*1000 - gecen);
    sureBar.style.width = (100*kalan/(TOPSURE*1000)) + "%";
    sureKap.classList.toggle("az", kalan < TOPSURE*1000*0.25);
    const yeniSn = Math.ceil(kalan/1000);
    if(yeniSn !== kalanSn){ kalanSn = yeniSn; ustYaz(); }
    if(gecen - sonAcma >= ARALIK*1000){ sonAcma = gecen; harfAc(); }
    if(kalan <= 0){ uyar("Süre doldu"); bitirPuzzle(false); }
  }, 100);
}

/* ---------------- akis ---------------- */
function ekran(html){
  durdur(); sureGoster(false); klv.classList.add("gizli");
  orta.innerHTML = `<div class="kutu">${html}</div>`;
}
function giris(){
  bar.textContent = "LİNGO TÜRKİYE"; para = 0; kullanilan = new Set(); paraYaz();
  const en = +(localStorage.getItem("lingo_oyun_rekor") || 0);
  ekran(`<h1>LİNGO</h1>
    <p>Kelimeler <b>5–445. bölümün cevap arşivinden</b> geliyor: yayında kaç kez
       çıktıysa gelme ihtimali o kadar yüksek. Her beş kelimeden dördü daha önce
       ekrana çıkmış bir cevap, biri sözlükten yeni.</p>
    <div class="ornekler"><span style="background:var(--yesil);color:#fff">A</span>
      <span style="background:var(--sari);color:#231a00">B</span>
      <span style="background:var(--gri);color:#8fa0b0">C</span></div>
    <p class="kucuk"><b style="color:var(--yesil)">Yeşil</b> doğru yerde ·
      <b style="color:var(--sari)">Sarı</b> kelimede var, yeri yanlış ·
      <b>Gri</b> kelimede yok</p>
    <ul class="kural">
      <li>İlk harf hazır verilir, <b>5 tahmin</b> hakkınız vardır.</li>
      <li>Her tahmin için <b>20 saniye</b>. Süre biterse hak yanar.</li>
      <li>Puzzle'da ipucu kelimenin TDK tanımıdır. <b>60 saniye</b> vardır; süre
          azaldıkça harfler kendiliğinden açılır, yanlış tahmin de bir harf açar.
          <b>Her açılan harf ödülü düşürür</b> — erken bilen çok kazanır.</li>
      <li>Bir etaptaki <b>üç kelimeyi de</b> bilirseniz <b>+₺1.000</b> prim.</li>
      <li>Final <b>200 saniye</b>: 4, 5, 6 ve 7 harfli birer kelime, her biri için
          5 hak. Ne kadar yukarı çıkarsanız üç etapta biriktirdiğinizin o kadar
          büyük katını alırsınız — 7 harfliyi bilirseniz <b>iki katı + ₺250.000</b>,
          bilemezseniz <b>sıfır</b>.</li>
    </ul>
    ${en ? `<p class="kucuk" style="margin-top:12px">En iyi kazancınız: <b>₺${TL(en)}</b></p>` : ""}
    <button class="buton" onclick="basla()">OYNA</button>`);
}
let oyunBasiRoz = [];
function basla(){
  const k = LG_kisi();
  oyunBasiRoz = (k && k !== LG_KAYITSIZ) ? LG_acik(k).map(r=>r.a) : [];
  etapBasla(0);
}
function rozOzet(){
  const k = LG_kisi();
  if(!k || k === LG_KAYITSIZ) return "";
  const U = LG_unvan(LG_defter(k).length);
  const yeni = LG_acik(k).filter(r => oyunBasiRoz.indexOf(r.a) < 0);
  return `<div class="not" style="text-align:left;margin-top:12px">
      <b style="color:var(--altin)">${U.simdi.ad}</b>
      <span style="color:var(--soluk);font-size:13px"> · ${k}${U.sonraki
        ? " · " + U.sonraki.ad + " için " + U.kalan + " kelime" : ""}</span>
      ${yeni.length ? `<div style="margin-top:9px;font-size:13.5px">Bu oyunda kazandın:
        ${yeni.map(r=>r.e+" <b>"+r.a+"</b>").join(" · ")}</div>` : ""}</div>`;
}

function etapBasla(e){
  if(e >= ETAPLAR.length) return finalGiris();
  const E = ETAPLAR[e];
  bar.textContent = E.ad;
  ekran(`<h2>${E.ad}</h2>
    <p>${E.kelime.length} tane <b>${E.kelime[0]} harfli</b> kelime ve ardından
       ${E.puz.join("–")} harfli bir puzzle.</p>
    <p class="kucuk">Her kelime <b>₺${TL(E.pk)}</b> · puzzle <b>₺${TL(E.pp)}</b><br>
       ${E.kelime.length} kelimenin hepsini bilirseniz <b>+₺${TL(TAMBONUS)}</b> prim<br>
       puzzle ödülü açılan her harfle azalır</p>
    <button class="buton" onclick="etapSira(${e},0)">BAŞLA</button>`);
}
function etapSira(e, k, dogruSay){
  dogruSay = dogruSay || 0;
  const E = ETAPLAR[e];
  if(k >= E.kelime.length){
    if(dogruSay === E.kelime.length){
      para += TAMBONUS; paraYaz();
      ekran(`<div class="sonuc iyi">${E.kelime.length}'te ${E.kelime.length}!
        <span class="kw">+₺${TL(TAMBONUS)}</span></div>
        <p class="kucuk" style="margin-top:10px">${E.kelime[0]} harflilerin hepsini
        bildiniz — tam isabet primi hesabınıza eklendi.</p>
        <button class="buton" id="dv">PUZZLE'A GEÇ</button>`);
      $("#dv").onclick = () => etapPuzzle(e);
      return;
    }
    return etapPuzzle(e);
  }
  bar.textContent = `${E.ad} · ${k+1}/${E.kelime.length}`;
  kelimeOyna(E.kelime[k], E.pk, {},
    (ok, w) => sonucAra(ok, w, () => etapSira(e, k+1, dogruSay + (ok?1:0))));
}
function etapPuzzle(e){
  const E = ETAPLAR[e];
  bar.textContent = `${E.ad} · PUZZLE`;
  puzzleOyna(E.puz, E.pp, (ok, w) => sonucAra(ok, w, () => etapBasla(e+1)));
}
function sonucAra(ok, w, devam){
  if(ok) return devam();
  const t = tanimBul(w);
  ekran(`<div class="sonuc kotu">Bilinemedi<span class="kw">${TRU(w)}</span></div>
    ${t ? `<p class="kucuk" style="margin-top:10px">${t}</p>` : ""}
    ${kacKez(w)}
    <button class="buton" id="dv">DEVAM</button>`);
  $("#dv").onclick = devam;
}
function tanimBul(w){
  if(TANIM[w]) return TANIM[w];
  for(const n in VERI.puzzle)
    for(const x of VERI.puzzle[n]) if(x[0] === w) return x[1];
  return "";
}
function kacKez(w){
  const k = VERI.kac[w] || 0;
  if(!k) return `<p class="kucuk" style="color:var(--soluk)">Bu kelime yayında hiç çıkmadı — sözlükten geldi.</p>`;
  return `<p class="kucuk">Yayında <b style="color:var(--altin)">${k} kez</b> cevap oldu.</p>`;
}

/* ---------------- final ---------------- */
let fIdx = 0, fTaban = 0, fEnIyi = 0, fSuan = 0, fBitti = false, fKalan = FINAL.sure;
function fKazanc(n){
  return n === 7 ? fTaban*2 + FINAL.superEk : Math.round(fTaban*FINAL.carpan[n]/100)*100;
}
function finalOdul(){ return fEnIyi ? fKazanc(fEnIyi) : 0; }
function finalGiris(){
  bar.textContent = "FİNAL";
  fTaban = para;
  const sat = FINAL.dizi.map(n => `<tr><td>${n} harfli${n===7?" · süper lingo":""}</td>
      <td><b>₺${TL(fKazanc(n))}</b></td></tr>`).join("");
  ekran(`<h2>FİNAL</h2>
    <p>Üç etapta <b>₺${TL(fTaban)}</b> biriktirdiniz. Bunun ne kadarını
       eve götüreceğiniz finalde belli olacak.</p>
    <p class="kucuk"><b>200 saniye</b> · dört kelime: 4, 5, 6 ve 7 harfli ·
       her kelime için <b>5 hak</b>. Bir kelimeyi bilemezseniz final biter,
       o ana kadar çıktığınız basamağı kazanırsınız.<br>
       Takılırsanız <b>PAS</b> ile aynı uzunlukta başka bir kelime alabilirsiniz —
       ama önce <b>en az bir tahmin</b> yapmanız gerekir, süre işlemeye devam eder.</p>
    <table class="merd">${sat}</table>
    <p class="kucuk" style="color:var(--kirmizi)"><b>Dikkat:</b> 7 harfliye gelip
       bilemezseniz kazancınız <b>sıfır</b> olur.</p>
    <button class="buton" onclick="finalBasla()">BAŞLA</button>`);
}
function finalBasla(){
  fIdx = 0; fEnIyi = 0; fSuan = 0; fBitti = false;
  para = 0; paraYaz();
  fKalan = FINAL.sure;
  sureBasla(FINAL.sure, () => finalBitir(), sn => { fKalan = sn; });
  finalKelime();
}
function finalKelime(){
  if(fBitti) return;
  if(fIdx >= FINAL.dizi.length) return finalBitir();
  const n = FINAL.dizi[fIdx]; fSuan = n;
  bar.textContent = n === 7 ? "SÜPER LİNGO" : `FİNAL · ${n} HARFLİ`;
  const tut = sayac;
  kelimeOyna(n, fKazanc(n),
    {satir: FINAL.satir, sureyok: true, odulYok: true,
     pas: () => { if(!fBitti) finalKelime(); }},
    (ok) => {
      if(fBitti) return;
      if(ok){
        fEnIyi = n; para = finalOdul(); paraYaz();
        if(n === 6) return finalKarar();
        fIdx++; finalKelime();
      }
      else finalBitir();
    });
  sayac = tut; sureGoster(true);
}
function finalKarar(){
  durdur();
  const g = finalOdul(), r = fTaban*2 + FINAL.superEk;
  ekran(`<h2>Tamam mı, devam mı?</h2>
    <p>6 harfliyi bildiniz. Şu anki garantiniz
       <b style="color:var(--altin)">₺${TL(g)}</b>.</p>
    <p class="kucuk">Devam ederseniz 7 harfli <b>süper lingo</b>:
       bilirseniz <b>₺${TL(r)}</b>, bilemezseniz
       <b style="color:var(--kirmizi)">sıfır</b>.
       Kalan süre <b>${fKalan}</b> saniye — şu an duruyor.</p>
    <button class="buton" style="background:var(--yesil);color:#fff"
      onclick="finalDur()">TAMAM — ₺${TL(g)} ile bitir</button>
    <button class="buton" onclick="finalDevam()">DEVAM — süper lingo ▸</button>`);
}
function finalDur(){ fSuan = 6; finalBitir(); }
function finalDevam(){
  fIdx++;
  sureBasla(Math.max(5, fKalan), () => finalBitir(), sn => { fKalan = sn; });
  finalKelime();
}
function finalBitir(){
  if(fBitti) return; fBitti = true;
  durdur(); sureGoster(false); klv.classList.add("gizli");
  const sifirlandi = (fSuan === 7 && fEnIyi !== 7);
  para = sifirlandi ? 0 : finalOdul();
  paraYaz();
  const en = +(localStorage.getItem("lingo_oyun_rekor") || 0);
  if(para > en) localStorage.setItem("lingo_oyun_rekor", para);
  bar.textContent = "OYUN BİTTİ";
  let not;
  if(fEnIyi === 7) not = `<b style="color:var(--altin)">SÜPER LİNGO!</b>
    ₺${TL(fTaban)} × 2 + ₺${TL(FINAL.superEk)}`;
  else if(sifirlandi) not = `7 harfliye kadar geldiniz ama bilemediniz —
    ₺${TL(fKazanc(6))} elden gitti.`;
  else if(fEnIyi) not = `${fEnIyi} harfliye kadar çıktınız.
    ₺${TL(fTaban)} biriktirmiştiniz.`;
  else not = `Finalde ilk kelimeyi geçemediniz. ₺${TL(fTaban)} elden gitti.`;
  ekran(`<p class="kucuk">EVE GÖTÜRDÜĞÜNÜZ</p>
    <div class="tutar">₺${TL(para)}</div>
    <p class="kucuk" style="margin-top:10px">${not}</p>
    ${rozOzet()}
    <p class="kucuk">${para > en ? "Yeni rekor!" : "En iyi: ₺" + TL(en)}</p>
    <button class="buton" onclick="giris()">TEKRAR OYNA</button>
    <button class="buton ikinci" onclick="location.href='index.html'">ÇALIŞMA SAYFALARI</button>`);
}

/* klavye destegi (masaustu) */
document.addEventListener("keydown", e => {
  if(klv.classList.contains("gizli")) return;
  const k = e.key;
  if(k === "Enter"){ const b = [...klv.querySelectorAll("button")].find(x => x.textContent === "TAMAM"); if(b) b.click(); }
  else if(k === "Backspace"){ const b = [...klv.querySelectorAll("button")].find(x => x.textContent === "SİL"); if(b) b.click(); }
  else if(k.length === 1){ const c = k.toLowerCase(); if(klvTus[c]) klvTus[c].click(); }
});
function yukle(){
  orta.innerHTML = `<div class="kutu"><h1>LİNGO</h1>
    <p>Kelime havuzu yükleniyor…</p></div>`;
  fetch("oyun-veri.json").then(r => {
    if(!r.ok) throw 0; return r.json();
  }).then(d => {
    VERI = d;
    for(const n in VERI.gecerli) GECERLI[n] = new Set(VERI.gecerli[n]);
    giris();
    fetch("oyun-tanim.json").then(r => r.json())
      .then(t => { TANIM = t; }).catch(() => {});
  }).catch(() => {
    orta.innerHTML = `<div class="kutu"><h2>Yüklenemedi</h2>
      <p>Kelime havuzu açılamadı. Bağlantınızı kontrol edip sayfayı yenileyin.</p>
      <button class="buton" onclick="location.reload()">YENİLE</button></div>`;
  });
}
window.addEventListener("resize", () => {
  const t = $("#tahta"); if(!t) return;
  const n = t.firstChild ? t.firstChild.children.length : 5;
  t.style.setProperty("--hg", hucreBoy(n) + "px");
});
yukle();
</script></body></html>
