<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1720">
<title>Gelişim raporu — Lingo</title>
<style>
:root{--kagit:#0f1720;--kart:#1a2430;--kart2:#141d27;--murekkep:#f2f5f8;--soluk:#8b98a6;
  --cizgi:#2c3947;--yesil:#2e9e5b;--sari:#e6b22e;--kirmizi:#d94a5a;--altin:#f4c95d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--kagit);color:var(--murekkep);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
header{background:#0a1119;border-bottom:1px solid var(--cizgi);padding:11px 14px;
  display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:5}
header a{color:var(--soluk);text-decoration:none;font-size:16px}
header b{font-size:12px;letter-spacing:1.4px;color:var(--altin);text-transform:uppercase}
.sar{max-width:620px;margin:0 auto;padding:18px 14px 48px}
h1{font-size:27px;margin:0 0 3px;letter-spacing:-.6px}
.alt1{color:var(--soluk);font-size:14px;margin:0 0 16px}
h2{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--soluk);
  margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--cizgi);font-weight:800}
p{color:var(--soluk);font-size:14.5px;margin:0 0 10px;line-height:1.55}
/* kisi */
.kisi{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;
  padding:12px 15px;margin:0 0 16px;cursor:pointer}
.kisi .sol{display:flex;align-items:center;gap:10px}
.kisi .av{width:34px;height:34px;border-radius:50%;background:var(--altin);color:#1a1200;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.kisi b{font-size:16.5px;display:block;line-height:1.2}
.kisi i{font-style:normal;font-size:12.5px;color:var(--soluk)}
.kisi u{text-decoration:none;color:var(--yesil);font-weight:700;font-size:13px;
  white-space:nowrap}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;
  margin:0 0 18px}
.kgrid button{background:var(--kart2);border:1.5px solid var(--cizgi);border-radius:12px;
  padding:12px 8px;color:var(--murekkep);font-weight:700;font-size:15px;text-align:left}
.kgrid button.on{background:var(--yesil);border-color:var(--yesil);color:#fff}
.kgrid button small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:2px}
/* ozet */
.ozet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ozet div{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;
  padding:14px 6px;text-align:center}
.ozet b{display:block;font-size:23px;font-weight:800;letter-spacing:-.6px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.ozet span{font-size:10px;color:var(--soluk);text-transform:uppercase;letter-spacing:.6px;
  display:block;margin-top:5px;line-height:1.3}
/* akis noktalari */
.akis{display:flex;flex-wrap:wrap;gap:5px}
.akis i{width:15px;height:15px;border-radius:5px;display:block}
.akis i.d{background:var(--yesil)}.akis i.y{background:var(--kirmizi)}
/* uzunluk kartlari */
.uz{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;
  padding:14px 15px;margin-bottom:9px}
.uz .b1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.uz .b1 b{font-size:17px;letter-spacing:-.2px}
.uz .b1 u{text-decoration:none;font-size:19px;font-weight:800;
  font-variant-numeric:tabular-nums}
.cub{height:8px;border-radius:5px;background:#22303d;overflow:hidden}
.cub i{display:block;height:100%;border-radius:5px}
.i1{background:var(--yesil)}.i2{background:var(--sari)}.i3{background:var(--kirmizi)}
.uz .b2{display:flex;gap:14px;margin-top:9px;font-size:12.5px;color:var(--soluk);
  flex-wrap:wrap}
.uz .b2 em{font-style:normal;color:var(--murekkep);font-weight:700}
/* harf tablosu */
.hbas{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--altin);
  font-weight:800;margin:16px 0 6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:9px 6px;border-bottom:1px solid var(--cizgi);vertical-align:middle}
td.h{font-weight:800;font-size:18px;width:42px}
td.b{width:44%}
td.s{color:var(--soluk);font-size:12.5px;width:62px}
td.o{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;width:56px}
tr.tik{cursor:pointer}
tr.tik:active{background:var(--kart2)}
/* kelimeler */
.wrap{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.wrap span{font-family:ui-monospace,Menlo,monospace;font-size:14px;font-weight:700;
  padding:6px 10px;border-radius:8px;letter-spacing:1.2px}
.wrap span.k{background:#3d1720;color:#f2a3ad;border:1px solid #5c2230}
.wrap span.d{background:#173d27;color:#7fe0a6;border:1px solid #235c39}
.wrap span.s{background:#3a2f0c;color:#f0d089;border:1px solid #5c4a12}
.wrap span i{font-style:normal;font-size:10px;opacity:.75;margin-left:5px}
.buton{display:block;width:100%;background:var(--altin);color:#1a1200;border:0;
  border-radius:13px;padding:14px;font-weight:800;font-size:16px;margin-top:10px;
  text-align:center;text-decoration:none}
.buton.ikinci{background:transparent;color:var(--murekkep);border:1.5px solid var(--cizgi)}
.bos{background:var(--kart2);border:1px dashed var(--cizgi);border-radius:12px;
  padding:16px;text-align:center;color:var(--soluk);font-size:14px;line-height:1.6}
.unvk{background:var(--kart);border:1px solid var(--altin);border-radius:14px;
  padding:14px 16px;text-align:center}
.unvk b{display:block;font-size:19px;color:var(--altin);letter-spacing:-.3px}
.unvk span{font-size:13px;color:var(--soluk)}
.rozg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;
  margin-top:9px}
.rozg div{background:var(--kart);border:1px solid var(--altin);border-radius:12px;
  padding:10px 6px;text-align:center;cursor:pointer;position:relative}
.rozg div.vit{background:#3a2f0c;box-shadow:0 0 0 2px var(--altin) inset}
.rozg div.vit:after{content:"★";position:absolute;top:3px;right:6px;color:var(--altin);
  font-size:12px}
.rozg span{font-size:22px;line-height:1;display:block}
.rozg b{display:block;font-size:11.5px;margin-top:4px}
.dip{font-size:12px;color:#5f6b78;margin-top:20px;line-height:1.6}
.dip s{text-decoration:none;color:var(--kirmizi);cursor:pointer}
</style></head><body>
<header><a href="index.html">‹</a><b>Gelişim raporu</b></header>
<div class="sar" id="alan"></div>
<script src="rozet.js?v=5"></script>
<script>if(typeof LG_kervanMeta !== "function") window.LG_kervanMeta = function(){ return {}; };</script>
<script>if(typeof LG_papatyaMeta !== "function") window.LG_papatyaMeta = function(){ return {}; };</script>
<script>
const TRU = s => s.replace(/i/g,"İ").replace(/ı/g,"I").toUpperCase();
const $ = s => document.querySelector(s);
const defter = LG_defter;
const KISI_VAR = ["Serpil","Zeynep"];
let KISILER = LG_kisiler(KISI_VAR), KISI = null, secimAcik = false, acikGun = 0;
KISI = LG_kisiDogrula(KISILER);
if(!KISI || KISI === LG_KAYITSIZ)
  KISI = KISILER.find(a => LG_defter(a).length) || KISILER[0];

function vitrin(rozAd){ LG_vitrinDegis(KISI, rozAd); ciz(); }
function kisiSec(a){ KISI=a; secimAcik=false;
  try{ localStorage.setItem("lingo_kisi",a); }catch(e){} ciz(); }
function sinif(o){ return o>=75 ? "i1" : (o>=50 ? "i2" : "i3"); }
function renk(o){ return o>=75 ? "var(--yesil)" : (o>=50 ? "var(--sari)" : "var(--kirmizi)"); }
function UZ(n){ return n + " harfli"; }

function ciz(){
  const d = defter(KISI);
  const serit = `
    <div class="kisi" onclick="secimAcik=!secimAcik;ciz()">
      <span class="sol"><span class="av">${TRU(KISI[0]||"?")}</span>
        <span><b>${KISI}</b><i>${d.length
          ? LG_unvan(d.length).simdi.ad + " · " + d.length + " kelime"
          : "henüz kayıt yok"}</i></span></span>
      <u>${secimAcik ? "kapat" : "kişi değiştir"}</u></div>
    ${secimAcik ? `<div class="kgrid">${KISILER.map(a => {
        const n = defter(a).length;
        return `<button class="${a===KISI?"on":""}" onclick="kisiSec('${a.replace(/'/g,"")}')">
          ${a}<small>${n ? n + " kelime" : "kayıt yok"}</small></button>`;}).join("")}</div>` : ""}`;

  if(!d.length){
    $("#alan").innerHTML = `<h1>Gelişim raporu</h1>
      <p class="alt1">Alıştırmalarda ve oyunlarda çıkan sonuçlar burada birikir.</p>
      ${serit}
      <div class="bos">Bu kişi adına henüz kayıt yok.<br>
        Bir alıştırma turu yapın, sonuçlar otomatik işlenecek.</div>
      <a class="buton" href="alistirma4.html">4 HARFLİ ALIŞTIRMAYA BAŞLA</a>
      <a class="buton ikinci" href="index.html">ANA SAYFA</a>`;
    return;
  }

  const bil = d.filter(r=>r.k>0);
  const basari = Math.round(100*bil.length/d.length);
  const ort = bil.length ? (bil.reduce((t,r)=>t+r.k,0)/bil.length) : 0;
  const son = d.slice(-20), sonO = Math.round(100*son.filter(r=>r.k>0).length/son.length);
  const ilk = bil.filter(r=>r.k===1).length;

  /* --- uzunluk kartlari --- */
  let uzHtml = "";
  for(const n of [4,5,6,7]){
    const g = d.filter(r=>r.n===n); if(!g.length) continue;
    const gb = g.filter(r=>r.k>0);
    const o = Math.round(100*gb.length/g.length);
    const go = gb.length ? (gb.reduce((t,r)=>t+r.k,0)/gb.length).toFixed(1) : "—";
    /* bu uzunlukta en zayif harf */
    const hh = {};
    for(const r of g){ (hh[r.h]=hh[r.h]||{t:0,b:0}).t++; if(r.k>0) hh[r.h].b++; }
    const zl = Object.keys(hh).filter(h=>hh[h].t>=2)
      .map(h=>({h,o:Math.round(100*hh[h].b/hh[h].t)})).sort((a,b)=>a.o-b.o)[0];
    uzHtml += `<div class="uz">
      <div class="b1"><b>${UZ(n)}</b><u style="color:${renk(o)}">%${o}</u></div>
      <div class="cub"><i class="${sinif(o)}" style="width:${o}%"></i></div>
      <div class="b2"><span><em>${g.length}</em> kelime</span>
        <span>ortalama <em>${go}</em> tahmin</span>
        ${zl ? `<span>en zayıf harf <em>${TRU(zl.h)}</em> (%${zl.o})</span>` : ""}</div>
    </div>`;
  }

  /* --- harf harf, uzunluk basliklariyla --- */
  let hbHtml = "", hbVar = false;
  for(const n of [4,5,6,7]){
    const g = d.filter(r=>r.n===n); if(!g.length) continue;
    const hh = {};
    for(const r of g){ (hh[r.h]=hh[r.h]||{t:0,b:0}).t++; if(r.k>0) hh[r.h].b++; }
    const liste = Object.keys(hh).map(h=>({h,...hh[h],o:Math.round(100*hh[h].b/hh[h].t)}))
      .sort((a,b)=>a.o-b.o || b.t-a.t);
    if(!liste.length) continue;
    hbVar = true;
    hbHtml += `<div class="hbas">${UZ(n)}</div><table>` + liste.map(x =>
      `<tr class="tik" onclick="location.href='alistirma${n}.html#h=${encodeURIComponent(x.h)}'">
        <td class="h">${TRU(x.h)}</td>
        <td class="b"><div class="cub"><i class="${sinif(x.o)}" style="width:${x.o}%"></i></div></td>
        <td class="s">${x.b}/${x.t}</td>
        <td class="o" style="color:${renk(x.o)}">%${x.o}</td></tr>`).join("") + `</table>`;
  }

  /* --- kelimeler --- */
  const tk = {}, sh = {};
  for(const r of d){ if(r.k===0) tk[r.w]=(tk[r.w]||0)+1; else if(r.k>=5) sh[r.w]=1; }
  const tkl = Object.keys(tk).sort((a,b)=>tk[b]-tk[a]);
  const shl = Object.keys(sh);
  const uzTekrar = [4,5,6,7].filter(n => tkl.some(w=>w.length===n));

  $("#alan").innerHTML = `<h1>Gelişim raporu</h1>
    <p class="alt1">Alıştırmalarda ve oyunlarda çıkan sonuçlar burada birikir.</p>
    ${serit}
    <div class="ozet">
      <div><b>${d.length}</b><span>kelime</span></div>
      <div><b style="color:${renk(basari)}">%${basari}</b><span>bilinen</span></div>
      <div><b>${ort ? ort.toFixed(1) : "—"}</b><span>ort. tahmin</span></div>
      <div><b style="color:${renk(sonO)}">%${sonO}</b><span>son ${son.length}</span></div>
    </div>

    <h2>Son ${son.length} kelime</h2>
    <div class="akis">${son.map(r=>`<i class="${r.k>0?"d":"y"}"></i>`).join("")}</div>
    <p style="margin-top:9px;font-size:13px">Yeşil bildiklerin, kırmızı takıldıkların.
      İlk tahminde bildiğin kelime sayısı: <b style="color:var(--murekkep)">${ilk}</b>.</p>

    <h2>Uzunluğa göre</h2>
    ${uzHtml}

    <h2>Harf harf</h2>
    ${hbVar
      ? `<p>Satıra dokun, o harfle o uzunlukta alıştırma başlasın.</p>${hbHtml}`
      : `<div class="bos">Harf dağılımı için biraz daha kelime gerekiyor.</div>`}

    <h2>Takıldığın kelimeler${tkl.length ? " · " + tkl.length : ""}</h2>
    ${tkl.length
      ? `<div class="wrap">${tkl.map(w=>`<span class="k">${TRU(w)}${
          tk[w]>1?`<i>${tk[w]}×</i>`:""}</span>`).join("")}</div>`
      : `<div class="bos">Hiç takıldığın kelime yok. Devam et.</div>`}

    ${shl.length ? `<h2>Son hakkında bildiklerin · ${shl.length}</h2>
      <p>Kıl payı kurtardıkların. Bir dahakine daha erken çıkması gerekenler —
         bunları tekrar et.</p>
      <div class="wrap">${shl.slice(-40).map(w=>`<span class="s">${TRU(w)}</span>`).join("")}</div>` : ""}

    ${(function(){
      const ra = LG_acik(KISI), U = LG_unvan(d.length);
      return `<h2>Ünvan ve rozetler · ${ra.length}/${LG_rozet(d,LG_plan(KISI),LG_kervanMeta(KISI), LG_papatyaMeta(KISI)).length}</h2>
        <div class="unvk"><b>${U.simdi.ad}</b>
          <span>${U.sonraki ? U.sonraki.ad + " için " + U.kalan + " kelime daha"
                            : "en üst ünvan"}</span>
          <div class="cub" style="margin-top:8px"><i class="i1" style="width:${U.oran}%"></i></div>
        </div>
        ${ra.length ? `<p style="margin:8px 0 4px">Vitrinde göstermek istediğin
            <b>en fazla 3</b> rozete dokun — kişi şeridinde onlar görünür.</p>
          <div class="rozg">${ra.map(r=>`<div class="${
            LG_vitrin(KISI).indexOf(r.a)>=0 ? "vit" : ""}"
            onclick="vitrin('${r.a.replace(/'/g,"")}')"><span>${r.e}</span>
            <b>${r.a}</b></div>`).join("")}</div>`
          : `<div class="bos">Henüz rozet yok. Alıştırma yaptıkça açılacak.</div>`}
        <a class="buton ikinci" href="plan.html">🗓 TÜM ROZETLERİ GÖR</a>
        ${d.length>=250 ? `<a class="buton ikinci" href="sertifika.html">🏅 SERTİFİKAM</a>`
          : `<p style="font-size:12.5px;margin-top:8px">🏅 Sertifika için
              ${250-d.length} kelime daha.</p>`}`;})()}
    ${uzTekrar.map(n=>`<a class="buton" href="alistirma${n}.html#tekrar">
      ${UZ(n).toUpperCase()} TAKILDIKLARINI TEKRAR ET</a>`).join("")}
    <a class="buton ikinci" href="index.html">ANA SAYFA</a>
    <div class="dip">Kayıtlar bu telefonda, <b>${KISI}</b> adına tutuluyor.
      <s onclick="if(confirm('${KISI} kayıtları silinsin mi?')){
        localStorage.removeItem('lingo_defter_${KISI}');ciz();}">kayıtları sil</s></div>`;
}
ciz();
</script></body></html>
