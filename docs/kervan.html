<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--kagit);color:var(--murekkep);

button{font:inherit;cursor:pointer}
.gizli{display:none!important}
/* ---- ust bar ---- */
#bar{display:flex;align-items:center;gap:9px;padding:8px 11px;background:#0a1119;

#bar .yer{font-size:12px;letter-spacing:.9px;font-weight:700;color:var(--altin);

/* ---- orta ---- */

#orta.ort{justify-content:flex-start}
#orta.ort > :first-child{margin-top:auto}
#orta.ort > :last-child{margin-bottom:auto}
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;

.kutu.ort{text-align:center}
.kutu h1{font-size:27px;margin:0 0 5px;letter-spacing:-.4px;line-height:1.15}
.kutu h2{font-size:19px;margin:0 0 8px}
.kutu p{color:var(--soluk);margin:0 0 10px;font-size:15px;line-height:1.6}
.kutu p b{color:var(--murekkep)}
.kutu p:last-child{margin-bottom:0}
.buton{display:block;width:100%;background:var(--altin);color:#1a1200;border:0;

  text-align:center;text-decoration:none}
.buton.ikinci{background:transparent;color:var(--murekkep);border:1.5px solid var(--cizgi)}
.buton.mor{background:var(--mor);color:#fff}
.buton:disabled{opacity:.4}
.kucuk{font-size:13px;color:var(--soluk);line-height:1.55}
.eyebrow{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--altin);

.hikaye{font-size:16px;line-height:1.72;color:#dfe6ed;font-style:italic}

.yb{background:var(--kart);border:1px solid var(--cizgi);border-radius:13px;padding:11px 12px}
.yb.simdi{border-color:var(--altin);box-shadow:inset 0 0 0 1px var(--altin)}
.yb.bitti{opacity:.55}
.yb .ust2{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.yb .ad{font-weight:800;font-size:15px}
.yb .no{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--soluk);

.adim{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.a{width:33px;height:33px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:14px;flex:none;

.a.bek{background:#141d27;border-color:var(--cizgi);color:var(--soluk)}
.a.ok{background:var(--yesil);color:#fff}
.a.hata{background:var(--kirmizi);color:#fff}
.a.simdi{background:var(--altin);color:#1a1200;box-shadow:0 0 0 3px rgba(244,201,93,.25)}
.a.han{border-radius:99px;border-color:var(--altin);color:var(--altin);background:#141d27;

.a.han.ok{background:var(--altin);color:#1a1200}
/* ---- dukkan ---- */
.satici{display:flex;gap:11px;align-items:center;margin-bottom:3px}
.satici .av{width:46px;height:46px;border-radius:50%;background:#0f1720;color:var(--altin);

.satici .ki b{display:block;font-size:16.5px;line-height:1.2}
.satici .ki span{display:block;font-size:12.5px;color:var(--soluk);margin-top:2px}
.urun{border:1px solid var(--cizgi);border-radius:13px;background:#141d27;margin-top:8px;

.urun>button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;

.urun .em{font-size:21px;line-height:1;flex:none;width:26px;text-align:center}
.urun .gv{flex:1;min-width:0}
.urun .gv b{display:block;font-size:15px;line-height:1.25}
.urun .gv span{display:block;font-size:12.5px;color:var(--soluk);margin-top:2px;

.urun .fy{flex:none;font-weight:800;font-variant-numeric:tabular-nums;color:var(--sari);
  font-size:14.5px;text-align:right}
.urun .fy em{font-style:normal;display:block;font-size:10px;color:var(--soluk);
  letter-spacing:.6px;font-weight:700}
.urun .ac{padding:0 12px 12px;border-top:1px dashed var(--cizgi);margin-top:2px;
  padding-top:10px}
.urun .ac p{font-size:13.5px;line-height:1.6;color:#cfd8e0;margin:0 0 8px}
.urun.kilitli{opacity:.72;border-style:dashed}
.urun.kilitli .fy{color:var(--soluk)}
.urun.alindi{border-color:var(--yesil)}
.etiket{display:inline-block;font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;

.etiket.joker{background:#243a4d;color:#8fd3ff}
.etiket.yetenek{background:#2a3a24;color:#b6e39a}
.etiket.tilsim{background:#3a2a3d;color:#e0aef0}
.etiket.efsane{background:#4a3a12;color:var(--altin)}
.kilitNot{font-size:12.5px;color:var(--sari);line-height:1.5;
  background:rgba(230,178,46,.09);border:1px solid rgba(230,178,46,.28);
  border-radius:9px;padding:8px 10px;margin-top:2px}
.kilitNot b{color:var(--sari)}
/* ---- tahta ---- */
#tahta{display:grid;gap:5px;justify-content:center}
#tahta .satir{display:grid;gap:5px}
.hucre{width:var(--hg);height:var(--hg);border:2px solid var(--cizgi);border-radius:8px;

.hucre.ilk{border-color:#4a5a6b;color:var(--altin)}
.hucre.dolu{border-color:#4a5a6b}
.hucre.tam{background:var(--yesil);border-color:var(--yesil);color:#fff}
.hucre.var{background:var(--sari);border-color:var(--sari);color:#231a00}
.hucre.yok{background:var(--gri);border-color:var(--gri);color:#8fa0b0}
.satir.aktif .hucre{border-color:#5d6f82}
.satir.sarsil{animation:sars .35s}
@keyframes sars{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}

.baslik{font-size:12.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--soluk);

.ipucu{background:var(--kart);border:1px solid var(--cizgi);border-radius:11px;

.ipucu b{color:var(--altin);display:block;font-size:10.5px;letter-spacing:1.2px;

.sonuc{font-size:16px;font-weight:700;text-align:center}
.sonuc.iyi{color:var(--yesil)} .sonuc.kotu{color:var(--kirmizi)}
.sonuc .kw{font-family:ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--altin);

#jokbar button u{text-decoration:none;background:var(--sari);color:#231a00;border-radius:99px;

#jokbar button:disabled{opacity:.35}
#jokbar .bos{color:var(--soluk);font-size:12px;padding:7px 4px}

#klavye{flex:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom));

#klavye button.gnis{flex:1.9 1 0;font-size:13px;letter-spacing:.5px}
#klavye button.dar{flex:1.25 1 0;font-size:12.5px;letter-spacing:.5px}

#klavye button.var{background:var(--sari);color:#231a00}
#klavye button.yok{background:#1e2933;color:#5d6b7a}

.uyari{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#f2f5f8;
  color:#0f1720;padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;
  z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.45);max-width:88%;text-align:center}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px;
  margin:10px 0 0}
.kgrid button{background:#141d27;border:1.5px solid var(--cizgi);border-radius:12px;
  padding:12px 8px;color:var(--murekkep);font-weight:700;font-size:15px}
.kgrid button.on{background:var(--yesil);border-color:var(--yesil);color:#fff}
.ozet{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--cizgi);
  border-bottom:1px solid var(--cizgi);margin:11px 0}
.ozet div{padding:9px 2px;text-align:center;border-left:1px solid var(--cizgi)}
.ozet div:first-child{border-left:0}
.ozet b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.ozet span{display:block;font-size:9.5px;color:var(--soluk);text-transform:uppercase;
  letter-spacing:.6px;margin-top:3px}
.devir{display:grid;gap:7px;margin-top:8px;text-align:left}
.devir div{display:flex;align-items:flex-start;gap:9px;background:#141d27;
  border:1px solid var(--cizgi);border-radius:11px;padding:9px 11px}
.devir i{font-style:normal;font-size:18px;line-height:1.2;flex:none;width:22px;
  text-align:center}
.devir b{font-size:14.5px;display:block}
.devir span{display:block;font-size:12.5px;color:var(--soluk);line-height:1.45;
  margin-top:1px}
table.rek{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
table.rek td{padding:7px 4px;border-bottom:1px solid var(--cizgi);vertical-align:middle;
  color:var(--soluk)}
table.rek td b{color:var(--murekkep);font-size:13.5px}
table.rek td span{font-size:11.5px}
table.rek td:first-child{width:18px;color:var(--altin);font-weight:800}
table.rek td.tl{text-align:right;color:var(--yesil);font-weight:800;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.ozet1{background:#141d27;border:1px solid var(--cizgi);border-radius:12px;
  padding:11px 13px;margin:11px 0 4px;font-size:14.5px;line-height:1.6;color:#dfe6ed}
.ozet1 b{color:var(--altin)}
.tutar{font-size:36px;font-weight:800;color:var(--altin);letter-spacing:-1px;
  font-variant-numeric:tabular-nums;line-height:1.1}
/* ---- dort simge ---- */
.dortlu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0 4px}
.dortlu>div{background:#141d27;border:1px solid var(--cizgi);border-radius:12px;
  padding:11px 10px;text-align:center}
.dortlu .em{font-size:22px;line-height:1.15}
.dortlu b{display:block;font-size:15px;margin-top:5px}
.dortlu span{display:block;font-size:12px;color:var(--soluk);line-height:1.45;margin-top:3px}
.harita{background:#0c1a22;border:1px solid var(--cizgi);border-radius:12px;
  overflow:hidden;margin-top:10px}
.harita svg{display:block;width:100%;height:auto}
.efs{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--soluk)}
.efs span{display:flex;align-items:center;gap:5px}
</style></head><body>

    const kalan = Math.max(0, top + durgun - (Date.now() - bas));
    sureBar.style.width = Math.min(100, 100*kalan/top) + "%";
    sureKap.classList.toggle("az", kalan < top*0.31);
    const s2 = Math.ceil(kalan/1000);
    if(tikla && s2 !== son){ son = s2; tikla(s2); if(s2 <= 5 && s2 > 0) LG_ses("sure"); }
    if(kalan <= 0){ durdur(); bitince(); }
  }, 100);
}

/* ================= kelime secimi ================= */
let SONHAVUZ = [];
function kelimeSec(n, b){
  let havuz;
  if(n === 7) havuz = (Math.random() < 0.5) ? VERI["7a"][b] : OYUN.yeni["7"];
  else havuz = VERI[String(n)][b];
  const yasak = new Set(S.gorulen.concat(sahipmi("hafizadefteri") ? S.takilan : []));
  let ad = havuz.filter(w => !yasak.has(w));
  if(!ad.length) ad = havuz;
  SONHAVUZ = ad;
  return ad[Math.floor(Math.random() * ad.length)];
}
function renk(gizli, tah){
  const n = gizli.length, r = new Array(n).fill("yok"), kal = {};
  for(let i = 0; i < n; i++)
    if(tah[i] === gizli[i]) r[i] = "tam"; else kal[gizli[i]] = (kal[gizli[i]]||0)+1;
  for(let i = 0; i < n; i++)
    if(r[i] !== "tam" && kal[tah[i]] > 0){ r[i] = "var"; kal[tah[i]]--; }
  return r;
}
function klavyeCiz(gir, sil2, gonder){
  klv.innerHTML = ""; klvTus = {};
  DIZ.forEach((sr, k) => {
    const d = document.createElement("div"); d.className = "sr";
    for(const c of sr){
      const b = document.createElement("button"); b.textContent = TRU(c);
      b.onclick = () => gir(c); klvTus[c] = b; d.appendChild(b);
    }
    if(k === 1){ const b = document.createElement("button");
      b.className = "dar"; b.textContent = "SİL"; b.onclick = sil2; d.appendChild(b); }
    if(k === 2){ const b = document.createElement("button");
      b.className = "gnis"; b.textContent = "TAMAM"; b.onclick = gonder; d.appendChild(b); }
    klv.appendChild(d);
  });
  klv.classList.remove("gizli");
  for(const c in klvDurum) if(klvTus[c]) klvTus[c].className = klvDurum[c];
}
function klvBoya(tah, r){
  const onc = {tam:3, var:2, yok:1};
  for(let i = 0; i < tah.length; i++){
    const c = tah[i];
    if((onc[klvDurum[c]]||0) < onc[r[i]]){
      klvDurum[c] = r[i]; if(klvTus[c]) klvTus[c].className = r[i];
    }
  }
}
function hucreBoy(n){
  const g = Math.min(window.innerWidth - 26, 430);
  return Math.max(28, Math.min(54, Math.floor((g - (n-1)*5) / n)));
}
function defterYaz(w, hak){
  if(!KISI || KISI === LG_KAYITSIZ) return;
  try{
    const a = "lingo_defter_" + KISI;
    const d = JSON.parse(localStorage.getItem(a) || "[]");
    d.push({w:w, n:w.length, h:w[0], k:hak, t:Date.now()});
    while(d.length > 3000) d.shift();
    localStorage.setItem(a, JSON.stringify(d));
  }catch(e){}
}

/* ================= etap ================= */
function etapBasla(zorlaKelime){
  const no = S.etap, b = Math.floor(no/4), i = no % 4, n = UZUN[i];
  const gizli = zorlaKelime || kelimeSec(n, b);
  let satirSay = 5 + ((n === 5) ? kac("ozansazi") : 0) + kac("sabir")
                   + ((n >= 6) ? kac("mSal") : 0);
  let sure = BL(b).sure + YY().sureFark + kac("saatustasi") * 5
             + kac("mKandil") * 8;
  if(n === 6 && sahipmi("demiryurek")) sure = Math.max(sure, 25);
  if(n === 7) sure += kac("ugur") * 10;
  sure += kac("dYelken") * 6;
  if(i === 0) sure += kac("mKupe") * 8;
  if(sahipmi("lamba")){ const sa = new Date().getHours();
    if(sa >= 22 || sa < 4) sure += 5; }
  const sureyok = (n === 7 && sahipmi("ejderpulu"));
  const acik = new Set([0]);
  if(n === 7 && sahipmi("alfabesezgisi")) acik.add(1);
  if(sahipmi("mTuy")){
    const bos0 = [...Array(n).keys()].filter(x => !acik.has(x));
    if(bos0.length) acik.add(bos0[Math.floor(Math.random()*bos0.length)]);
  }
  if(i === 0 && sahipmi("pusula")){
    const bos = [...Array(n).keys()].filter(x => !acik.has(x));
    acik.add(bos[Math.floor(Math.random()*bos.length)]);
  }
  let sat = 0, giris = "", kalanSn = sure, bitti = false;
  let cifte = false, keskinKullandi = false, tanimAcik = false, anagramAcik = false;
  let enIyi = 0, akceCift = false, saatDurdu = false;
  klvDurum = {}; AKTIF = {};

  const yaziBasla = () => { giris = ""; for(let k = 0; k < n; k++)
      giris += acik.has(k) ? gizli[k] : ""; };
  /* acik harfleri iceren baslangic dizisi: pozisyon bazli tutalim */
  let gir = new Array(n).fill(null);
  acik.forEach(k => gir[k] = gizli[k]);
  let imle = 0;
  const ilkBos = () => { for(let k = 0; k < n; k++) if(gir[k] === null) return k; return -1; };

  orta.classList.remove("ort");
  orta.innerHTML =
    `<div class="baslik" id="ust"></div>
     <div id="tahta" style="--hg:${hucreBoy(n)}px"></div>
     <div class="kucuk" id="alt"></div>`;
  if(sahipmi("sayac")){
    const aday = SONHAVUZ.filter(w => w[0] === gizli[0]).length;
    $("#alt").innerHTML = `<div class="ipucu" style="margin-top:9px">
      <b>Yol defteri</b>${TRU(gizli[0])} ile başlayan <b>${aday}</b> ${n} harfli
      kelime var bu havuzda.</div>`;
  }
  const tahta = $("#tahta"), satirlar = [];
  for(let r = 0; r < satirSay + 1; r++) satirEkle(r);
  function satirEkle(r){
    const d = document.createElement("div"); d.className = "satir";
    d.style.gridTemplateColumns = `repeat(${n}, var(--hg))`;
    for(let k = 0; k < n; k++){
      const h = document.createElement("div");
      h.className = "hucre" + (acik.has(k) ? " ilk" : "");
      if(acik.has(k)) h.textContent = TRU(gizli[k]);
      d.appendChild(h);
    }
    if(r >= satirSay) d.classList.add("gizli");
    tahta.appendChild(d); satirlar[r] = d;
  }
  function satirAc(){ satirSay++; if(satirlar[satirSay-1]) satirlar[satirSay-1]
      .classList.remove("gizli"); else satirEkle(satirSay-1); ustYaz(); }

  function odul(){
    let o = TABAN[n] * BL(b).carpan * YY().carpan;
    if(cifte) o *= 2;
    if(n === 4 && sahipmi("cobanasasi")) o *= 1.3;
    if(sahipmi("seriatesi") && S.seri >= 3) o *= 1.5;
    if(sahipmi("ayyildizfener")){ const h = new Date().getHours();
      if(h >= 22 || h < 4) o *= 1.2; }
    if(sahipmi("hizlim") && !sureyok && !saatDurdu && (sure - kalanSn) <= 8) o *= 1.25;
    if(sahipmi("mBereket")) o *= 1.15;
    if(sahipmi("dFener")){ const h2 = new Date().getHours();
      if(h2 >= 22 || h2 < 4) o *= 1.25; }
    if(n === 7 && sahipmi("dInci")) o *= 1.4;
    if(sahipmi("mDua") && sat + 1 >= satirSay) o *= 2;
    return Math.round(o / 10) * 10;
  }
  function ustYaz(){
    $("#ust").innerHTML =
      `${n} HARFLİ · ${satirSay - sat} HAK` +
      ((sureyok || saatDurdu) ? " · SÜRE YOK" : ` · ${kalanSn} SN`) +
      ` · ₺${TL(odul())}` + (cifte ? " ✖️2" : "");
    satirlar.forEach((s2, k) => s2.classList.toggle("aktif", k === sat));
  }
  function yaz(){
    const h = satirlar[sat].children;
    for(let k = 0; k < n; k++){
      h[k].textContent = gir[k] ? TRU(gir[k]) : "";
      h[k].className = "hucre" + (acik.has(k) ? " ilk" : (gir[k] ? " dolu" : ""));
    }
  }
  function girHarf(c){
    let k = imle;
    if(k >= n || gir[k] !== null || acik.has(k)) k = ilkBos();
    if(k < 0) return;
    gir[k] = c; imle = k + 1;
    while(imle < n && (gir[imle] !== null || acik.has(imle))) imle++;
    yaz();
  }
  function silHarf(){
    let k = imle - 1;
    while(k >= 0 && (acik.has(k) || gir[k] === null)) k--;
    if(k < 0){ for(let j = n-1; j >= 0; j--) if(!acik.has(j) && gir[j] !== null){ k = j; break; } }
    if(k < 0) return;
    gir[k] = null; imle = k; yaz();
  }
  function tik(){
    if(sureyok || saatDurdu){ sureGoster(false); return; }
    kalanSn = sure; ustYaz();
    sureBasla(sure, () => sonuclandir(null), s2 => { kalanSn = s2; ustYaz(); });
  }
  function gonder(){
    const tah = gir.join("");
    if(gir.some(x => x === null)){ uyar("Harfler eksik"); sarsil(); return; }
    if(!GECERLI[n].has(tah)){
      LG_ses("gecersiz");
      if(sahipmi("kadimuhru")){ uyar("Sözlükte yok, mühür hakkını korudu"); sarsil(); return; }
      uyar("Sözlükte yok, bir hak gitti"); sarsil(); sonrakiSatir(null, true); return;
    }
    sonuclandir(tah);
  }
  function sarsil(){
    satirlar[sat].classList.add("sarsil");
    setTimeout(() => satirlar[sat].classList.remove("sarsil"), 360);
  }
  function sonrakiSatir(tah, gecersiz){
    sat++;
    gir = new Array(n).fill(null); acik.forEach(k => gir[k] = gizli[k]); imle = ilkBos();
    if(sat >= satirSay) return bitir(false);
    ustYaz(); yaz(); jokCiz(); tik();
  }
  function sonuclandir(tah){
    if(bitti) return;
    durdur();
    if(tah === null){
      const h = satirlar[sat].children;
      for(let k = 0; k < n; k++) if(!acik.has(k)){ h[k].textContent = "·";
        h[k].className = "hucre yok"; }
      LG_ses("yanlis");
      uyar(sat + 1 >= satirSay ? "Süre doldu, hakların bitti"
                               : "Süre doldu, yalnızca bu hak yandı");
      return sonrakiSatir(null);
    }
    const r = renk(gizli, tah), h = satirlar[sat].children;
    enIyi = Math.max(enIyi, r.filter(x => x === "tam").length);
    for(let k = 0; k < n; k++) h[k].className = "hucre " + r[k];
    klvBoya(tah, r);
    if(tah === gizli){ LG_ses("dogru"); return bitir(true, sat + 1); }
    LG_ses("yanlis");
    if(sahipmi("keskingoz") && !keskinKullandi){ keskinKullandi = true; keskinGoz(); }
    else if(sahipmi("mAyna")) keskinGoz();
    sonrakiSatir(tah);
  }
  function keskinGoz(){
    const icinde = new Set(gizli.split(""));
    const aday = "abcçdefgğhıijklmnoöprsştuüvyz".split("")
      .filter(c => !icinde.has(c) && !klvDurum[c]);
    if(!aday.length) return;
    const c = aday[Math.floor(Math.random()*aday.length)];
    klvDurum[c] = "yok"; if(klvTus[c]) klvTus[c].className = "yok";
    uyar("Keskin Göz: " + TRU(c) + " harfi elendi");
  }
  function bitir(kazandi, hak){
    bitti = true; durdur(); sureGoster(false);
    klv.classList.add("gizli"); jokbar.classList.add("gizli");
    S.gorulen.push(gizli);
    defterYaz(gizli, kazandi ? hak : 0);
    const kazanc = kazandi ? odul()
      : (sahipmi("mMuska") ? odul() : (sahipmi("muska") ? Math.round(odul()/2) : 0));
    const bosHak = satirSay - (kazandi ? hak : satirSay);
    const birim = AKCE[n];
    const hizPrimi = bosHak * birim * (sahipmi("cimrikese") ? 2 : 1);
    const sureAkce = (sureyok || saatDurdu) ? 0
      : Math.round(Math.max(0, kalanSn) * 1.5 * (sahipmi("mBilezik") ? 2 : 1));
    let akce = birim + hizPrimi + sureAkce + kac("kervanbereketi") * 30
             + kac("mKese") * 50;
    if(akceCift) akce *= 2;
    if(!kazandi) akce = Math.round(akce * 0.4);
    S.para += kazanc; S.akce += akce;
    if(kazandi){ S.seri += sahipmi("dSedef") ? 2 : 1; S.dogru.push(gizli); }
    else { S.seri = sahipmi("ip") ? Math.max(0, S.seri - 1) : 0;
      S.takilan.push(gizli); S.hatali.push(gizli); }
    S.sonuc[S.etap] = kazandi;
    let mataraNotu = "";
    if(!kazandi){
      if(sahipmi("mKanat")){
        S.sahip.splice(S.sahip.indexOf("mKanat"), 1);
        mataraNotu = "🪽 Melek Hatun'un kanadı kırıldı, mataran gitmedi.";
      } else if(sahipmi("nazarboncugu") && !S.nazarBitti){
        S.nazarBitti = true; S.sahip = S.sahip.filter(x => x !== "nazarboncugu");
        mataraNotu = "🧿 Nazar boncuğu kırıldı, mataran gitmedi.";
      } else {
        S.kalp--;
        if(S.kalp <= 0 && sahipmi("mKalkan")){
          S.sahip.splice(S.sahip.indexOf("mKalkan"), 1); S.kalp = 1;
          mataraNotu = "🛡 Melek Hatun'un kalkanı kırıldı ve mataranı geri verdi.";
        } else if(S.kalp <= 0 && sahipmi("kalkan") && !S.kalkanBitti){
          S.kalkanBitti = true; S.kalp = 1;
          S.sahip = S.sahip.filter(x => x !== "kalkan");
          mataraNotu = "🧢 Ali'nin şapkası uçtu ve son mataranı geri verdi.";
        } else mataraNotu = "Bir mataran boşaldı.";
        if(kac("tazminat")){ const tz = kac("tazminat") * 150;
          S.akce += tz; akce += tz;
          mataraNotu += ` 💰 Yedek matara ${TL(tz)} stater ödedi.`; }
      }
    }
    S.etap++;
    if(S.etap === TOPETAP()) S.sonKapi = kazandi;
    if(S.kalp <= 0) S.bitti = "kaybetti";
    else if(S.etap >= TOPETAP()) S.bitti = "kazandi";
    kaydet();
    const yeniRoz = LG_yeni(KISI);
    if(yeniRoz.length) LG_ses("rozet");
    const ikinci = (!kazandi && S.bitti !== "kazandi" && jokAdet("ikincisans") > 0);
    ekran(
      `<div class="kutu ort">
        <div class="eyebrow">${S.etap}/${TOPETAP()}. etap ${
          kazandi ? "tamam" : "kaybedildi"}</div>
        <div class="sonuc ${kazandi ? "iyi" : "kotu"}" style="margin-top:8px">
          ${kazandi ? "Doğru!" : (enIyi === n - 1 ? "Bir harf kalmıştı…" : "Doğru cevap")}
          <span class="kw">${TRU(gizli)}</span></div>
        ${TANIM[gizli] ? `<p class="kucuk" style="margin-top:8px">${TANIM[gizli]}</p>` : ""}
        <div class="ozet">
          <div><b>₺${TL(kazanc)}</b><span>ödül</span></div>
          <div><b>${TL(akce)}</b><span>stater</span></div>
          <div><b>${S.seri}</b><span>seri</span></div>
          <div><b>${S.kalp}</b><span>matara</span></div>
        </div>
        <p class="kucuk">Stater dökümü: ${n} harfli taban <b>${birim}</b>${
          hizPrimi ? ` · ${hak}. tahminde bildin, hız primi <b>+${TL(hizPrimi)}</b>` : ""}${
          sureAkce ? ` · kalan süre <b>+${TL(sureAkce)}</b>` : ""}${
          sahipmi("kervanbereketi") ? ` · azık <b>+30</b>` : ""}${
          !kazandi ? ` · bilinemedi, toplamın <b>%40</b>'ı` : ""}</p>
        ${mataraNotu ? `<p class="kucuk">${mataraNotu}</p>` : ""}
        ${yeniRoz.length ? `<p class="kucuk" style="color:var(--altin)">Yeni nişan: ${
          yeniRoz.map(r => r.e + " " + r.a).join(" · ")}</p>` : ""}
        ${ikinci ? `<button class="buton mor" onclick="ikinciSans()">
          ♻️ İKİNCİ ŞANS KULLAN (${jokAdet("ikincisans")})</button>
          <p class="kucuk">Mataran geri gelir, aynı uzunlukta yeni bir kelime gelir.</p>` : ""}
        <button class="buton" onclick="ilerle()">DEVAM ▸</button>
        <button class="buton ikinci" onclick="haritaEkran('oyun')">🗺 YOL HARİTASI</button>
        <a class="buton ikinci" href="index.html">ANA SAYFA</a>
      </div>`);
  }
  window.ikinciSans = function(){
    S.jok.ikincisans--; if(!S.jok.ikincisans) delete S.jok.ikincisans;
    S.kalp = Math.min(S.maxKalp, S.kalp + 1); S.etap--; S.bitti = null;
    S.takilan.pop(); S.hatali.pop(); S.sonuc.length = S.etap; kaydet();
    uyar("İkinci şans: yeni kelime geliyor"); etapBasla();
  };

  /* ---- joker kullanimi ---- */
  AKTIF.kullan = function(id){
    if(jokAdet(id) < 1 || bitti) return;
    let oldu = true;
    if(id === "harfver"){
      const bos = [...Array(n).keys()].filter(k => !acik.has(k));
      if(!bos.length) oldu = false;
      else { const k = bos[Math.floor(Math.random()*bos.length)];
        acik.add(k); gir[k] = gizli[k]; imle = ilkBos();
        satirlar.forEach(sr => { sr.children[k].textContent = TRU(gizli[k]);
          sr.children[k].className = "hucre ilk"; });
        yaz(); uyar(TRU(gizli[k]) + " harfi açıldı"); }
    } else if(id === "sonharf"){
      if(acik.has(n-1)) oldu = false;
      else { acik.add(n-1); gir[n-1] = gizli[n-1]; imle = ilkBos();
        satirlar.forEach(sr => { sr.children[n-1].textContent = TRU(gizli[n-1]);
          sr.children[n-1].className = "hucre ilk"; });
        yaz(); uyar("Son harf açıldı"); }
    } else if(id === "unluavi"){
      const U = "aeıioöuü"; let c = 0;
      for(let k = 0; k < n; k++) if(U.indexOf(gizli[k]) >= 0 && !acik.has(k)){
        acik.add(k); gir[k] = gizli[k]; c++;
        satirlar.forEach(sr => { sr.children[k].textContent = TRU(gizli[k]);
          sr.children[k].className = "hucre ilk"; });
      }
      imle = ilkBos(); yaz();
      if(c) uyar(c + " sesli harf açıldı"); else oldu = false;
    } else if(id === "zamanuzat"){
      if(sureyok) oldu = false; else { AKTIF.duraklat(15000); uyar("+15 saniye"); }
    } else if(id === "nefes"){
      if(sureyok) oldu = false;
      else { durdur(); uyar("Nefes: saat 10 saniye durdu");
        setTimeout(() => { if(!bitti) sureBasla(Math.max(1, kalanSn),
          () => sonuclandir(null), s2 => { kalanSn = s2; ustYaz(); }); }, 10000); }
    } else if(id === "eleme"){
      const icinde = new Set(gizli.split(""));
      const aday = "abcçdefgğhıijklmnoöprsştuüvyz".split("")
        .filter(c => !icinde.has(c) && !klvDurum[c]);
      if(!aday.length) oldu = false;
      else { const secilen = [];
        for(let k = 0; k < 3 && aday.length; k++)
          secilen.push(aday.splice(Math.floor(Math.random()*aday.length), 1)[0]);
        secilen.forEach(c => { klvDurum[c] = "yok";
          if(klvTus[c]) klvTus[c].className = "yok"; });
        uyar("Elendi: " + secilen.map(TRU).join(" ")); }
    } else if(id === "sozluksayfasi"){
      if(!TANIM[gizli]){ uyar("Bu kelimenin sözlük kaydı yok"); oldu = false; }
      else if(tanimAcik) oldu = false;
      else { tanimAcik = true;
        $("#alt").innerHTML = `<div class="ipucu" style="margin-top:9px">
          <b>Sözlük sayfası</b>${TANIM[gizli]}</div>`; }
    } else if(id === "anagram"){
      if(anagramAcik) oldu = false;
      else { anagramAcik = true;
        const kar = gizli.split("").sort(() => Math.random()-0.5).map(TRU).join(" ");
        $("#alt").innerHTML += `<div class="ipucu" style="margin-top:9px">
          <b>Anagram · harfler karışık</b>${kar}</div>`; }
    } else if(id === "fazladanhak"){
      satirAc(); uyar("Bir hak daha eklendi");
    } else if(id === "ciftevurgu"){
      if(cifte) oldu = false; else { cifte = true; ustYaz(); uyar("Ödül iki katı!"); }
    } else if(id === "yoldegistir"){
      S.jok[id]--; if(!S.jok[id]) delete S.jok[id]; kaydet();
      uyar("Yeni kelime geliyor"); return etapBasla();
    } else if(id === "kalem"){
      S.jok[id]--; if(!S.jok[id]) delete S.jok[id]; kaydet();
      gir = gizli.split(""); yaz(); return sonuclandir(gizli);
    } else if(id === "dAgi"){
      const icinde = new Set(gizli.split(""));
      const aday = "abcçdefgğhıijklmnoöprsştuüvyz".split("")
        .filter(c => !icinde.has(c) && !klvDurum[c]);
      if(!aday.length) oldu = false;
      else { const sec = [];
        for(let k2 = 0; k2 < 5 && aday.length; k2++)
          sec.push(aday.splice(Math.floor(Math.random()*aday.length), 1)[0]);
        sec.forEach(c => { klvDurum[c] = "yok";

      const k = Math.floor(n / 2);
      if(acik.has(k)) oldu = false;
      else { acik.add(k); gir[k] = gizli[k]; imle = ilkBos();

          sr.children[k].className = "hucre ilk"; });
        yaz(); uyar("Ortadaki harf: " + TRU(gizli[k])); }

      const bos = [...Array(n).keys()].filter(k => !acik.has(k));
      if(bos.length < 1) oldu = false;
      else { const secim = [];
        for(let i = 0; i < 2 && bos.length; i++)
          secim.push(bos.splice(Math.floor(Math.random()*bos.length), 1)[0]);

        uyar(secim.map(k => TRU(gizli[k])).join(" ve ") + " açıldı"); }

      if(sureyok || saatDurdu) oldu = false;
      else { saatDurdu = true; durdur(); sureGoster(false); ustYaz();
        uyar("Saat durdu, bu etapta süre yok"); }

      const icinde = [...new Set(gizli.split(""))].filter(c => !klvDurum[c]);

      else { const c = icinde[Math.floor(Math.random()*icinde.length)];

      if(sat === 0) oldu = false;
      else { sat--;
        const h = satirlar[sat].children;
        for(let k = 0; k < n; k++){
          h[k].textContent = acik.has(k) ? TRU(gizli[k]) : "";
          h[k].className = "hucre" + (acik.has(k) ? " ilk" : ""); }

        imle = ilkBos(); ustYaz(); yaz(); tik();
        uyar("Son tahmin geri alındı"); }

      if(akceCift) oldu = false;
      else { akceCift = true; uyar("Bu etabın stateri iki katı"); }
    } else if(id === "kestirme"){
      S.jok[id]--; if(!S.jok[id]) delete S.jok[id];
      bitti = true; durdur(); sureGoster(false);
      klv.classList.add("gizli"); jokbar.classList.add("gizli");
      S.gorulen.push(gizli); S.sonuc[S.etap] = true; S.etap++;
      if(S.etap === TOPETAP()) S.sonKapi = false;
      if(S.etap >= TOPETAP()) S.bitti = "kazandi";
      kaydet();
      return ekran(`<div class="kutu ort">
        <div class="eyebrow">${S.etap}/${TOPETAP()}. etap atlandı</div>

          <span class="kw">${TRU(gizli)}</span></div>
        <p class="kucuk">Bu etaptan para kazanmadın ama mataran ve serin yerinde.</p>
        <button class="buton" onclick="ilerle()">DEVAM ▸</button>
        <button class="buton ikinci" onclick="haritaEkran('oyun')">🗺 YOL HARİTASI</button>
        <a class="buton ikinci" href="index.html">ANA SAYFA</a>
      </div>`);
    } else if(id === "ikincisans"){
      uyar("İkinci Şans etabı kaybedince kullanılır"); oldu = false;
    }
    if(!oldu){ uyar("Şu an işe yaramaz"); return; }
    S.jok[id]--; if(!S.jok[id]) delete S.jok[id];
    kaydet(); jokCiz(); barYaz();
  };
  function jokCiz(){
    const ids = Object.keys(S.jok).filter(k => S.jok[k] > 0);
    jokbar.classList.remove("gizli");
    if(!ids.length){ jokbar.innerHTML =
      `<span class="bos">Elinde joker yok, bir sonraki konakta alabilirsin</span>`; return; }
    jokbar.innerHTML = ids.map(id => { const u = URUNID[id];
      return `<button onclick="AKTIF.kullan('${id}')" title="${u.kisa}">
        <i>${u.em}</i>${u.ad}<u>${S.jok[id]}</u></button>`; }).join("");
  }

  ustYaz(); yaz(); jokCiz(); klavyeCiz(girHarf, silHarf, gonder); tik(); barYaz();
}

/* ================= akis ================= */
function ilerle(){
  if(S.bitti) return sonEkran();
  if(S.etap >= TOPETAP()) return sonEkran();
  const b = Math.floor(S.etap / 4);
  if(S.etap % 4 === 0){
    if(S.hanNo <= b) return hanEkran(b);          /* her bolumden ONCE bir han */
    if(S.bolumGirisi < b + 1) return bolumGiris(b);
  }
  if(!M.tanitim){ M.tanitim = 1; metaYaz(); return tanitimEkran(); }
  etapBasla();
}
function yolCiz(){
  const yb = YY().bolumler.length;
  return `<div class="yol">` + YY().bolumler.map((bi, b) => {
    const bl = BOLUM[bi];
    const simdi = Math.floor(S.etap/4) === b && !S.bitti;
    const adimlar = UZUN.map((n, i) => {
      const no = b*4 + i;
      let c = "bek";
      if(no < S.etap) c = (S.sonuc && S.sonuc[no] === false) ? "hata" : "ok";
      else if(no === S.etap && !S.bitti) c = "simdi";
      return `<div class="a ${c}">${n}</div>`;
    }).join("");
    const carp = (bl.carpan * YY().carpan).toFixed(2)
      .replace(/0+$/,"").replace(/\.$/,"").replace(".",",");
    const sat = S.satici[b] !== undefined ? SATICI[HANTIP[b]][S.satici[b]] : null;
    const han = `<div class="a han ${S.hanNo > b ? "ok" : ""}">⌂</div>
      <span class="kucuk">${sat ? sat.duk : HANAD[b]}</span>`;
    return `<div class="yb ${simdi ? "simdi" : ""} ${S.etap >= (b+1)*4 ? "bitti" : ""}">
      <div class="ust2"><span class="ad">${bl.ad}</span>
        <span class="no">${b+1}. bölüm · ${carp}× ödül ·
          ${bl.sure + YY().sureFark} sn</span></div>
      <div class="adim">${han}${adimlar}</div></div>`;
  }).join("") + `</div>`;
}
function bolumGiris(b){
  S.bolumGirisi = b + 1;
  let pesinNot = "";
  if(kac("pesin")){ const pz = kac("pesin") * 120; S.akce += pz;
    pesinNot = `<p class="kucuk">💵 Sevilen'in Peşin Ödemesi: kesene
      <b>${TL(pz)} stater</b> eklendi.</p>`; }
  if(kac("boncukdizi") && S.kalp >= S.maxKalp){ const bz = kac("boncukdizi") * 200;
    S.akce += bz;
    pesinNot += `<p class="kucuk">📿 Nazük'ün Boncuk Dizisi: mataran tam,
      kesene <b>${TL(bz)} stater</b> eklendi.</p>`; }
  kaydet();
  const bl = BL(b), carp = (bl.carpan * YY().carpan).toFixed(2)
    .replace(/0+$/,"").replace(/\.$/,"").replace(".",",");
  ekran(`<div class="kutu">
      <div class="eyebrow">${b+1}/${YY().bolumler.length}. bölüm · ${YY().em} ${YY().ad}</div>

        Her tahmin için <b>${bl.sure + YY().sureFark} saniye</b>, ödüller
        <b>${carp}×</b> katsayıyla ödenir.</p>
      ${pesinNot}
      <button class="buton" onclick="etapBasla()">YOLA ÇIK ▸</button>
      <a class="buton ikinci" href="index.html">ANA SAYFA</a>

}

function stokKur(h){
  const tip = HANTIP[h];
  const gecmis = new Set(HANTIP.slice(0, h + 1));     /* onceki hanlarin mallari da */
  const adet = 4 + ((sahipmi("sozlukcildi") || seviye() >= 3) ? 1 : 0)
                 + (sahipmi("mYuzuk") ? 1 : 0) + kac("katalog") * 2
                 + kac("dIskele");
  const olur = u => kilitDurum(u).acik && (u.tek || u.yigin || !sahipmi(u.id));
  const kendi = URUN.filter(u => u.han === tip && olur(u));
  const digerleri = URUN.filter(u => u.han !== tip && gecmis.has(u.han) && olur(u));
  const secilen = [];
  /* agirlikli cekilis: harf actiran urunlerin cikma sansi daha yuksek */
  const cek = arr => {
    if(!arr.length) return;
    const top = arr.reduce((t, u) => t + (u.agirlik || 1), 0);
    let r = Math.random() * top, k = 0;
    for(; k < arr.length; k++){ r -= (arr[k].agirlik || 1); if(r <= 0) break; }
    secilen.push(arr.splice(Math.min(k, arr.length - 1), 1)[0].id);
  };
  cek(kendi); cek(kendi);                             /* hanın kendi uzmanlığı öne */
  const kalan = kendi.concat(digerleri);
  while(secilen.length < adet && kalan.length) cek(kalan);
  const kilitli = URUN.filter(u => gecmis.has(u.han) && !kilitDurum(u).acik);
  S.stok = {h:h, urun:secilen,
    kilitli: kilitli.length ? kilitli[Math.floor(Math.random()*kilitli.length)].id : null};
  kaydet();
}

        <p>${u.tam}</p>
        ${kilitliMi

function yolculukIsle(){
  if(S.metaIslendi) return S.sonTutar;
  const kazandi = S.bitti === "kazandi";
  let toplam;
  if(!kazandi) toplam = Math.round(S.para / 2);
  else if(S.sonKapi) toplam = Math.round((S.para * 2 + SUPER)
    * (sahipmi("mTac") ? 1.5 : 1));
  else if(sahipmi("kupasuyu")) toplam = S.para * 2;
  else toplam = S.para;

  /* 1 · kese devri: kalan staterin %10'u, basarili bitirdiyse %25 */
  const oran = (kazandi ? 0.25 : 0.10) * (sahipmi("sarraf") ? 2 : 1);
  M.devirAkce = Math.round(S.akce * oran / 5) * 5;
  /* 3 · konak kredisi: yarida kalan yolculukta alinan kalici urunler sonrakinde yarim fiyat */
  M.kredi = kazandi ? [] : S.sahip.slice(0, 6);
  /* 4 · basari matarasi */
  if(kazandi) M.bonusKalp = S.sonKapi ? 2 : 1;
  /* 5 · hediye sandigi */
  if(kazandi){
    const hediyelik = URUN.filter(u => u.tek && u.han === 0 && kilitDurum(u).acik);
    if(hediyelik.length)
      M.hediye = hediyelik[Math.floor(Math.random()*hediyelik.length)].id;
  }
  /* 6 · nisanlar */
  if(kazandi){
    M.bitirilen = (M.bitirilen || 0) + 1;
    M.yollar[S.yol] = 1;
    if(S.sonKapi) M.sonKapi = (M.sonKapi || 0) + 1;
    if(S.kalp === 1) M.tekKalp = 1;
    if(!S.alinan) M.urunsuz = 1;
  }
  /* 7 · yol defteri  ·  9 · kilometre */
  M.kasa = (M.kasa || 0) + toplam;
  M.puan = (M.puan || 0) + Math.round(toplam / 10000);
  /* 8 · rekor tablosu */
  const t = new Date();
  M.rekor.push({yol:YY().ad, tl:toplam, etap:S.etap, top:TOPETAP(),
    kapi:!!S.sonKapi, tarih:`${t.getDate()}.${String(t.getMonth()+1).padStart(2,"0")}.`+
    t.getFullYear()});
  M.rekor.sort((a, b) => b.tl - a.tl); M.rekor = M.rekor.slice(0, 5);
  metaYaz();
  S.metaIslendi = 1; S.sonTutar = toplam; kaydet();
  return toplam;
}

          <button onclick="${a ? `yolSec('${k}')` : `uyar('Önce ${YOL[y.kilit].ad}\\'nu bitir')`}">
            <span class="em">${y.em}</span>
            <span class="gv"><b>${y.ad}</b><span>${y.ac}</span></span>
            <span class="fy">${a ? "▸" : "🔒"}<em>${
              M.yollar[k] ? "bitirdin" : (a ? "seç" : "kilitli")}</em></span></button>

      <a class="buton ikinci" href="index.html">ANA SAYFA</a>
    </div>`, false);
}
window.yolSec = function(k){
  sil(); S = bosDurum(k); saticiKur(); bonuslariTuket(); kaydet(); girisEkran();
};
function saticiKur(){
  const kullanilan = {};
  S.satici = HANTIP.map(t => {
    const g = SATICI[t];
    let aday = g.map((_, i) => i).filter(i => !(kullanilan[t] || []).includes(i));
    if(!aday.length) aday = g.map((_, i) => i);
    const s2 = aday[Math.floor(Math.random() * aday.length)];
    kullanilan[t] = (kullanilan[t] || []).concat([s2]);
    return s2;
  });
}

function basla(){
  KISILER = LG_kisiler(KISI_VAR);
  if(!KISI || KISI === LG_KAYITSIZ || KISILER.indexOf(KISI) < 0) return kisiEkran();
  metaOku();
  S = oku();
  if(!S){ if(M.bitirilen || M.rekor.length) return yolSecEkran();
    S = bosDurum("normal"); saticiKur(); bonuslariTuket(); kaydet();
    return girisEkran(); }
  if(!S.sonuc) S.sonuc = [];
  if(!S.yol || !YOL[S.yol]) S.yol = "normal";
  if(!S.satici || S.satici.length < HANTIP.length) saticiKur();
  if(!S.baslangic){ S.baslangic = 1; S.akce += BASLANGIC; kaydet(); }
  if(S.bitti) return sonEkran();
  if(S.etap === 0 && !S.bolumGirisi && !S.hanNo) return girisEkran();
  devamEkran();
}

/* ---- fiziksel klavye (bilgisayarda oynayanlar icin) ---- */
document.addEventListener("keydown", e => {
  if(klv.classList.contains("gizli")) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if(k === "Enter"){
    const b = [...klv.querySelectorAll("button")].find(x => x.textContent === "TAMAM");
    if(b){ e.preventDefault(); b.click(); }
  } else if(k === "Backspace"){
    const b = [...klv.querySelectorAll("button")].find(x => x.textContent === "SİL");
    if(b){ e.preventDefault(); b.click(); }
  } else if(k.length === 1){
    const c = k.toLocaleLowerCase("tr");
    if(klvTus[c]){ e.preventDefault(); klvTus[c].click(); }
  }
});

const GECERLI = {};
function yukle(){
  LG_sesDugme($("#sesd"));
  orta.innerHTML = `<div class="kutu ort"><h2>Likya Yolu hazırlanıyor…</h2>
    <p class="kucuk">Kelime havuzları yükleniyor.</p></div>`;
  Promise.all([
    fetch("kervan-veri.json").then(r => r.json()),
    fetch("oyun-veri.json").then(r => r.json()),
    fetch("oyun-tanim.json").then(r => r.json())
  ]).then(([kv, ov, tn]) => {
    VERI = kv; OYUN = ov; TANIM = tn;
    for(const n of [4,5,6,7]) GECERLI[n] = new Set(ov.gecerli[n]);
    basla();
  }).catch(e => {
    const m = (e && (e.message || e)) + "";
    orta.classList.add("ort");
    orta.innerHTML = `<div class="kutu ort"><h2>Açılamadı</h2>
      <p class="kucuk">Sayfa güncellendiği için tarayıcıda eski bir dosya kalmış
        olabilir. Aşağıdaki düğme önbelleği temizleyip yeniden yükler.</p>
      <button class="buton" onclick="tazele()">TEMİZLE VE YENİLE</button>
      <p class="kucuk" style="margin-top:10px;opacity:.6">${m}</p></div>`;
  });
}
window.tazele = function(){
  try{ if(window.caches && caches.keys)
    caches.keys().then(k => k.forEach(x => caches.delete(x))); }catch(e){}
  location.replace(location.pathname + "?t=" + Date.now());
};

});
