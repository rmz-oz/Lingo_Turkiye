<script>
const $ = s => document.querySelector(s);
const TRU = s => s.replace(/i/g,"İ").replace(/ı/g,"I").toUpperCase();
const KISI_VAR = ["Serpil","Zeynep"];
let KISILER = LG_kisiler(KISI_VAR), KISI = null;
KISI = LG_kisiDogrula(KISILER);
if(!KISI || KISI === LG_KAYITSIZ)
  KISI = KISILER.find(a => LG_defter(a).length) || KISILER[0];
let SEC = null;
function kisiSec(a){ KISI = a; SEC = null; ciz(); }
function kademeSec(t){ SEC = t; ciz(); }
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos",

 {n:2000, ad:"ALTIN", em:"🥇", tip:"altin",

 {n:250, ad:"BRONZ", em:"🥉", tip:"bronz",

const LAKAP = {
  gumus:["Harfleri yerine koyma sanatçısı",
   "Yanlış yerdeki sarı harfleri doğru yerine koyarken gösterdiği zarafet, izleyenler "+

};

function adPunto(ad, tip){
  const u = ad.length;
  if(tip === "gumus") return u<=8?52:(u<=12?42:(u<=18?33:(u<=25?26:22)));
  return u<=8?46:(u<=14?38:(u<=20?31:(u<=27?25:21)));
}
/* ad: kisa tek kelime -> harf kutulari, uzun/cok kelimeli -> bas harf + yazi */
function adBlok(ad){
  const kel = ad.split(" ").filter(Boolean), n = ad.replace(/ /g,"").length;
  if(kel.length === 1 && n <= 11){
    const boy = n <= 6 ? 17 : (n <= 8 ? 15 : 13);
    const kutu = [...TRU(ad)].map((c,i) =>
      `<div class="hk ${i%2?"s":"y"}" style="width:${boy}mm;height:${boy}mm;
        font-size:${Math.round(boy*1.06)}pt">${c}</div>`).join("");
    return `<div class="tahta" style="gap:${boy>=15?2.4:2}mm">${kutu}</div>`;
  }
  const bas = kel.map(k => TRU(k[0])).slice(0,6), boy = bas.length <= 5 ? 11 : 10;
  const kutu = bas.map((c,i) =>
    `<div class="hk ${i%2?"s":"y"}" style="width:${boy}mm;height:${boy}mm;
      font-size:${Math.round(boy*1.02)}pt">${c}</div>`).join("");
  const u = ad.length, fs = u <= 14 ? 40 : (u <= 20 ? 33 : (u <= 27 ? 27 : 23));
  return `<div class="tahta" style="gap:2mm">${kutu}</div>
    <div class="ad adYazi" style="font-size:${fs}pt">${ad}</div>`;
}

/* --- sertifikayi yuksek cozunurluklu resme cevir --- */
const PNGEN = 2400;                     /* uzun kenar · A4 yatayda ~205 dpi */
async function pngYap(mod){
  const btn = document.getElementById("pngbtn");
  const sy = document.querySelector(".sayfa");
  const kadraj = document.getElementById("kadraj");
  if(!sy) return;
  if(typeof html2canvas !== "function"){
    return uyar("Resim aracı yüklenemedi, internet bağlantısını kontrol et,\n" +
                "ya da PDF olarak yazdır.");
  }
  const eskiMetin = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Resim hazırlanıyor…"; }
  /* olcek sifirlanir, gercek boyutta cizilir, sonra geri alinir */
  const eskiTr = sy.style.transform, eskiH = kadraj ? kadraj.style.height : "";
  const eskiOv = kadraj ? kadraj.style.overflow : "";
  sy.style.transform = "none";
  if(kadraj){ kadraj.style.height = "auto"; kadraj.style.overflow = "visible"; }
  try{
    const gen = sy.offsetWidth || 1122;
    const cvs = await html2canvas(sy, {
      scale: PNGEN / gen,
      backgroundColor: null,
      useCORS: false,
      logging: false,
      windowWidth: gen,
      windowHeight: sy.offsetHeight
    });
    const ad = (KISI || "Sertifika").replace(/[^0-9A-Za-zÇĞİÖŞÜçğıöşü]+/g, "_");
    const kadAd = (document.querySelector(".kadsec button.on b") || {}).textContent || "";
    const dosya = `Lingo_${kadAd.replace(/\s+/g,"_")}_${ad}.png`;
    const blob = await new Promise(r => cvs.toBlob(r, "image/png"));
    if(!blob) throw new Error("resim üretilemedi");
    const f = new File([blob], dosya, {type:"image/png"});
    if(mod === "paylas" && navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:"Lingo sertifikası"});
    } else {
      const u = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = u; a.download = dosya; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 4000);
    }
  }catch(e){
    if(!(e && e.name === "AbortError")) uyar("Resim yapılamadı: " + ((e&&e.message)||e));
  }finally{
    sy.style.transform = eskiTr;
    if(kadraj){ kadraj.style.height = eskiH; kadraj.style.overflow = eskiOv; }
    if(btn){ btn.disabled = false; btn.textContent = eskiMetin; }
    olcekle();
  }
}
function uyar(m){
  const d=document.createElement("div");
  d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:26px;"+
    "background:#f2f5f8;color:#0f1720;padding:11px 16px;border-radius:12px;"+
    "font-weight:700;z-index:60;max-width:88vw;text-align:center;white-space:pre-line";
  d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),3200);
}
window.pngYap = pngYap;
function olcekle(){
  const k = $("#kadraj"); if(!k) return;
  const s = k.clientWidth / (297 * 96 / 25.4);
  const sy = k.querySelector(".sayfa");
  sy.style.transform = `scale(${s})`;
  k.style.height = (210 * 96 / 25.4 * s) + "px";
}
addEventListener("resize", olcekle);

function sertifika(K, d, ra){
  const bil = d.filter(r=>r.k>0);
  const basari = Math.round(100*bil.length/d.length);
  const ort = bil.length ? (bil.reduce((t,r)=>t+r.k,0)/bil.length).toFixed(1).replace(".",",") : ", ";
  const U = LG_unvan(d.length);
  const gunler = new Set(d.map(r=>new Date(r.t).toDateString())).size;
  const p = LG_plan(KISI), gorev = Object.values(p).filter(Boolean).length;
  const t = new Date();
  const gun = String(t.getDate()).padStart(2,"0");
  const tarih = gun+" "+AYLAR[t.getMonth()]+" "+t.getFullYear();
  const nis = ra.slice(0,7).map(r=>`<span>${r.a}</span>`).join("");
  const stil = `--kagit:${K.kagit};--kagit2:${K.kagit2};--ink:${K.ink};--metal:${K.metal};
    --metalK:${K.metalK};--metalA:${K.metalA};--soluk2:${K.soluk};--yumusak:${K.metal}22;
    background:${K.kagit}`;
  const ist = `<div class="ist">
    <div><b>${d.length.toLocaleString("tr-TR")}</b><span>${TRU("Çözülen kelime")}</span></div>
    <div><b>%${basari}</b><span>${TRU("Başarı oranı")}</span></div>
    <div><b>${ort}</b><span>${TRU("Ortalama tahmin")}</span></div>
    <div><b>${ra.length}</b><span>${TRU("Kazanılan rozet")}</span></div></div>`;
  const imza = `<div class="imzaBlok"><div class="sigwrap">
      <img class="sig" src="assets/imza.png" alt="imza"></div>
    <div class="cizgiA"></div><div class="kim">${TRU("Aile Yarışma Komitesi")}</div></div>`;

  let ic, sus, taban;
  if(K.tip === "altin"){
    sus = `<div class="cerceve"></div><div class="cerceve2"></div>
      ${KOSE("tl")}${KOSE("tr")}${KOSE("bl")}${KOSE("br")}`;
    ic = `<div class="eyebrow">${TRU("Lingo Türkiye · Hazırlık Programı")}</div>
      <div class="ayrac"><i></i><b></b><i></i></div>
      <h1>${TRU("Altın Hazırlık Sertifikası")}</h1>
      <p class="giris">Bu sertifika, şu ana kadar yayınlanmış bölümlerin cevap arşivinden
        hazırlanan çalışma programını eksiksiz tamamlayan</p>
      <div class="ad" style="margin-top:4.5mm;font-size:${adPunto(KISI,"altin")}pt">
        ${TRU(KISI)}</div>
      <div class="unvan">${TRU(U.simdi.ad)}</div>
      ${ist}
      <p class="giris kucukAlt">adına, ${d.length.toLocaleString("tr-TR")} kelime çözmüş
        olmasına rağmen hala “ben pek bilmiyorum” dediği için düzenlenmiştir.</p>
      <div class="nisanBas" style="margin-top:auto">${TRU("Başlıca Nişanlar")}</div>
      <div class="nisan">${nis}</div>`;
    taban = `<div class="imzaBlok"><div class="tarihBuyuk">${tarih}</div>
      <div class="cizgiA"></div><div class="kim">${TRU("Düzenleme tarihi")}</div></div>${imza}`;
  } else {
    const L = LAKAP[K.tip];
    const adH = K.tip === "gumus"
      ? `<div class="defneSar">${DAL("")}
          <div class="adSar"><div class="ad defneAd"
             style="font-size:${adPunto(KISI,"gumus")}pt">${TRU(KISI)}</div>
           <div class="unvan">${TRU(U.simdi.ad)}</div></div>${DAL("ters")}</div>`
      : `${adBlok(KISI)}<div class="unvan" style="margin-top:6mm">${TRU(U.simdi.ad)}</div>`;
    sus = K.tip === "gumus" ? `<div class="cerceve ince"></div>`
                            : `<div class="cerceve"></div><div class="cerceve2"></div>`;
    ic = `<div class="eyebrow">${TRU("Lingo Türkiye · Hazırlık Programı")}</div>
      <h1>${TRU(K.ad + " Hazırlık Sertifikası")}</h1>
      ${adH}
      <div class="lakap">${TRU(L[0])}</div>
      <p class="giris">${L[1]}</p>
      <div class="nisanBas">${TRU("Kazanılan Nişanlar")} · ${ra.length}</div>
      <div class="nisan">${nis}</div>
      ${ist}
      <p class="dipnot">${L[2]}</p>`;
    taban = `<span class="tarihK">${tarih}<em>${TRU("Düzenleme tarihi")}</em></span>${imza}`;
  }
  return `<div class="kadraj" id="kadraj"><div class="sayfa" lang="tr" style="${stil}">
    ${sus}<div class="filigran">${MUHUR(K.ad)}</div>
    <div class="ic">${ic}</div><div class="taban">${taban}</div></div></div>`;
}

function ciz(){
  const d = LG_defter(KISI), ra = LG_acik(KISI);
  const secErit = `<div class="kgrid">${KISILER.map(a =>
    `<button class="${a===KISI?"on":""}" onclick="kisiSec('${a.replace(/'/g,"")}')">
      ${a}</button>`).join("")}</div>`;
  const kazanilan = KADEME.filter(x => d.length >= x.n);
  if(SEC && !kazanilan.some(x => x.tip === SEC)) SEC = null;
  const kad = kazanilan.find(x => x.tip === SEC) || kazanilan[0];

  if(!kad){
    const kalan = 250 - d.length, oran = Math.min(100, Math.round(100*d.length/250));
    $("#alan").innerHTML = secErit + `<div class="bos">
      Sertifika için en az <b>250 kelime</b> gerekiyor.<br>
      <b>${KISI}</b> adına şu an <b>${d.length}</b> kayıt var: <b>${kalan}</b> kelime kaldı.
      <div class="ilerle"><i style="width:${oran}%"></i></div>
      <div style="font-size:12.5px">%${oran}</div>
      <div class="kadlist">
        <div><em>🥉</em>Bronz sertifika<b>250 kelime</b></div>
        <div><em>🥈</em>Gümüş sertifika<b>1.000 kelime</b></div>
        <div><em>🥇</em>Altın sertifika<b>2.000 kelime</b></div>
      </div></div>
      <a class="buton" href="alistirma5.html">ALIŞTIRMAYA BAŞLA</a>
      <a class="buton ikinci" href="index.html">ANA SAYFA</a>`;
    return;
  }
  const sonraki = KADEME.slice().reverse().find(x => x.n > d.length);
  const kadSec = `<div class="kadsec">${KADEME.slice().reverse().map(x => {
    const acik = d.length >= x.n, sec = x === kad;
    const kalan = (x.n - d.length).toLocaleString("tr-TR");
    return `<button class="${sec?"on":""}" ${acik?"":"disabled"}
      onclick="kademeSec('${x.tip}')"><i>${x.em}</i><b>${x.ad}</b>
      <u>${acik ? (sec ? "seçili" : "bas") : kalan + " kelime daha"}</u></button>`;
  }).join("")}</div>`;
  $("#alan").innerHTML = secErit + kadSec + sertifika(kad, d, ra) +
    `<button class="buton" id="pngbtn" onclick="pngYap('paylas')">
       📷 RESİM OLARAK KAYDET / PAYLAŞ</button>
     <p class="not">WhatsApp'ta en iyi görünen budur: yüksek çözünürlüklü tek bir
       resim. Telefonda paylaşma menüsü açılır, bilgisayarda dosya olarak iner.</p>
     <button class="buton ikinci" onclick="window.print()">🖨 PDF olarak yazdır</button>
     <p class="not">Yazdır ekranında <b>hedef: PDF olarak kaydet</b>, <b>yön: yatay</b>,
       <b>arka plan grafikleri: açık</b> seçin.</p>` +
    `<p class="not">Kazandığın her kademeyi istediğin zaman, <b>o günkü güncel
       rakamlarınla</b> yeniden bastırabilirsin.</p>` +
    (sonraki ? `<p class="not">${sonraki.em} <b>${sonraki.ad}</b> sertifika için
       ${(sonraki.n - d.length).toLocaleString("tr-TR")} kelime daha.</p>` :
      `<p class="not">🥇 En üst kademedesin. Tebrikler!</p>`) +
    `<a class="buton ikinci" href="rapor.html">📊 GELİŞİM RAPORU</a>
     <a class="buton ikinci" href="index.html">ANA SAYFA</a>`;
  olcekle();
}
ciz();
</script><script src="menu.js?v=1"></script>
</body></html>
