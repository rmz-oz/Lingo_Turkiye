<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0E1520">
<title>Lingo Masa Yarışması</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
/* ================= iki tema =================
   gece: derin lacivert mürekkep · gündüz: soğuk beyaz stüdyo
   Anlam taşıyan üç renk (yeşil doğru, sarı var, gri yok) iki temada da
   aynı kalır; yalnızca çevresindeki yüzeyler ve yazı tonları değişir.     */
:root{
  /* --- yüzeyler --- */
  --zemin:#0E1520; --bar:#080F18; --barAlt:#0C131D; --kart:#18212E;
  --ickart:#131B26; --ickart2:#1A2331; --yuva:#212D3A;
  --cizgi:#2A3542; --cizgiJ:#293344; --ilkCizgi:#4A5A6B; --nokta:#5D6F82;
  /* --- yazı --- */
  --ink:#F1F5FA; --ink2:#CED8E3; --ink3:#B7C3D2; --soluk:#93A1B0; --soluk2:#7A889A;
  /* --- anlam renkleri --- */
  --yesil:#2E9E5B; --yesilUst:#FFFFFF; --yesilInk:#87DCA9;
  --yesilZemin:#14291D; --yesilZemin2:#1A3627; --yesilCizgi:#3B7A52;
  --sari:#E0AE2E; --sariUst:#241A00;
  --gri:#3A4756; --yokInk:#8FA0B0;
  --kirmizi:#DB5164; --kirmiziUst:#FFFFFF; --kirmiziInk:#F5A6B0;
  --kirmiziZemin:#2C161C; --kirmiziCizgi:#5E2F3B; --pembe:#FF9DB0;
  --kirmiziGolge:rgba(219,81,100,.38);
  /* --- altın (vurgu) --- */
  --altin:#F2C75C; --altinUst:#1A1200; --siraZemin:#231E10;
  /* --- menekşe (dükkan) --- */
  --mor:#6C5CE7; --mor2:#8E6CE8; --morUst:#FFFFFF; --morInk:#B9A8FF;
  --morInk2:#E4DAFF; --morZemin:#161C2C; --morKutu:#1B2440; --morKutuCizgi:#313D68;
  --morCizgi:#2F3760; --morCizgi2:#463D8C; --morCizgi3:#37416A; --morVurgu:#5A69BE;
  --morHover:#1F2942; --morHalka:rgba(108,92,231,.35); --morHalka2:rgba(108,92,231,.18);
  /* --- klavye --- */
  --tus:#3A4756; --tusInk:#FFFFFF; --tusYok:#1C2731; --tusYokInk:#5D6B7A;
  --kapali:#2C3846;
  /* --- diğer --- */
  --toastZemin:rgba(11,17,25,.95); --golge:rgba(0,0,0,.45);
}
:root[data-tema="gunduz"]{
  --zemin:#EDF1F7; --bar:#FFFFFF; --barAlt:#F4F7FB; --kart:#FFFFFF;
  --ickart:#F5F8FC; --ickart2:#E9EFF7; --yuva:#DEE6F0;
  --cizgi:#D3DCE7; --cizgiJ:#D8E0EB; --ilkCizgi:#9EAFC1; --nokta:#A4B2C1;
  --ink:#14202D; --ink2:#2B3949; --ink3:#3C4B5C; --soluk:#5B6A7B; --soluk2:#78879A;
  --yesil:#2E9E5B; --yesilUst:#FFFFFF; --yesilInk:#1C6E40;
  --yesilZemin:#E3F4EA; --yesilZemin2:#CFEBDB; --yesilCizgi:#9BD3B2;
  --sari:#E0AE2E; --sariUst:#3A2900;
  --gri:#7E8D9E; --yokInk:#FFFFFF;
  --kirmizi:#C33B2E; --kirmiziUst:#FFFFFF; --kirmiziInk:#93281F;
  --kirmiziZemin:#FBE7E4; --kirmiziCizgi:#EAB2AB; --pembe:#B22B22;
  --kirmiziGolge:rgba(195,59,46,.3);
  --altin:#A9791A; --altinUst:#2B1F00; --siraZemin:#FDF3D8; --altinDolgu:#E8B93F;
  --mor:#5B4BC4; --mor2:#7360D8; --morUst:#FFFFFF; --morInk:#4B3BAF;
  --morInk2:#3A2C93; --morZemin:#F0EDFC; --morKutu:#E7E2FA; --morKutuCizgi:#C3B9F0;
  --morCizgi:#CFC7F3; --morCizgi2:#B4A8EA; --morCizgi3:#C6BDF1; --morVurgu:#7D6CD9;
  --morHover:#E2DCF8; --morHalka:rgba(91,75,196,.28); --morHalka2:rgba(91,75,196,.14);
  --tus:#DCE4EE; --tusInk:#14202D; --tusYok:#E6ECF3; --tusYokInk:#98A6B5;
  --kapali:#CBD5E1; --hucreCizgi:#C6D2E0;
  --toastZemin:rgba(255,255,255,.96); --golge:rgba(20,32,45,.16);
  --kartGolge:0 1px 2px rgba(20,32,45,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{color-scheme:dark}
html[data-tema="gunduz"]{color-scheme:light}
body{margin:0;background:var(--kagit);color:var(--murekkep);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer}
#bar{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--bar);
  border-bottom:1px solid var(--cizgi);flex:none;font-size:12px}
#bar .kod{background:var(--mor);color:var(--morUst);border-radius:999px;padding:2px 9px;
  font-weight:800;letter-spacing:1.1px;font-size:11px;flex:none}
#bar .et{color:var(--altin);font-weight:800;letter-spacing:.8px;text-transform:uppercase}
#bar .sag{margin-left:auto;display:flex;align-items:center;flex:none}
#bar .ag{color:var(--soluk)}
#bar #sesd,#bar #temad{border:1px solid var(--cizgi);background:transparent;
  border-radius:99px;width:30px;height:26px;padding:0;font-size:13px;line-height:1;
  color:var(--ink);margin-left:6px;flex:none}
#bar #temad{margin-left:4px}
#bar .et{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#bar .ag{white-space:nowrap;font-size:11px}
#bar .ag.kopuk{color:var(--kirmizi);font-weight:800}
#kopuk{position:fixed;left:0;right:0;bottom:0;background:var(--kirmizi);color:var(--kirmiziUst);
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));text-align:center;
  font-weight:800;font-size:14.5px;z-index:40;box-shadow:0 -4px 18px var(--golge)}
#kopuk small{display:block;font-weight:600;font-size:12.5px;opacity:.9;margin-top:2px}
@media (max-width:400px){ #bar .ag{display:none} }
#bar #sesd.kapali{opacity:.45}
#bar .ag b{color:var(--yesil)}
#sure{width:100%;height:4px;background:var(--yuva);flex:none}
#sure i{display:block;height:100%;background:var(--altin);width:100%}
#sure.az i{background:var(--kirmizi)}
/* skor tablosu */
#skor{display:flex;gap:4px;padding:5px 6px;background:var(--barAlt);flex:none;
  border-bottom:1px solid var(--cizgi)}
#skor .m{flex:1;background:var(--kart);border:1.4px solid var(--cizgi);border-radius:8px;
  box-shadow:var(--kartGolge,none);
  padding:5px 4px;text-align:center;min-width:0;line-height:1.28}
#skor .m.on{border-color:var(--altin);background:var(--siraZemin)}
#skor .m.ben{box-shadow:inset 0 0 0 1.5px var(--mor)}
#skor .m b{display:block;font-size:11.5px;font-weight:800;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#skor .m i{font-style:normal;font-size:12.5px;font-weight:800;color:var(--altin);
  font-variant-numeric:tabular-nums}
#skor .m u{display:block;text-decoration:none;font-size:9px;color:var(--soluk);
  letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
@media (max-height:800px){ #skor .m u{display:none} }
#skor .m i.eksi{color:var(--kirmizi)}
#skor .m .jk{display:inline;font-size:10px;letter-spacing:.3px;margin-left:3px}
/* ---- joker dukkani ---- */
.dukbas{max-width:460px;width:100%;text-align:center;font-size:11px;font-weight:800;
  letter-spacing:1.9px;text-transform:uppercase;color:var(--morInk)}
.kese{max-width:460px;width:100%;background:var(--morZemin);border:1px solid var(--morCizgi);
  border-radius:13px;padding:12px 14px;font-size:13.5px;line-height:1.6;
  color:var(--ink3);text-align:center}
.kese.borc{background:var(--kirmiziZemin);border-color:var(--kirmiziCizgi)}
.kese b{color:var(--ink)}
.kese .tut{display:block;font-size:23px;font-weight:800;letter-spacing:-.4px;
  color:var(--morInk2);font-variant-numeric:tabular-nums;margin-bottom:3px}
.kese.borc .tut{color:var(--pembe)}
.jkart{display:flex;align-items:center;gap:11px;border:1px solid var(--cizgiJ);
  border-radius:14px;background:var(--ickart);padding:11px 12px;margin-top:8px;
  max-width:460px;width:100%;text-align:left;transition:border-color .15s,background .15s}
.jkart .em{font-size:20px;width:40px;height:40px;flex:none;border-radius:11px;
  background:var(--morKutu);border:1px solid var(--morKutuCizgi);display:flex;align-items:center;
  justify-content:center;line-height:1}
.jkart .gv{flex:1;min-width:0}
.jkart .gv b{display:block;font-size:15px;color:var(--ink);line-height:1.25}
.jkart .gv span{display:block;font-size:12.5px;color:var(--soluk2);line-height:1.45;
  margin-top:3px}
.jkart .fy{flex:none;text-align:right;font-weight:800;font-size:15px;color:var(--altin);
  font-variant-numeric:tabular-nums;line-height:1.2}
.jkart .fy em{font-style:normal;display:block;font-size:9.5px;color:var(--soluk2);
  letter-spacing:.5px;font-weight:700;text-transform:uppercase;margin-top:2px}
.jkart:active{background:var(--ickart2)}
.jkart.elde{border-color:var(--yesilCizgi);background:var(--yesilZemin)}
.jkart.elde .em{background:var(--yesilZemin2);border-color:var(--yesilCizgi)}
.jkart.elde .fy em{color:var(--yesilInk)}
.jkart.dolu{opacity:.62;border-style:dashed;background:transparent}
.jkart.dolu .fy{color:var(--yesilInk)}
.jkart.dolu .gv b{color:var(--ink3)}
.jkart:disabled{cursor:default}
@media (hover:hover){ .jkart:not(:disabled):hover{border-color:var(--morVurgu);background:var(--ickart2)} }
.dukbtn{display:block;width:100%;max-width:460px;background:var(--mor);color:var(--morUst);
  border:0;border-radius:13px;padding:14px;font-weight:800;font-size:16px;
  margin-top:12px;letter-spacing:.3px}
.dukbtn.bekle{background:transparent;color:var(--morInk);border:1.6px solid var(--morCizgi2)}
@media (hover:hover){ .dukbtn:hover{filter:brightness(1.1)} }
.hazsat{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:460px;
  width:100%;margin-top:9px}
.hazsat span{font-size:11.5px;font-weight:700;border-radius:99px;padding:4px 10px;
  border:1px solid var(--cizgi);color:var(--soluk)}
.hazsat span.ok{border-color:var(--yesilCizgi);color:var(--yesilInk);background:var(--yesilZemin)}
.jokbar{display:flex;gap:6px;justify-content:center;max-width:100%;width:100%;
  margin-top:2px;overflow-x:auto;padding:1px 2px;scrollbar-width:none}
.jokbar::-webkit-scrollbar{display:none}
.jokbar button{background:var(--ickart2);border:1px solid var(--morCizgi3);color:var(--ink2);flex:none;
  border-radius:12px;padding:0 9px;height:38px;min-width:46px;font-size:17px;
  font-weight:700;display:flex;align-items:center;gap:4px;line-height:1}
.jokbar button:disabled{opacity:.3;border-color:var(--cizgi)}
.jokbar button u{text-decoration:none;color:var(--morInk);font-weight:800;font-size:12.5px}
@media (hover:hover){ .jokbar button:not(:disabled):hover{border-color:var(--mor);
  background:var(--morHover)} }
/* yuzen bildirim: yerlesimden yer calmaz, klavyenin hemen ustunde durur */
#toast{position:fixed;left:0;right:0;bottom:calc(var(--klh, 12px) + 8px);
  display:flex;justify-content:center;pointer-events:none;z-index:15;padding:0 12px}
#toast .ic{background:var(--toastZemin);border:1px solid var(--cizgi);
  border-radius:11px;padding:7px 14px;font-size:14px;font-weight:700;max-width:460px;
  text-align:center;line-height:1.35;color:var(--soluk);
  box-shadow:0 6px 20px var(--golge)}
#toast .ic.iyi{color:var(--yesilInk);border-color:var(--yesilCizgi);background:var(--yesilZemin)}
#toast .ic.kotu{color:var(--kirmiziInk);border-color:var(--kirmiziCizgi);background:var(--kirmiziZemin)}
#toast .ic.bek{color:var(--ink2)}
.hazirlar{font-size:12.5px;color:var(--soluk);text-align:center;margin-top:4px}
.hazirlar b{color:var(--altin)}
#orta{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:8px 10px;gap:7px;min-height:0;
  -webkit-overflow-scrolling:touch}
#orta:not(.ust) > :first-child{margin-top:auto}
#orta:not(.ust) > :last-child{margin-bottom:auto}
#orta.oyun{justify-content:flex-start;padding-top:6px;gap:6px}
#orta.oyun > :first-child{margin-top:0}
#orta.oyun > :last-child{margin-bottom:0}
.baslik{font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--soluk);
  font-weight:700;text-align:center}
.baslik b{color:var(--altin)}
#tahta{display:grid;gap:4px;justify-content:center}
#tahta .satir{display:grid;gap:4px}
.hucre{width:var(--hg);height:var(--hg);border:2px solid var(--hucreCizgi,var(--cizgi));
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:800;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:calc(var(--hg)*.52);
  background:var(--ickart)}
.hucre.ilk{border-color:var(--ilkCizgi);color:var(--altin)}
.hucre.nisan{border-color:var(--mor);box-shadow:0 0 0 2px var(--morHalka);
  cursor:pointer;animation:nisanYan 1.1s infinite}
@keyframes nisanYan{50%{box-shadow:0 0 0 4px var(--morHalka2)}}
.hucre.dolu{border-color:var(--ilkCizgi)}
.hucre.tam{background:var(--yesil);border-color:var(--yesil);color:var(--yesilUst)}
.hucre.var{background:var(--sari);border-color:var(--sari);color:var(--sariUst)}
.hucre.yok{background:var(--gri);border-color:var(--gri);color:var(--yokInk)}
.satir.aktif .hucre{border-color:var(--nokta)}
.ipucu{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;
  padding:11px 13px;max-width:460px;text-align:center;font-size:16px;line-height:1.4}
.ipucu b{color:var(--altin);display:block;font-size:11px;letter-spacing:1.1px;
  text-transform:uppercase;margin-bottom:5px}
#klavye{flex:none;padding:4px 3px calc(4px + env(safe-area-inset-bottom));
  background:var(--bar);border-top:1px solid var(--cizgi)}
#klavye .sr{display:flex;gap:4px;justify-content:center;margin-bottom:3px}
#klavye .sr:last-child{margin-bottom:0}
@media (min-width:640px){ #klavye .sr{max-width:620px;margin-left:auto;margin-right:auto} }
@media (min-width:640px){ #skor .m{max-width:250px} #skor{justify-content:center} }
#klavye button{flex:1 1 0;min-width:0;height:var(--tush);border:0;border-radius:8px;
  background:var(--tus);color:var(--tusInk);font-weight:700;font-size:var(--tusf);padding:0}
/* rahat yazmak en onemlisi: klavye onceligi alir, tahta kalan yere sigar */
:root{--tush:78px; --tusf:25px}
@media (max-height:880px){ :root{--tush:72px; --tusf:24px} }
@media (max-height:800px){ :root{--tush:68px; --tusf:23px} }
@media (max-height:720px){ :root{--tush:62px; --tusf:21px} }
@media (max-height:640px){ :root{--tush:56px; --tusf:20px} }
@media (max-height:570px){ :root{--tush:50px; --tusf:18px} }
@media (max-height:500px){ :root{--tush:44px; --tusf:17px} }
#klavye button.gnis{flex:1.9 1 0;font-size:calc(var(--tusf) * .82)}
#klavye button.dar{flex:1.9 1 0;font-size:calc(var(--tusf) * .82)}
#klavye button.tam{background:var(--yesil)}
#klavye button.var{background:var(--sari);color:var(--sariUst)}
#klavye button.yok{background:var(--tusYok);color:var(--tusYokInk)}
#klavye.kilit{opacity:.35;pointer-events:none}
.izle{text-align:center;font-size:13px;color:var(--soluk);padding:9px}
.buzz{width:100%;max-width:460px;background:var(--kirmizi);color:var(--kirmiziUst);border:0;
  border-radius:16px;padding:26px;font-size:26px;font-weight:800;letter-spacing:2px;
  box-shadow:0 6px 22px var(--kirmiziGolge);animation:nab 1s infinite}
@keyframes nab{50%{transform:scale(.97)}}
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;
  padding:18px 16px;max-width:460px;width:100%;text-align:center}
.kutu h1{font-size:26px;margin:0 0 6px;letter-spacing:-.5px}
.kutu h2{font-size:19px;margin:0 0 8px}
.kutu p{color:var(--soluk);margin:0 0 10px;font-size:15px;line-height:1.5}
.kutu p b{color:var(--murekkep)}
.buton{display:block;width:100%;background:var(--altinDolgu,var(--altin));
  color:var(--altinUst);border:0;
  border-radius:12px;padding:14px;font-weight:800;font-size:16.5px;margin-top:9px}
.buton.ikinci{background:transparent;color:var(--murekkep);border:1.5px solid var(--cizgi)}
.buton.mor{background:linear-gradient(135deg,var(--mor),var(--mor2));color:var(--morUst)}
.buton:disabled{background:var(--kapali);color:var(--soluk2)}
input.ad{width:100%;background:var(--yuva);border:1.5px solid var(--cizgi);border-radius:10px;
  padding:11px;color:var(--murekkep);font:inherit;font-weight:700;text-align:center;
  margin:5px 0}
input.ad{width:100%;background:var(--yuva);border:1.5px solid var(--cizgi);border-radius:10px;
  padding:11px;color:var(--murekkep);font:inherit;font-weight:700;text-align:center;margin:5px 0}
.link{background:var(--bar);border:1px dashed var(--cizgi);border-radius:10px;padding:10px;
  font-size:12px;color:var(--soluk);word-break:break-all;margin:8px 0;
  font-family:ui-monospace,Menlo,monospace;user-select:text}
.msj{text-align:center;font-size:14px;font-weight:700;padding:5px 11px;border-radius:9px;
  line-height:1.4;max-width:460px}
.msj.iyi{background:var(--yesilZemin);color:var(--yesilInk)}
.msj.kotu{background:var(--kirmiziZemin);color:var(--kirmiziInk)}
.msj.bek{background:var(--yuva);color:var(--soluk)}
.kw{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:800;
  letter-spacing:4px;color:var(--altin)}
.gizli{display:none!important}

/* --- gezinme tuslari buyutuldu: rahat dokunulsun --- */
#bar{gap:13px;padding-top:9px;padding-bottom:9px}
#bar .geri{font-size:31px;line-height:1;padding:0 8px 4px 2px;min-width:30px;
  color:var(--murekkep);opacity:.85}
#bar .geri:active{opacity:.5}
#bar #sesd,#bar #temad{width:44px;height:38px;font-size:20px;border-radius:99px;
  padding:0;flex:none}
#bar #temad{margin-left:10px}
#bar .sag{gap:12px}

/* centik payi: saat ve kamera cubugunun altina girmesin */
#bar{padding-top:calc(9px + env(safe-area-inset-top,0px))}

/* --- geri oku: buyuk ve rahat dokunulur --- */
#bar .geri,header .geri{font-size:30px;line-height:1;font-weight:400;
  text-decoration:none;color:var(--murekkep);opacity:.9;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  min-width:46px;height:44px;margin-left:-6px;padding:0}
#bar .geri:active,header .geri:active{opacity:.5}

/* --- uc nokta menusu --- */
.mnk{width:44px;height:38px;flex:none;border:1px solid var(--cizgi);border-radius:99px;
  background:transparent;color:var(--murekkep);font-size:19px;line-height:1;
  padding:0;margin-left:auto;cursor:pointer;font-family:inherit}
.mnk:active{opacity:.6}
.mnf{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none}
.mnf.acik{display:block}
.mnl{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:10px;z-index:61;
  background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;
  box-shadow:0 12px 34px rgba(0,0,0,.45);padding:6px;display:none;min-width:212px}
.mnl.acik{display:block}
.mnl button,.mnl a{display:flex;align-items:center;gap:12px;width:100%;
  background:transparent;border:0;border-radius:10px;padding:13px 12px;
  color:var(--murekkep);font:inherit;font-size:16px;font-weight:600;text-align:left;
  text-decoration:none;cursor:pointer}
.mnl button:active,.mnl a:active{background:rgba(127,127,127,.18)}
.mnl i{font-style:normal;font-size:19px;width:24px;text-align:center}

/* --- sesle yazma --- */
.sesyaz{display:flex;justify-content:center;margin-top:6px}
.seskayan{position:fixed;right:10px;bottom:12px;z-index:40;display:flex;
  flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.seskayan.klv{position:absolute;right:10px;bottom:100%;margin-bottom:8px}
#klavye{position:relative}
.seskayan .sesbtn,.sesyaz .sesbtn{pointer-events:auto}
.sesbtn,#klavye .sesbtn{background:linear-gradient(135deg,#6c5ce7,#8e6ce8);
  color:#fff;border:0;border-radius:999px;padding:12px 17px;font:inherit;font-size:14.5px;
  font-weight:800;letter-spacing:.4px;cursor:pointer;height:auto;width:auto;flex:none;
  min-width:0;box-shadow:0 5px 16px rgba(108,92,231,.45)}
.sesbtn:active,#klavye .sesbtn:active{transform:scale(.97)}
.sesbtn.dinle,#klavye .sesbtn.dinle{background:linear-gradient(135deg,#d94a5a,#e2576a);
  color:#fff;box-shadow:0 5px 16px rgba(217,74,90,.5);animation:sesnabiz 1.1s infinite}
@keyframes sesnabiz{0%,100%{opacity:1}50%{opacity:.55}}
.sesdurum{font-size:12.5px;color:var(--soluk);text-align:right;line-height:1.35;
  max-width:230px;background:var(--kart);border-radius:10px;padding:0 8px}
.sesdurum:empty{display:none}
.sesdurum b{color:var(--altin);font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
.sesdurum s{text-decoration:none;color:var(--kirmizi)}

/* --- menu ve ses kutusu renkleri: iki temada da net --- */

.mnl button,.mnl a{color:#eef2f6}

:root[data-tema="gunduz"] .mnl{background:#ffffff;border-color:#dde2e8;
  box-shadow:0 12px 30px rgba(15,23,32,.18)}
:root[data-tema="gunduz"] .mnl button,:root[data-tema="gunduz"] .mnl a{color:#0f1720}
:root[data-tema="gunduz"] .mnl button:active,:root[data-tema="gunduz"] .mnl a:active{

<script>
/* ================= sabitler ================= */
const ETAPLAR = [
  {n:4, pk:1000, pp:2000, puz:[8,9],  cal:false, ad:"1. ETAP"},
  {n:5, pk:1500, pp:3000, puz:[9,10], cal:true,  ad:"2. ETAP"}
];
/* 3. etap: dueello, iki masa, sirayla tahmin, odul her tahminde duser */
const DUELLO = {
  odul:[2000,1600,1200,800,400], hak:5, puzOdul:4000, puz:[10,11],
  bolum:[{n:5, adet:4}, {n:6, adet:4}]
};
/* final: 200 sn, 4-5-6-7 harfli merdiven */
const FINAL = {sure:200, dizi:[4,5,6,7], carpan:{4:0.5,5:1,6:2,7:2},
               superEk:250000, satir:5};
const PRIM = 1000, SATIR = 5, SURE = 25, CALSURE = 15, PUZSURE = 60, PUZARALIK = 8, KELSAY = 3;
/* --- joker dukkani --- */
const JOKER = [
  {id:"ikinci",  em:"2️⃣", ad:"İkinci",       fiyat:1000,
   ac:"İkinci harfi yeşil olarak açar"},
  {id:"son",     em:"🔚", ad:"Son Harf",     fiyat:1000,
   ac:"Son harfi yeşil olarak açar"},
  {id:"unlu",    em:"🅰", ad:"Ünlü",          fiyat:1200,
   ac:"Kelimedeki bütün ünlü harfleri yeşil olarak açar"},
  {id:"nisanci", em:"🎯", ad:"Nişancı",       fiyat:1200,
   ac:"Dokunduğun kutudaki harfi yeşil olarak açar"},
  {id:"bomba",   em:"💣", ad:"Bomba",         fiyat:1200,
   ac:"Rastgele iki harfi yeşil olarak açar"},
  {id:"zaman",   em:"⏳", ad:"Zaman",         fiyat:500,
   ac:"O turun süresi kadar daha süre ekler"},
  {id:"perde",   em:"👀", ad:"Perde",         fiyat:500,
   ac:"Bu kelimede tahminlerin rakip ekranlarında gizlenir"},
  {id:"katla",   em:"💰", ad:"Katla",         fiyat:500,
   ac:"Bu kelimeyi bilirsen para ödülü iki katı"},
  {id:"yarisi",  em:"✂️", ad:"Yarı Yarıya",   fiyat:1500,
   ac:"Kelimede olmayan harflerin yarısı klavyede kararır"},
  {id:"telefon", em:"📞", ad:"Telefon",       fiyat:2000,
   ac:"Elenen bir yarışmacı cevaplar; bilirse doğru sayılır, hakkın yanmaz"}
];
const JOKERID = {}; JOKER.forEach(j => JOKERID[j.id] = j);
/* hangi dukkanda ne satiliyor */
const TEMEL = ["ikinci","son","unlu","nisanci","bomba","zaman","perde","katla"];
const STOK = {
  1: TEMEL, 2: TEMEL, 3: TEMEL,
  /* finalde rakip yok: perde ve katla anlamsiz, yerine yari yariya ve telefon */
  4: ["ikinci","son","unlu","nisanci","bomba","zaman","yarisi","telefon"]
};
const UNLULER = "aeıioöuü";
const JMAX = 2;             /* ayni jokerden elde en fazla */
const JZAM = 1.2;           /* her yeni alista %20 zam */
const DUKSURE = 60;         /* dukkan sayaci */
const DUKAD = ["Yola çıkmadan önce, dükkan açık",
               "1. etap bitti, dükkan yeniden açık",
               "Düello öncesi, dükkan açık",
               "Final öncesi, son dükkan"];
const ETAPAD = ["1. ETAP","2. ETAP","3. ETAP: DÜELLO","FİNAL"];
/* tek sabit oda: kod yazmaya gerek yok, herkes ayni odaya girer */
const ODA = "lingotr-ailecuk-szyr", ODAAD = "AİLECÜK";
const TRU = s => s.replace(/i/g,"İ").replace(/ı/g,"I").toUpperCase();
/* okunmasi karisan harfler adiyla soylenir */
const HARFAD = {"ğ":"yumuşak G", "ı":"noktasız I", "i":"noktalı İ"};
const harfSoyle = c => HARFAD[c] || TRU(c);
const TRL = s => s.replace(/I/g,"ı").replace(/İ/g,"i").toLowerCase();
const TL = n => n.toLocaleString("tr-TR");
const PARA = n => (n<0 ? "−₺"+TL(-n) : "₺"+TL(n));
const $ = s => document.querySelector(s);
/* ================= gece / gunduz ================= */
const TEMALAR = {gece:"#0E1520", gunduz:"#EDF1F7"};
function temaOku(){
  try{ const t=localStorage.getItem("lingo_masa_tema");
       if(t==="gece"||t==="gunduz") return t; }catch(e){}
  try{ if(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches)
         return "gunduz"; }catch(e){}
  return "gece";
}
function temaUygula(t, kaydet){
  const kok=document.documentElement;
  if(t==="gunduz") kok.setAttribute("data-tema","gunduz");
  else kok.removeAttribute("data-tema");
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", TEMALAR[t] || TEMALAR.gece);
  const b=document.getElementById("temad");
  if(b){ b.textContent = t==="gunduz" ? "☀️" : "🌙";
         b.setAttribute("aria-label", t==="gunduz" ? "Gece moduna geç" : "Gündüz moduna geç"); }
  if(kaydet){ try{ localStorage.setItem("lingo_masa_tema", t); }catch(e){} }
  return t;
}
let TEMA = "gece";
function temaCevir(){
  TEMA = temaUygula(TEMA==="gunduz" ? "gece" : "gunduz", true);
  if(typeof SON!=="undefined" && SON) ciz(SON);
}
const orta=$("#orta"), klv=$("#klavye"), skorEl=$("#skor"), etEl=$("#et"),
      agEl=$("#ag"), kodEl=$("#kod"), sureKap=$("#sure"), sureBar=sureKap.querySelector("i");
let VERI=null, GECERLI=null;

/* ================= oyun motoru (sadece kurucuda calisir) ================= */
const M = {
  S: null, GIZLI: null, PUZ: null, sayac: null, yayin: null,
  kur(adlar){
    this.S = {
      faz:"lobi",
      masalar: adlar.map(a=>({ad:a, para:0, online:false, jok:{}, alim:{}, hazir:false})),
      dukkan:null, ekHak:0, canKilit:false, jokerBu:false,
      dondu:false, kilitli:[0], katla:false, perde:null, nisan:null, elenenHarf:[],
      telefon:null, telAktif:false, finKalan:0, jokerli:JOKERLI,
      elenenler:[],
      etap:0, sira:0, ki:0, n:4, satirlar:[], aktif:0, giris:[], hak:SATIR, sn:SURE,
      dogru:0, puzzle:null, buzz:{acik:false, kim:null, kalan:[]},
      cevaplayan:0, mesaj:"", msjTip:"bek", msjDurum:false, acik:null, bitti:false,
      kalanlar: adlar.map((_,i)=>i), elenen:null, du:null, duSira:[], duTahmin:0, duOdul:0,
      fin:null, finKazanc:0, finalist:[]
    };
  },
  dur(){ if(this.sayac){ clearInterval(this.sayac); this.sayac=null; } },
  kelimeSifirla(){ const S=this.S;
    S.ekHak=0; S.canKilit=false; S.jokerBu=false;
    S.dondu=false; S.kilitli=[0]; S.katla=false; S.perde=null; S.nisan=null;
    S.elenenHarf=[]; },
  satirTaban(){ const S=this.S;
    if(S.faz==="duello") return DUELLO.hak + (S.ekHak||0);
    return (S.faz==="final" ? FINAL.satir : SATIR) + (S.ekHak||0); },
  /* --- kelime secimi --- */
  kelimeSec(n){
    n=String(n);
    const A=VERI.arsiv[n], Y=VERI.yeni[n]||[];
    for(let t=0;t<400;t++){
      let w;
      if(Math.random()<0.8||!Y.length){
        let top=0; const c=[];
        for(const [x,k] of A){ top+=k; c.push(top); }
        const r=Math.random()*top; let lo=0,hi=c.length-1;
        while(lo<hi){ const m=(lo+hi)>>1; if(c[m]<=r) lo=m+1; else hi=m; }
        w=A[lo][0];
      } else w=Y[Math.floor(Math.pow(Math.random(),1.8)*Y.length)];
      if(w && !this.kul.has(w)){ this.kul.add(w); return w; }
    }
    return A[0][0];
  },
  puzzleSec(nler){
    for(let t=0;t<300;t++){
      const n=String(nler[Math.floor(Math.random()*nler.length)]);
      const L=VERI.puzzle[n]; if(!L||!L.length) continue;
      const alt=L.filter(x=>x[2]>0), hav=(Math.random()<0.8&&alt.length)?alt:L;
      const s=hav[Math.floor(Math.random()*hav.length)];
      if(s && !this.kul.has(s[0])){ this.kul.add(s[0]); return s; }
    }
    return VERI.puzzle["9"][0];
  },
  /* --- dukkan --- */
  fiyat(i, id){
    const m=this.S.masalar[i], k=(m.alim && m.alim[id]) || 0;
    return Math.round(JOKERID[id].fiyat * Math.pow(JZAM, k) / 50) * 50;
  },
  dukkanAc(no, kimler, sonra){
    const S=this.S; this.dur();
    if(!S.jokerli) return this.dukkanSonra(sonra);
    S.faz="dukkan"; S.dukkan={no:no, kimler:kimler.slice(), sonra:sonra};
    S.cevaplayan=-1; S.acik=null; S.satirlar=[]; S.puzzle=null; S.buzz={acik:false,kim:null,kalan:[]};
    S.masalar.forEach((m,i)=>{ m.hazir = kimler.indexOf(i)<0; });
    S.mesaj=DUKAD[no-1]; S.msjTip="bek";
    this.saat(DUKSURE, ()=>this.dukkanKapat());
    this.gonder();
  },
  satinAl(i, id){
    const S=this.S;
    if(S.faz!=="dukkan" || !S.dukkan) return;
    if(S.dukkan.kimler.indexOf(i)<0) return;
    const m=S.masalar[i], j=JOKERID[id];
    if(!m || !j) return;
    if((STOK[S.dukkan.no]||TEMEL).indexOf(id) < 0) return;
    if((m.jok[id]||0) >= JMAX) return;
    const f=this.fiyat(i, id);
    m.para -= f;
    m.jok[id]=(m.jok[id]||0)+1;
    m.alim[id]=(m.alim[id]||0)+1;
    m.hazir=false;
    S.mesaj=`${m.ad} aldı: ${j.em} ${j.ad}: ₺${TL(f)}`; S.msjTip="bek";
    this.gonder();
  },
  hazir(i){
    const S=this.S;
    if(S.faz!=="dukkan" || !S.dukkan) return;
    if(S.dukkan.kimler.indexOf(i)<0) return;
    S.masalar[i].hazir=true;
    if(S.masalar.every(m=>m.hazir)) return this.dukkanKapat();
    this.gonder();
  },
  dukkanKapat(){
    const S=this.S; this.dur();
    const sonra = S.dukkan ? S.dukkan.sonra : "oyun";
    S.dukkan=null;
    this.dukkanSonra(sonra);
  },
  dukkanSonra(sonra){
    const S=this.S;
    if(sonra==="oyun"){
      S.faz="oyun"; S.etap=0; S.sira=S.kalanlar[0]; S.ki=0; S.dogru=0;
      return this.kelimeAc();
    }
    if(sonra==="etap2"){
      S.faz="etapsonu";
      S.mesaj=`${ETAPLAR[S.etap].ad} başlıyor: ${ETAPLAR[S.etap].n} harfli · her kelime ₺${TL(ETAPLAR[S.etap].pk)}`;
      S.msjTip="bek"; this.gonder();
      return setTimeout(()=>this.kelimeAc(), 2800);
    }
    if(sonra==="duello") return this.duBasla();
    if(sonra==="final"){
      const F=S.fin;
      S.faz="finalgiris"; S.cevaplayan=-1;
      S.mesaj=`Finale çıkan: ${S.masalar[F.masa].ad}: ₺${TL(F.taban)} ile`;
      S.msjTip="iyi"; return this.gonder();
    }
  },
  /* --- joker kullanimi --- */
  jokerUygun(i, id){
    const S=this.S, m=S.masalar[i];
    if(!m || !(m.jok[id]>0)) return false;
    if(S.telAktif) return false;
    if(id==="telefon")
      return S.faz==="final" && S.fin && i===S.fin.masa && !S.acik
             && (S.elenenler||[]).length>0;
    if(["kelime","calma","duello","final"].indexOf(S.faz)<0) return false;
    if(S.acik) return false;
    if(i!==S.cevaplayan) return false;
    if(id==="katla" || id==="perde") return S.faz!=="final";
    if(id==="nisanci") return S.nisan==null;
    return true;
  },
  bosKonumlar(){ const S=this.S, out=[];
    for(let k=1;k<S.n;k++) if(S.kilitli.indexOf(k)<0) out.push(k);
    return out; },
  joker(i, id){
    const S=this.S;
    if(!this.jokerUygun(i, id)) return;
    S.msjDurum=false;
    const m=S.masalar[i], j=JOKERID[id];
    m.jok[id]--; if(!m.jok[id]) delete m.jok[id];
    S.jokerBu=true;
    if(id==="ikinci"){
      this.harfAc(1);
    } else if(id==="son"){
      this.harfAc(S.n-1);
    } else if(id==="unlu"){
      for(let k=1;k<S.n;k++) if(UNLULER.indexOf(this.GIZLI[k])>=0) this.harfAc(k);
    } else if(id==="bomba"){
      const bos=this.bosKonumlar();
      for(let t=0;t<2 && bos.length;t++)
        this.harfAc(bos.splice(Math.floor(Math.random()*bos.length),1)[0]);
    } else if(id==="nisanci"){
      S.nisan=i;
      S.mesaj="🎯 Nişancı, açmak istediğin kutuya dokun"; S.msjTip="bek";
      return this.gonder();
    } else if(id==="zaman"){
      const ek=S.top||SURE, kalan=Math.max(1,S.sn||1);
      S.mesaj=`${m.ad}: ${j.em} ${j.ad}`; S.msjTip="iyi";
      if(S.faz==="final") this.finSaat(kalan+ek);
      else this.saat(kalan+ek, this.bitinceSon);
      return this.gonder();
    } else if(id==="perde"){
      S.perde=i;
    } else if(id==="katla"){
      S.katla=true;
    } else if(id==="yarisi"){
      const icinde=new Set(this.GIZLI.split(""));
      const el=new Set(S.elenenHarf||[]);
      const aday="abcçdefgğhıijklmnoöprsştuüvyz".split("")
        .filter(c=>!icinde.has(c) && !el.has(c));
      const kac=Math.ceil(aday.length/2), sec=[];
      for(let t=0;t<kac && aday.length;t++)
        sec.push(aday.splice(Math.floor(Math.random()*aday.length),1)[0]);
      S.elenenHarf=(S.elenenHarf||[]).concat(sec);
    } else if(id==="telefon"){
      S.mesaj=`${m.ad}: ${j.em} ${j.ad}`; S.msjTip="iyi";
      if(this.telefonAc()) return;
    }
    S.mesaj=`${m.ad}: ${j.em} ${j.ad}`; S.msjTip="iyi";
    this.gonder();
  },
  nisanAt(i, konum){
    const S=this.S;
    if(S.nisan!==i) return;
    S.nisan=null; this.harfAc(konum);
    S.mesaj=`${S.masalar[i].ad}: 🎯 Nişancı`; S.msjTip="iyi";
    this.gonder();
  },
  /* ---- telefon jokeri: elenen yarismacilar cevaplar ---- */
  telefonAc(){
    const S=this.S, el=(S.elenenler||[]).slice();
    if(!el.length) return false;
    S.finKalan=Math.max(1, S.sn||1);
    this.dur();
    S.telAktif=true; S.telefon={kalan:el};
    S.cevaplayan=el[0]; this.girisKur();
    S.mesaj=`📞 Telefon: ${S.masalar[el[0]].ad} cevaplıyor: ${CALSURE} saniye`;
    S.msjTip="bek";
    this.saat(CALSURE, ()=>this.telDene(true));
    this.gonder();
    return true;
  },
  telDene(zamanBitti){
    const S=this.S;
    S.msjDurum=false;
    if(!S.telAktif) return;
    if(!zamanBitti){
      if(!this.girisTam()) return;
      const t=this.girisMetin();
      if(!GECERLI[S.n].has(t)){ S.mesaj="Sözlükte yok"; S.msjTip="kotu"; return this.gonder(); }
      if(t===this.GIZLI) return this.telefonBitir(true);
      /* yanlis cevap tahtaya yazilmaz: finalistin hakki yanmadigi gibi satiri da yanmaz */
    }
    this.dur();
    S.telefon.kalan.shift();
    if(S.telefon.kalan.length){
      S.cevaplayan=S.telefon.kalan[0]; this.girisKur();
      S.mesaj=`Olmadı, sıra ${S.masalar[S.cevaplayan].ad} masasında`; S.msjTip="kotu";
      this.saat(CALSURE, ()=>this.telDene(true));
      return this.gonder();
    }
    return this.telefonBitir(false);
  },
  telefonBitir(dogru){
    const S=this.S, F=S.fin;
    this.dur(); S.telAktif=false; S.telefon=null;
    S.cevaplayan=F.masa; this.girisKur();
    if(dogru){
      F.enIyi=S.n; S.finKazanc=this.fKazanc(S.n); S.acik=this.GIZLI;
      S.mesaj=`📞 Telefon tuttu! Garantilenen: ₺${TL(S.finKazanc)}`; S.msjTip="iyi";
      this.gonder();
      if(S.n===6) return setTimeout(()=>this.finKarar(), 1600);
      F.idx++;
      return setTimeout(()=>this.finKelime(), 1600);
    }
    S.mesaj="📞 Telefondan cevap gelmedi, tahmin hakkın duruyor"; S.msjTip="kotu";
    this.finSaat(S.finKalan||1);
    this.gonder();
  },
  /* --- akis --- */
  basla(){ this.kul=new Set();
           this.S.kalanlar=this.S.masalar.map((_,i)=>i);
           this.S.elenenler=[]; this.S.elenen=null;
           this.dukkanAc(1, this.S.kalanlar, "oyun"); },
  kelimeAc(){
    const E=ETAPLAR[this.S.etap], S=this.S;
    S.faz="kelime"; S.n=E.n; S.cevaplayan=S.sira;
    S.buzz={acik:false, kim:null, kalan:[]};
    this.GIZLI=this.kelimeSec(E.n);
    this.kelimeSifirla();
    S.satirlar=[]; S.aktif=0; S.hak=SATIR; S.acik=null; this.girisKur();
    S.mesaj=`${S.masalar[S.sira].ad}: ${S.ki+1}. kelime · ₺${TL(E.pk)}`;
    S.msjTip="bek"; S.msjDurum=true;
    this.saat(SURE, ()=>this.satirBitir(null));
    this.gonder();
  },
  saat(sn, bitince){
    this.dur(); this.bitinceSon=bitince; const b=Date.now(), top=sn*1000;
    this.S.sn=sn; this.S.top=sn;
    this.sayac=setInterval(()=>{
      const kalan=Math.max(0, top-(Date.now()-b));
      const s2=Math.ceil(kalan/1000);
      if(s2!==this.S.sn){ this.S.sn=s2; this.gonder(); }
      if(kalan<=0){ this.dur(); bitince(); }
    },120);
  },
  harf(c){ const S=this.S;
    if(S.acik) return;
    if(!["kelime","calma","puzzle","duello","dupuzzle","final"].includes(S.faz)) return;
    if(S.faz==="puzzle"||S.faz==="dupuzzle"){
      const P=S.puzzle;
      for(let i=0;i<P.n;i++){
        if(P.acik.includes(i)) continue;          // acilmis harf zaten yerinde
        if(!S.pgir[i]){ S.pgir[i]=c; return this.gonder(); }
      }
      return;
    }
    for(let i=0;i<S.n;i++){
      if(S.kilitli.indexOf(i)>=0) continue;
      if(!S.giris[i]){ S.giris[i]=c; return this.gonder(); }
    }
  },
  sil(){ const S=this.S;
    if(S.faz==="puzzle"||S.faz==="dupuzzle"){
      const P=S.puzzle;
      for(let i=P.n-1;i>=0;i--){
        if(P.acik.includes(i)) continue;
        if(S.pgir[i]){ S.pgir[i]=null; return this.gonder(); }
      }
      return;
    }
    for(let i=S.n-1;i>=0;i--){
      if(S.kilitli.indexOf(i)>=0) continue;
      if(S.giris[i]){ S.giris[i]=null; return this.gonder(); }
    }
  },
  /* bos kutu birakmadan yazildi mi */
  girisTam(){ const S=this.S;
    for(let i=0;i<S.n;i++) if(!S.giris[i]) return false;
    return true; },
  girisMetin(){ return this.S.giris.map(c=>c||"").join(""); },
  /* yeni kelime / yeni satir icin giris kutularini kur */
  girisKur(){ const S=this.S;
    S.giris=new Array(S.n).fill(null);
    for(const i of S.kilitli) S.giris[i]=this.GIZLI[i];
  },
  /* bir konumu yesil olarak ac */
  harfAc(i){ const S=this.S;
    if(i<0||i>=S.n||S.kilitli.indexOf(i)>=0) return false;
    S.kilitli.push(i); S.giris[i]=this.GIZLI[i];
    return true; },
  gonderTahmin(){
    const S=this.S;
    S.msjDurum=false;
    if(S.telAktif) return this.telDene(false);
    if(S.acik) return;                          /* kelime bitti, tahmin alinmaz */
    if(S.faz==="puzzle"||S.faz==="dupuzzle") return this.puzDene();
    const n=S.n;
    if(!this.girisTam()) return;
    const t=this.girisMetin();
    if(!GECERLI[n].has(t)){ S.mesaj="Sözlükte yok"; S.msjTip="kotu"; this.gonder(); return; }
    this.satirBitir(t);
  },
  renk(g,t){
    const n=g.length, r=new Array(n).fill("yok"), kal={};
    for(let i=0;i<n;i++) if(t[i]===g[i]) r[i]="tam"; else kal[g[i]]=(kal[g[i]]||0)+1;
    for(let i=0;i<n;i++) if(r[i]!=="tam"&&kal[t[i]]>0){ r[i]="var"; kal[t[i]]--; }
    return r;
  },
  satirBitir(tah){
    const S=this.S, E=ETAPLAR[Math.min(S.etap,1)];
    if(S.acik) return;                          /* kelime coktan kapandi */
    S.msjDurum=false;
    if(S.faz!=="final") this.dur();
    if(tah===null){ S.satirlar.push({h:S.giris.map(c=>c||"·"), r:new Array(S.n).fill("yok")}); }
    else{
      const r=this.renk(this.GIZLI,tah);
      S.satirlar.push({h:[...tah], r});
      if(tah===this.GIZLI && S.faz==="final"){
        const F=S.fin; F.enIyi=S.n; S.finKazanc=this.fKazanc(S.n);
        S.acik=this.GIZLI;
        S.mesaj=`Doğru! Garantilenen: ₺${TL(S.finKazanc)}`; S.msjTip="iyi";
        this.gonder();
        if(S.n===6) return setTimeout(()=>this.finKarar(), 1500);
        F.idx++;
        return setTimeout(()=>this.finKelime(), 1500);
      }
      if(tah===this.GIZLI){
        const kim=S.cevaplayan;
        let odul = S.faz==="duello" ? DUELLO.odul[Math.min(S.duTahmin, 4)] : E.pk;
        if(S.katla) odul *= 2;
        S.masalar[kim].para += odul;
        S.acik=this.GIZLI;
        S.mesaj=`${S.masalar[kim].ad} bildi! +₺${TL(odul)}`; S.msjTip="iyi";
        if(S.faz!=="duello" && kim===S.sira) S.dogru++;
        this.gonder();
        return setTimeout(()=> S.faz==="duello" ? this.duSonraki() : this.sonrakiKelime(), 1800);
      }
    }
    S.aktif++; S.hak=this.satirTaban()-S.aktif; this.girisKur();
    if(S.faz==="final"){
      if(S.aktif>=this.satirTaban()){
        S.acik=this.GIZLI;
        S.mesaj=`Bilinemedi, doğru cevap: ${TRU(this.GIZLI)}`; S.msjTip="kotu";
        this.gonder(); return setTimeout(()=>this.finBitir(), 2600);
      }
      S.mesaj=`${S.hak} hak kaldı`; S.msjTip="bek"; S.msjDurum=true;
      return this.gonder();
    }
    if(S.faz==="duello"){
      S.duTahmin++;
      if(S.duTahmin>=this.satirTaban()){
        S.acik=this.GIZLI; S.mesaj=`Kimse bilemedi: ${TRU(this.GIZLI)}`; S.msjTip="kotu";
        this.gonder(); return setTimeout(()=>this.duSonraki(), 2000);
      }
      S.cevaplayan = S.duSira[S.duTahmin % 2];
      S.duOdul = DUELLO.odul[S.duTahmin];
      S.mesaj = `Sıra ${S.masalar[S.cevaplayan].ad}: ${S.duTahmin+1}. tahmin · ₺${TL(S.duOdul)}`;
      S.msjTip="bek"; S.msjDurum=true;
      this.saat(SURE, ()=>this.satirBitir(null));
      return this.gonder();
    }
    if(S.faz==="calma"){ return this.calmaBitti(); }
    if(S.aktif>=this.satirTaban()){
      if(E.cal && !S.canKilit) return this.calmaAc();
      S.acik=this.GIZLI; S.mesaj=`Bilinemedi: ${TRU(this.GIZLI)}`; S.msjTip="kotu";
      this.gonder();
      return setTimeout(()=>this.sonrakiKelime(), 2000);
    }
    this.saat(SURE, ()=>this.satirBitir(null));
    this.gonder();
  },
  /* --- calma (buzzer) --- */
  calmaAc(){
    const S=this.S;
    if(S.canKilit){
      S.acik=this.GIZLI; S.mesaj=`🔒 Çan kilitliydi: ${TRU(this.GIZLI)}`; S.msjTip="kotu";
      this.gonder(); return setTimeout(()=>this.sonrakiKelime(), 2000);
    }
    S.faz="buzz";
    S.buzz={acik:true, kim:null, kalan:S.masalar.map((_,i)=>i).filter(i=>i!==S.sira)};
    S.mesaj="Masaya geçmedi: BASAN cevaplar!"; S.msjTip="bek";
    this.saat(10, ()=>{
      if(!S.buzz.kim){ S.acik=this.GIZLI; S.mesaj=`Kimse basmadı: ${TRU(this.GIZLI)}`;
        S.msjTip="kotu"; this.gonder(); setTimeout(()=>this.sonrakiKelime(),2000); }
    });
    this.gonder();
  },
  buz(i){
    const S=this.S;
    S.msjDurum=false;
    if(S.faz==="dupuzzle"){
      if(!S.buzz.acik||!S.buzz.kalan.includes(i)) return;
      S.buzz.acik=false; S.buzz.kim=i; S.cevaplayan=i;
      S.buzz.kalan=S.buzz.kalan.filter(x=>x!==i);
      S.giris=[this.GIZLI[0]];
      S.mesaj=`${S.masalar[i].ad} bastı, tek tahmin, ${CALSURE} sn · ₺${TL(S.puzzle.odul)}`;
      S.msjTip="bek";
      S.puzSaat=setTimeout(()=>this.duPuzYanlis(), CALSURE*1000);
      return this.gonder();
    }
    if(S.faz!=="buzz"||!S.buzz.acik) return;
    if(!S.buzz.kalan.includes(i)) return;
    S.buzz.acik=false; S.buzz.kim=i;
    S.buzz.kalan=S.buzz.kalan.filter(x=>x!==i);
    S.faz="calma"; S.cevaplayan=i; this.girisKur();
    S.mesaj=`${S.masalar[i].ad} bastı, tek tahmin, ${CALSURE} saniye`; S.msjTip="bek";
    this.saat(CALSURE, ()=>this.satirBitir(null));
    this.gonder();
  },
  calmaBitti(){
    const S=this.S;
    if(S.buzz.kalan.length){
      const i=S.buzz.kalan.shift();
      S.faz="calma"; S.cevaplayan=i; this.girisKur();
      S.mesaj=`Sıra ${S.masalar[i].ad} masasında, tek tahmin`; S.msjTip="bek";
      this.saat(CALSURE, ()=>this.satirBitir(null));
      return this.gonder();
    }
    S.acik=this.GIZLI; S.mesaj=`Kimse bilemedi: ${TRU(this.GIZLI)}`; S.msjTip="kotu";
    this.gonder(); setTimeout(()=>this.sonrakiKelime(), 2000);
  },
  /* --- sonraki --- */
  sonrakiKelime(){
    const S=this.S, E=ETAPLAR[S.etap];
    S.ki++;
    if(S.ki<KELSAY) return this.kelimeAc();
    if(S.dogru===KELSAY){
      S.masalar[S.sira].para += PRIM;
      S.mesaj=`${S.masalar[S.sira].ad}: 3'te 3! +₺${TL(PRIM)}`; S.msjTip="iyi";
      this.gonder();
      return setTimeout(()=>this.puzzleAc(), 2000);
    }
    this.puzzleAc();
  },
  puzzleAc(){
    const S=this.S, E=ETAPLAR[S.etap];
    const [w,t]=this.puzzleSec(E.puz);
    this.GIZLI=w; this.PUZ={odul:E.pp, tam:E.pp};
    S.faz="puzzle"; S.cevaplayan=S.sira;
    S.puzzle={n:w.length, tanim:t, acik:[0], odul:E.pp};
    S.pgir=new Array(w.length).fill(null);
    S.giris=[w[0]]; S.kilitli=[0]; S.satirlar=[]; S.acik=null;
    S.mesaj=`${S.masalar[S.sira].ad}, puzzle · ₺${TL(E.pp)}`;
    S.msjTip="bek"; S.msjDurum=true;
    let ac=0;
    this.dur();
    const b=Date.now(), top=PUZSURE*1000; S.sn=PUZSURE; S.top=PUZSURE;
    this.sayac=setInterval(()=>{
      const gec=Date.now()-b, kalan=Math.max(0,top-gec);
      const s2=Math.ceil(kalan/1000);
      let dg=false;
      if(s2!==S.sn){ S.sn=s2; dg=true; }
      if(gec-ac>=PUZARALIK*1000){ ac=gec; if(this.puzHarfAc()) dg=true; }
      if(dg) this.gonder();
      if(kalan<=0){ this.dur(); this.puzBitir(false); }
    },150);
    this.gonder();
  },
  puzHarfAc(){
    const S=this.S, w=this.GIZLI, kapali=[];
    for(let i=1;i<w.length;i++) if(!S.puzzle.acik.includes(i)) kapali.push(i);
    if(!kapali.length) return false;
    const yeni=kapali[Math.floor(Math.random()*kapali.length)];
    S.puzzle.acik.push(yeni);
    if(S.pgir) S.pgir[yeni]=null;
    const ek=S.puzzle.acik.length-1;
    S.puzzle.odul=Math.round(Math.max(this.PUZ.tam*0.2, this.PUZ.tam*(1-0.2*ek))/100)*100;
    S.giris=[w[0]];
    return true;
  },
  duPuzYanlis(){
    const S=this.S;
    if(S.puzSaat){ clearTimeout(S.puzSaat); S.puzSaat=null; }
    S.mesaj=`${S.masalar[S.cevaplayan].ad} bilemedi`; S.msjTip="kotu";
    S.cevaplayan=-1;
    if(S.buzz.kalan.length){ S.buzz.acik=true; this.gonder(); }
    else this.duPuzBitir(false);
  },
  puzTahmin(){
    const S=this.S, P=S.puzzle;
    let t="";
    for(let i=0;i<P.n;i++){
      if(P.acik.includes(i)) t+=this.GIZLI[i];
      else if(S.pgir[i]) t+=S.pgir[i];
      else return null;                      // bosluk var
    }
    return t;
  },
  puzDene(){
    const S=this.S;
    if(S.acik) return;                          /* puzzle bitti */
    S.msjDurum=false;
    const t=this.puzTahmin();
    if(t===null){ S.mesaj="Boş kutular var"; S.msjTip="kotu"; return this.gonder(); }
    if(S.faz==="dupuzzle"){
      if(t===this.GIZLI){
        if(S.puzSaat){ clearTimeout(S.puzSaat); S.puzSaat=null; }
        return this.duPuzBitir(true);
      }
      return this.duPuzYanlis();
    }
    if(t===this.GIZLI) return this.puzBitir(true);
    S.mesaj="Olmadı, bir harf açılıyor"; S.msjTip="kotu";
    this.puzHarfAc(); this.gonder();
  },
  puzBitir(ok){
    const S=this.S;
    this.dur();
    S.acik=this.GIZLI;
    if(ok){ S.masalar[S.sira].para += S.puzzle.odul;
      S.mesaj=`Puzzle çözüldü! +₺${TL(S.puzzle.odul)}`; S.msjTip="iyi"; }
    else { S.mesaj=`Puzzle bilinemedi: ${TRU(this.GIZLI)}`; S.msjTip="kotu"; }
    this.gonder();
    setTimeout(()=>this.sonrakiMasa(), 2200);
  },
  sonrakiMasa(){
    const S=this.S;
    let i=S.kalanlar.indexOf(S.sira)+1;
    S.ki=0; S.dogru=0;
    if(i<S.kalanlar.length){ S.sira=S.kalanlar[i]; return this.kelimeAc(); }
    S.etap++;
    if(S.etap>=ETAPLAR.length) return this.eleme();
    S.sira=S.kalanlar[0];
    return this.dukkanAc(2, S.kalanlar, "etap2");
  },
  /* ---------- eleme: 4 masada iki, 3 masada bir, 2 masada eleme yok ---------- */
  eleme(){
    const S=this.S; this.dur();
    const cikar = S.kalanlar.length>=4 ? 2 : (S.kalanlar.length===3 ? 1 : 0);
    if(!cikar){
      S.elenenler=[]; S.elenen=null;
      return this.dukkanAc(3, S.kalanlar, "duello");
    }
    const sirali=S.kalanlar.slice().sort((a,b)=>S.masalar[a].para-S.masalar[b].para);
    const el=sirali.slice(0, cikar);
    S.elenenler=el; S.elenen=el[0];
    S.kalanlar=S.kalanlar.filter(i=>el.indexOf(i)<0);
    el.forEach(i=>{ S.masalar[i].jok={}; });          /* elenen masanin jokerleri yanar */
    S.faz="eleme";
    S.mesaj = el.map(i=>`${S.masalar[i].ad} (₺${TL(S.masalar[i].para)})`).join(" ve ")
      + (el.length>1 ? " elendi" : " elendi");
    S.msjTip="kotu"; this.gonder();
    setTimeout(()=>this.dukkanAc(3, S.kalanlar, "duello"), 3500);
  },
  /* ---------- 3. etap: duello ---------- */
  duBasla(){
    const S=this.S;
    S.etap=2; S.du={bol:0, ki:0};
    S.faz="etapsonu";
    S.mesaj=`3. ETAP: DÜELLO · ${S.kalanlar.map(i=>S.masalar[i].ad).join(" ⚔ ")}`;
    S.msjTip="bek"; this.gonder();
    setTimeout(()=>this.duKelime(), 3000);
  },
  duKelime(){
    const S=this.S, B=DUELLO.bolum[S.du.bol];
    S.faz="duello"; S.n=B.n;
    /* puani dusuk olan once cevaplar */
    S.duSira=[...S.kalanlar].sort((a,b)=>S.masalar[a].para-S.masalar[b].para);
    S.duTahmin=0; S.duOdul=DUELLO.odul[0]; S.cevaplayan=S.duSira[0];
    this.GIZLI=this.kelimeSec(B.n);
    this.kelimeSifirla();
    S.satirlar=[]; S.aktif=0; S.hak=DUELLO.hak; S.acik=null; this.girisKur();
    S.buzz={acik:false, kim:null, kalan:[]};
    S.mesaj=`${S.masalar[S.cevaplayan].ad} başlıyor: ${S.du.ki+1}/${B.adet} · ₺${TL(S.duOdul)}`;
    S.msjTip="bek"; S.msjDurum=true;
    this.saat(SURE, ()=>this.satirBitir(null));
    this.gonder();
  },
  duSonraki(){
    const S=this.S, B=DUELLO.bolum[S.du.bol];
    S.du.ki++;
    if(S.du.ki<B.adet) return this.duKelime();
    return this.duPuzzle();
  },
  duPuzzle(){
    const S=this.S;
    const [w,t]=this.puzzleSec(DUELLO.puz);
    this.GIZLI=w; this.PUZ={odul:DUELLO.puzOdul, tam:DUELLO.puzOdul};
    S.faz="dupuzzle";
    S.puzzle={n:w.length, tanim:t, acik:[0], odul:DUELLO.puzOdul};
    S.pgir=new Array(w.length).fill(null);
    S.giris=[w[0]]; S.kilitli=[0]; S.satirlar=[]; S.acik=null;
    S.buzz={acik:true, kim:null, kalan:[...S.kalanlar]};
    S.cevaplayan=-1;
    S.mesaj="PUZZLE, ilk basan cevaplar"; S.msjTip="bek";
    let ac=0; this.dur();
    const b0=Date.now(), top=PUZSURE*1000; S.sn=PUZSURE; S.top=PUZSURE;
    this.sayac=setInterval(()=>{
      const gec=Date.now()-b0, kalan=Math.max(0,top-gec), s2=Math.ceil(kalan/1000);
      let dg=false;
      if(s2!==S.sn){ S.sn=s2; dg=true; }
      if(S.buzz.acik && gec-ac>=PUZARALIK*1000){ ac=gec; if(this.puzHarfAc()) dg=true; }
      if(dg) this.gonder();
      if(kalan<=0){ this.dur(); this.duPuzBitir(false); }
    },150);
    this.gonder();
  },
  duPuzBitir(ok){
    const S=this.S; this.dur(); S.acik=this.GIZLI;
    if(ok){ S.masalar[S.cevaplayan].para += S.puzzle.odul;
      S.mesaj=`${S.masalar[S.cevaplayan].ad}, puzzle! +₺${TL(S.puzzle.odul)}`; S.msjTip="iyi"; }
    else { S.mesaj=`Puzzle bilinemedi: ${TRU(this.GIZLI)}`; S.msjTip="kotu"; }
    this.gonder();
    setTimeout(()=>{
      S.du.bol++; S.du.ki=0;
      if(S.du.bol<DUELLO.bolum.length){
        S.faz="etapsonu";
        S.mesaj=`${DUELLO.bolum[S.du.bol].n} harfli bölüm başlıyor`;
        S.msjTip="bek"; this.gonder();
        setTimeout(()=>this.duKelime(), 2500);
      } else this.bitir();
    }, 2400);
  },
  bitir(){
    const S=this.S; this.dur();
    const hav=S.kalanlar.length?S.kalanlar:S.masalar.map((_,i)=>i);
    const en=Math.max(...hav.map(i=>S.masalar[i].para));
    S.finalist=hav.filter(i=>S.masalar[i].para===en);
    const m=S.finalist[0];
    S.etap=3; S.cevaplayan=-1;
    S.fin={masa:m, taban:S.masalar[m].para, idx:0, enIyi:0, suan:0};
    S.finKazanc=0;
    return this.dukkanAc(4, [m], "final");
  },
  /* ---------- FİNAL ---------- */
  fKazanc(n){
    const t=this.S.fin.taban;
    return n===7 ? t*2 + FINAL.superEk : Math.round(t*FINAL.carpan[n]/100)*100;
  },
  finSaat(sn){
    const S=this.S; this.dur(); this.bitinceSon=()=>this.finBitir();
    const b0=Date.now(), top=sn*1000; S.sn=sn; S.top=FINAL.sure;
    this.sayac=setInterval(()=>{
      const kalan=Math.max(0, top-(Date.now()-b0)), s2=Math.ceil(kalan/1000);
      if(s2!==S.sn){ S.sn=s2; this.gonder(); }
      if(kalan<=0){ this.dur(); this.finBitir(); }
    },150);
  },
  finBasla(){
    const S=this.S; S.faz="final"; S.fin.idx=0; S.fin.enIyi=0; S.finKazanc=0;
    this.finSaat(FINAL.sure);
    this.finKelime();
  },
  /* 6 harfliden sonra: tamam mi devam mi */
  finKarar(){
    const S=this.S; this.dur();
    S.faz="finalkarar";
    S.mesaj=`6 harfliyi bildi, garanti ₺${TL(S.finKazanc)}`; S.msjTip="iyi";
    this.gonder();
  },
  karar(devam){
    const S=this.S;
    if(S.faz!=="finalkarar") return;
    if(!devam){ S.fin.suan=6; return this.finBitir(); }
    S.fin.idx++; S.faz="final";
    this.finSaat(Math.max(5, S.sn));
    this.finKelime();
  },
  finKelime(){
    const S=this.S, F=S.fin;
    if(F.idx>=FINAL.dizi.length) return this.finBitir();
    const n=FINAL.dizi[F.idx]; F.suan=n;
    S.faz="final"; S.n=n; S.cevaplayan=F.masa;
    this.GIZLI=this.kelimeSec(n);
    this.kelimeSifirla();
    S.satirlar=[]; S.aktif=0; S.hak=FINAL.satir; S.acik=null; this.girisKur();
    S.mesaj=`${n} harfli, bilirse ₺${TL(this.fKazanc(n))}` +
      (n===7?" (SÜPER LİNGO)":"");
    S.msjTip="bek"; S.msjDurum=true;
    this.gonder();
  },
  pas(){
    const S=this.S;
    if(S.faz!=="final" || S.aktif<1) return;      // once en az bir tahmin
    S.acik=this.GIZLI;
    S.mesaj=`Pas, cevap: ${TRU(this.GIZLI)}`; S.msjTip="kotu";
    this.gonder();
    setTimeout(()=>{ if(S.faz==="final") this.finKelime(); }, 2200);
  },
  finBitir(){
    const S=this.S, F=S.fin; this.dur();
    const sifir = (F.suan===7 && F.enIyi!==7);
    const kaz = sifir ? 0 : (F.enIyi ? this.fKazanc(F.enIyi) : 0);
    S.finKazanc=kaz; S.masalar[F.masa].para=kaz;
    S.faz="bitti"; S.bitti=true; S.cevaplayan=-1;
    S.mesaj = sifir
      ? `7 harfliye kadar geldi ama bilemedi, kazanç sıfır`
      : (F.enIyi ? `${F.enIyi} harfliye kadar çıktı` : `Finalde ilk kelimeyi geçemedi`);
    S.msjTip = kaz ? "iyi" : "kotu";
    this.gonder();
  },
  /* --- yayin --- */
  temiz(){
    const S=JSON.parse(JSON.stringify(this.S));
    return S;
  },
  gonder(){
    const d=this.temiz();
    ciz(d.perde!=null && d.perde!==NET.benim ? perdele(d) : d);
    NET.yayinlaDurum(d);
  },
};

/* ================= ag katmani ================= */
const NET = {
  peer:null, host:false, baglar:[], baglanti:null, kod:null, benim:-1,
  kurucuBasla(kod, tamam){
    this.host=true; this.kod=ODAAD;
    this.peer=new Peer(ODA, {debug:0});
    this.peer.on("open", ()=>tamam(null));
    this.peer.on("error", e=>tamam(e.type||"hata"));
    this.peer.on("connection", c=>{
      this.baglar.push(c);
      c.on("data", m=>this.hostMesaj(c, m));
      c.on("open", ()=>{ if(M.S) c.send({t:"durum", d:M.temiz()}); agYaz(); });
      c.on("close", ()=>{ this.baglar=this.baglar.filter(x=>x!==c); agYaz(); });
    });
  },
  hostMesaj(c, m){
    if(m.t==="katil"){
      c.masa=(typeof m.masa==="number")?m.masa:-1; c.ad=m.ad;
      if(M.S && M.S.masalar[c.masa]) M.S.masalar[c.masa].online=true;
      c.send({t:"sen", masa:m.masa});
      agYaz(); if(M.S) M.gonder();
      return;
    }
    if(!M.S) return;
    const S=M.S;
    if(m.t==="al"){ if(c.masa>=0) M.satinAl(c.masa, m.id); return; }
    if(m.t==="hazir"){ if(c.masa>=0) M.hazir(c.masa); return; }
    if(m.t==="joker"){ if(c.masa>=0) M.joker(c.masa, m.id); return; }
    if(m.t==="nisan"){ if(c.masa>=0) M.nisanAt(c.masa, m.i); return; }
    if(m.t==="buzz") return M.buz(c.masa);
    if(m.t==="pas"){ if(c.masa===S.cevaplayan) M.pas(); return; }
    if(m.t==="karar"){ if(S.fin && c.masa===S.fin.masa) M.karar(!!m.devam); return; }
    if(m.t==="masa"){
      c.masa=m.i;
      if(M.S && M.S.masalar[m.i]) M.S.masalar[m.i].online=true;
      agYaz(); M.gonder(); return;
    }
    if(c.masa!==S.cevaplayan) return;
    if(m.t==="harf") M.harf(m.c);
    else if(m.t==="sil") M.sil();
    else if(m.t==="gonder") M.gonderTahmin();
  },
  yayinla(m){ for(const c of this.baglar) if(c.open) c.send(m); },
  yayinlaDurum(d){
    const gizli = d.perde!=null ? perdele(d) : null;
    for(const c of this.baglar) if(c.open)
      c.send({t:"durum", d:(gizli && c.masa!==d.perde) ? gizli : d});
  },
  tazele(){                                   // 2 sn'de bir tam durum: kacan paket onarilir
    if(this._t) return;
    this._t=setInterval(()=>{
      if(this.host && M.S && this.baglar.length) this.yayinlaDurum(M.temiz());
    }, 2000);
  },
  sonVeri:0, denemeSay:0,
  veri(m){
    this.sonVeri=Date.now(); this.denemeSay=0;
    if(m.t==="durum") ciz(m.d);
    if(m.t==="sen") this.benim=m.masa;
    agYaz();
  },
  katilBasla(kod, ad, masa, tamam){
    this.host=false; this.kod=ODAAD; this.benim=masa;
    this.peer=new Peer({debug:0});
    this.peer.on("open", ()=>{
      const c=this.peer.connect(ODA, {reliable:true});
      this.baglanti=c;
      c.on("open", ()=>{ this.sonVeri=Date.now(); c.send({t:"katil", masa, ad});
        tamam(null); agYaz(); });
      c.on("data", m=>this.veri(m));
      c.on("close", ()=>{ agYaz(); this.tekrarBagla(); });
      c.on("error", ()=>{ agYaz(); this.tekrarBagla(); });
      setTimeout(()=>{ if(!c.open) tamam("baglanamadi"); }, 12000);
    });
    this.peer.on("disconnected", ()=>{ try{ this.peer.reconnect(); }catch(e){} agYaz(); });
    this.peer.on("error", e=>{
      const t=(e && e.type) || "hata";
      if(this.baglanti && this.baglanti.open) return;      /* gecici hata */
      tamam(t);
    });
    this.izle();
  },
  bagliMi(){
    if(this.host) return true;
    return !!(this.baglanti && this.baglanti.open) &&
           (Date.now()-this.sonVeri < 9000 || !this.sonVeri);
  },
  /* uygulamadan cikip donunce ya da ag dusunce kendi kendine toparlanir */
  izle(){
    if(this._izle) return;
    this._izle=setInterval(()=>{
      if(this.host) return;
      const acik=!!(this.baglanti && this.baglanti.open);
      if(!acik || (this.sonVeri && Date.now()-this.sonVeri>9000)) this.tekrarBagla();
      else agYaz();
    }, 3000);
    document.addEventListener("visibilitychange", ()=>{
      if(document.hidden || this.host) return;
      const acik=!!(this.baglanti && this.baglanti.open);
      if(!acik || (this.sonVeri && Date.now()-this.sonVeri>4000)) this.tekrarBagla();
    });
    window.addEventListener("online", ()=>{ if(!this.host) this.tekrarBagla(); });
  },
  tekrarBagla(){
    if(this.host) return;
    if(this._deniyor && Date.now()-this._deniyor<5000) return;
    this._deniyor=Date.now(); this.denemeSay=(this.denemeSay||0)+1;
    agYaz();
    if(this.denemeSay>4){                          /* son care: sayfayi tazele */
      try{ sessionStorage.setItem("lingo_masa_oto","1"); }catch(e){}
      return location.reload();
    }
    try{
      if(!this.peer || this.peer.destroyed){
        try{ sessionStorage.setItem("lingo_masa_oto","1"); }catch(e){}
        return location.reload();
      }
      if(this.peer.disconnected){ try{ this.peer.reconnect(); }catch(e){} }
      try{ if(this.baglanti) this.baglanti.close(); }catch(e){}
      const c=this.peer.connect(ODA, {reliable:true});
      this.baglanti=c;
      c.on("open", ()=>{ this.sonVeri=Date.now(); this.denemeSay=0;
        c.send({t:"katil", masa:this.benim, ad:""}); agYaz(); });
      c.on("data", m=>this.veri(m));
      c.on("close", ()=>agYaz());
      c.on("error", ()=>agYaz());
    }catch(e){ agYaz(); }
  },
  yolla(m){ if(this.host) this.hostMesaj({masa:this.benim}, m);
            else if(this.baglanti && this.baglanti.open) this.baglanti.send(m); }
};
/* perde jokeri: tahminler rakip ekranlarinda gizlenir */
function perdele(d){

  k.satirlar=(k.satirlar||[]).map(s=>({h:s.h.map(()=>"?"), r:s.r.map(()=>"yok")}));
  k.giris=(k.giris||[]).map((c,i)=>(i===0||(k.kilitli||[]).indexOf(i)>=0)?c:(c?"?":null));
  return k;
}
function agYaz(){

/* sesle yazma: sira sendeyken mikrofon tusu cikar */
function sesyazKur(kilit){
  if(!window.LG_Ses || !LG_Ses.destek()) return;
  if(kilit || !GECERLI) return LG_Ses.kapat();
  const S = SON;
  if(!S || NET.benim !== S.cevaplayan) return LG_Ses.kapat();
  if(S.faz === "puzzle" || S.faz === "dupuzzle") return LG_Ses.kapat();
  const sat = document.querySelector("#tahta .satir");
  const ilkH = sat && sat.querySelector(".hucre.ilk");
  if(!sat || !ilkH) return LG_Ses.kapat();
  const n = sat.children.length;
  const ilk = (ilkH.textContent || "").toLocaleLowerCase("tr");
  if(!GECERLI[n] || !ilk) return LG_Ses.kapat();
  LG_Ses.kur({kayan: true, n: n, ilk: ilk, havuz: [...GECERLI[n]],
    gecerli: w => GECERLI[n].has(w),
    uygula: w => {
      for(let i = 0; i < n + 1; i++){ yerelSil(); NET.yolla({t: "sil"}); }
      for(const c of w.slice(1)){ yerelHarf(c); NET.yolla({t: "harf", c}); }
    }});
}
/* yerel yanki: sunucudan cevap beklemeden kendi ekranina yaz.
   Hemen ardindan gelen resmi durum zaten uzerine yazar. */
function yerelHarf(c){
  const S=SON; if(!S || NET.benim!==S.cevaplayan) return;
  if(S.faz==="puzzle"||S.faz==="dupuzzle"){
    const P=S.puzzle; if(!P||!S.pgir) return;
    for(let i=0;i<P.n;i++){
      if(P.acik.includes(i)) continue;
      if(!S.pgir[i]){ S.pgir[i]=c; return ciz(S); }
    }
    return;
  }
  if(["kelime","calma","duello","final"].includes(S.faz) && S.giris.length<S.n){
    S.giris+=c; ciz(S);
  }
}
function yerelSil(){
  const S=SON; if(!S || NET.benim!==S.cevaplayan) return;
  if(S.faz==="puzzle"||S.faz==="dupuzzle"){
    const P=S.puzzle; if(!P||!S.pgir) return;
    for(let i=P.n-1;i>=0;i--){
      if(P.acik.includes(i)) continue;
      if(S.pgir[i]){ S.pgir[i]=null; return ciz(S); }
    }
    return;
  }
  if(S.giris && S.giris.length>1){ S.giris=S.giris.slice(0,-1); ciz(S); }
}

  }
  if(S.faz==="finalkarar"){
    const F=S.fin, risk=F.taban*2+FINAL.superEk, benim=NET.benim===F.masa;
    ekran(`<h2>Tamam mı, devam mı?</h2>

           <button class="buton" onclick="NET.yolla({t:'karar',devam:true})">
             DEVAM, süper lingo ▸</button>`

  }
  if(S.faz==="dukkan"){
    sureKap.classList.remove("gizli");
    sureBar.style.width=(100*S.sn/(S.top||DUKSURE))+"%";
    sureKap.classList.toggle("az", S.sn<=10);
    klv.classList.add("gizli");
    orta.className="ust";
    const ben=NET.benim, katil=ben>=0 && S.dukkan.kimler.indexOf(ben)>=0;
    const m=katil?S.masalar[ben]:null;
    const hazirSay=S.dukkan.kimler.filter(i=>S.masalar[i].hazir).length;
    let h=`<div class="dukbas">${DUKAD[S.dukkan.no-1]}</div>`;
    if(katil){
      const kese=m.para;
      h+=`<div class="kese ${kese<0?"borc":""}">
        <span class="tut">${PARA(kese)}</span>
        ${kese<0 ? "kasaya borçlusunuz" : "kesenizde"} · jokerler biriktirdiğiniz
        parayla alınır, <b>eksiye düşebilirsiniz</b>. Aynı jokerden en fazla
        <b>${JMAX}</b> tane; tekrar alırsanız <b>%20 pahalıya</b> gelir.
        Paranızı çarçur etmeyin!</div>`;
      h+=(STOK[S.dukkan.no]||TEMEL).map(id=>{
        const j=JOKERID[id];
        const adet=(m.jok[id]||0), f=jokerFiyat(S, ben, id), dolu=adet>=JMAX;
        return `<button class="jkart ${adet?"elde":""} ${dolu?"dolu":""}"
          ${dolu?"disabled":""} onclick="NET.yolla({t:'al',id:'${id}'})">
          <span class="em">${j.em}</span>
          <span class="gv"><b>${j.ad}</b><span>${j.ac}</span></span>
          <span class="fy">${dolu?"✓":"₺"+TL(f)}<em>${dolu?"elinde "+adet
            :(adet?"elinde "+adet+" · zamlı":"satın al")}</em></span></button>`;
      }).join("");
      h+=`<button class="dukbtn ${m.hazir?"bekle":""}"
        onclick="NET.yolla({t:'hazir'})">${m.hazir
          ? "✓ HAZIRSIN, diğerleri bekleniyor" : "HAZIRIM ▸"}</button>`;
    } else {
      h+=`<div class="kese">Bu dükkan
        <b>${S.dukkan.kimler.map(i=>S.masalar[i].ad).join(", ")}</b> için açık.
        ${ben>=0?"Bu turda alışveriş yapmıyorsunuz.":"İzliyorsunuz."}</div>`;
    }
    h+=`<div class="hazsat">${S.dukkan.kimler.map(i=>
      `<span class="${S.masalar[i].hazir?"ok":""}">${S.masalar[i].hazir?"✓ ":""}${
        S.masalar[i].ad}</span>`).join("")}</div>`;
    h+=`<div class="hazirlar"><b>${hazirSay}/${S.dukkan.kimler.length}</b> masa hazır ·
      dükkan <b>${S.sn}</b> saniye sonra kapanıyor</div>`;
    if(S.mesaj && S.mesaj!==DUKAD[S.dukkan.no-1])
      h+=`<div class="msj ${S.msjTip}" style="max-width:460px">${S.mesaj}</div>`;
    orta.innerHTML=h;
    return;
  }
  if(S.faz==="eleme"){
    ekran(`<h2 style="color:var(--kirmizi)">${S.mesaj}</h2>
      <p>3. etap düello olarak devam ediyor:</p>
      <p class="kw">${S.kalanlar.map(i=>S.masalar[i].ad).join("  ⚔  ")}</p>
      <p class="izle">Elenen masa oyundan çıkmaz: <b>izleyici olarak</b>
         her şeyi görmeye devam eder.</p>`);
    return;
  }
  if(S.faz==="buzz"){
    sureKap.classList.remove("gizli");
    sureBar.style.width=(100*S.sn/(S.top||10))+"%";
    orta.className="";
    const bende=S.buzz.kalan.includes(NET.benim);
    orta.innerHTML=`<div class="msj bek">${S.mesaj}</div>
      ${bende?'<button class="buzz" id="bz">BAS!</button>'
             :'<div class="izle">Diğer masalar butona basıyor…</div>'}`;
    if(bende) $("#bz").onclick=()=>NET.yolla({t:"buzz"});
    klv.classList.add("gizli"); return;
  }
  if(S.faz==="etapsonu"){ ekran(`<h2>${S.mesaj}</h2>`); return; }
  /* kelime / calma / puzzle */
  sureKap.classList.remove("gizli");
  sureBar.style.width=(100*S.sn/(S.top||SURE))+"%";
  sureKap.classList.toggle("az", S.sn<=Math.max(3,(S.top||SURE)*0.25));
  const puz = S.faz==="puzzle"||S.faz==="dupuzzle";
  const dupz = S.faz==="dupuzzle";
  const n = puz ? S.puzzle.n : S.n;
  orta.className="oyun";
  const kimAd = S.cevaplayan>=0 ? S.masalar[S.cevaplayan].ad : ", ";
  let etiket = S.faz==="calma" ? "ÇALMA, "
    : (S.faz==="duello" ? "DÜELLO, "
    : (S.faz==="final" ? (S.n===7?"SÜPER LİNGO, ":"FİNAL, ") : ""));
  let h=`<div class="baslik">${etiket}
    <b>${dupz&&S.cevaplayan<0?"herkes":kimAd}</b> · ${n} HARFLİ · ${S.sn} SN
    ${puz?"":" · "+(S.faz==="duello"?(DUELLO.hak-S.duTahmin)+" TAHMİN KALDI · ₺"+TL(S.duOdul)
                                     :S.hak+" HAK")}
    ${S.faz==="final"?`<br>garantilenen: <b>₺${TL(S.finKazanc)}</b>`:""}</div>`;
  if(puz) h+=`<div class="ipucu"><b>puzzle · ₺${TL(S.puzzle.odul)}</b>${S.puzzle.tanim}</div>`;
  h+=`<div id="tahta" style="--hg:${hucreBoy(n)}px"></div>`;
  if(NET.benim>=0 && S.masalar[NET.benim]){
    const jk=S.masalar[NET.benim].jok||{};
    const ids=Object.keys(jk).filter(k=>jk[k]>0);
    if(ids.length) h+=`<div class="jokbar">`+ids.map(id=>{
      const j=JOKERID[id], ok=jokerAcikMi(S, NET.benim, id);
      return `<button ${ok?"":"disabled"} onclick="NET.yolla({t:'joker',id:'${id}'})"
        title="${j.ad}: ${j.ac}" aria-label="${j.ad}">${j.em}<u>${jk[id]}</u></button>`;
    }).join("")+`</div>`;
  }
  if(dupz && S.buzz.acik && S.buzz.kalan.includes(NET.benim))
    h+=`<button class="buzz" id="bz2">BAS!</button>`;
  if(S.faz==="final" && NET.benim===S.cevaplayan && !S.telAktif)
    h+=`<button class="buton ikinci" id="pasb" ${S.aktif<1?"disabled":""}
      style="max-width:460px">${S.aktif<1?"PAS, önce bir tahmin yapın"
                                        :"PAS, başka kelime ▸"}</button>`;
  orta.innerHTML=h;
  const t=$("#tahta");
  const taban = S.faz==="duello" ? DUELLO.hak : (S.faz==="final" ? FINAL.satir : SATIR);
  /* tahta gerektigi kadar uzar: calmada 6., 7. satir asagi eklenir */
  const satirSay = puz ? 1 : Math.max(taban, S.satirlar.length + (S.acik ? 0 : 1));
  /* ses: yeni satir olustuysa dogru/yanlis, son saniyeler tik */
  if(!puz){
    if(S.satirlar.length !== sonSatir){
      if(S.satirlar.length > sonSatir && S.satirlar.length){
        const ss = S.satirlar[S.satirlar.length-1];
        LG_ses(ss.r.every(x=>x==="tam") ? "dogru" : "yanlis");
      }
      sonSatir = S.satirlar.length;
    }
    if(S.sn !== sonSn){ if(S.sn <= 5 && S.sn > 0) LG_ses("sure"); sonSn = S.sn; }
  }
  /* kelime bitti: cevaplayan masanin telefonunda deftere islenir */
  if(!puz && S.acik && S.acik !== kayitEdilen && NET.benim >= 0 &&
     S.acik.length >= 4 && S.acik.length <= 7){
    const sonS = S.satirlar[S.satirlar.length-1];
    const cozdu = sonS && sonS.r.every(x => x === "tam");
    if(NET.benim === S.cevaplayan){
      defterYaz(S.masalar[NET.benim].ad, S.acik, cozdu ? S.satirlar.length : 0);
      kayitEdilen = S.acik;
    } else if(NET.benim === S.sira){
      /* sira bendeydi ama bilemedim, kelimeyi rakip aldi: bu da bir hata */
      defterYaz(S.masalar[NET.benim].ad, S.acik, 0);
      kayitEdilen = S.acik;
    }
  }
  for(let r=0;r<satirSay;r++){
    const d=document.createElement("div");
    d.className="satir"+((r===S.satirlar.length&&!puz)||puz?" aktif":"");
    d.style.gridTemplateColumns=`repeat(${n}, var(--hg))`;
    for(let i=0;i<n;i++){
      const c=document.createElement("div"); c.className="hucre";
      if(puz){
        const j=S.puzzle.acik.indexOf(i);
        if(S.acik){ c.textContent=TRU(S.acik[i]); c.className="hucre tam"; }
        else if(j>=0){ c.textContent=TRU((S.puzzle.harfler||[])[j]||"?");
                       c.className="hucre ilk"; }
        else { const g=(S.pgir||[])[i];
               c.textContent=g?TRU(g):""; c.className="hucre"+(g?" dolu":""); }
      } else if(r<S.satirlar.length){
        c.textContent=TRU(S.satirlar[r].h[i]||""); c.className="hucre "+S.satirlar[r].r[i];
      } else if(r===S.satirlar.length && S.acik){
        c.textContent=TRU(S.acik[i]); c.className="hucre tam";
      } else if(r===S.satirlar.length){
        const kl=(S.kilitli||[0]).indexOf(i)>=0;
        if(i===0){ c.textContent=TRU(S.giris[0]||""); c.className="hucre ilk"; }
        else if(kl){ c.textContent=TRU(S.giris[i]||""); c.className="hucre tam"; }
        else { c.textContent=S.giris[i]?TRU(S.giris[i]):"";
               c.className="hucre"+(S.giris[i]?" dolu":"");
               if(S.nisan===NET.benim){ c.classList.add("nisan"); c.dataset.i=i; } }
      }
      d.appendChild(c);
    }
    t.appendChild(d);
  }
  /* dikey sigdirma: tasma kaldiysa hucreyi adim adim kucult */
  if(!puz){
    let hg=hucreBoy(n), kere=0;
    while(orta.scrollHeight > orta.clientHeight + 2 && hg > 22 && kere++ < 16){
      hg -= 2; t.style.setProperty("--hg", hg+"px");
    }
  }
  if(S.nisan===NET.benim){
    t.querySelectorAll(".hucre.nisan").forEach(el=>{
      el.onclick=()=>NET.yolla({t:"nisan", i:parseInt(el.dataset.i,10)});
    });
  }
  if(dupz && $("#bz2")) $("#bz2").onclick=()=>NET.yolla({t:"buzz"});
  if($("#pasb")) $("#pasb").onclick=()=>NET.yolla({t:"pas"});
  klavye(!benCevap);
  klvBoya(S);
  toastYaz(S.msjDurum ? "" : S.mesaj, S.msjTip);
}
/* --- yuzen bildirim --- */
function toastKat(){
  let e=document.getElementById("toast");
  if(!e){ e=document.createElement("div"); e.id="toast";
    e.innerHTML='<div class="ic"></div>'; document.body.appendChild(e); }
  return e;
}
let toastSon="", toastSaat=null;
function toastYaz(metin, tip){
  if(!metin){ toastSon=""; return toastSil(); }
  if(metin===toastSon) return;                 /* ayni mesaji tekrar acmaz */
  toastSon=metin;
  const e=toastKat(), ic=e.querySelector(".ic");
  ic.className="ic "+(tip||"bek"); ic.innerHTML=metin;
  const kl=(klv && !klv.classList.contains("gizli")) ? (klv.offsetHeight||0) : 0;
  document.documentElement.style.setProperty("--klh", kl+"px");
  e.style.display="flex";
  if(toastSaat) clearTimeout(toastSaat);
  toastSaat=setTimeout(()=>{ toastSil(); }, 2600);
}
function toastSil(){
  if(toastSaat){ clearTimeout(toastSaat); toastSaat=null; }
  const e=document.getElementById("toast");
  if(e) e.style.display="none";
}

      ${h.join(" · ")}</button>`).join("")}

    ${ADLAR.map((a,i)=>`<input class="ad" id="ai${i}" maxlength="18" value="${a}">`).join("")}
    <button class="buton" onclick="isimKaydet()">KAYDET ▸</button>`);
}
function isimSeti(i){
  ADLAR=hazirSetler(KISI_SAY)[i].slice(); isimUygula(); uyariGoster("İsimler değişti");
}
function isimKaydet(){
  ADLAR=ADLAR.map((_,i)=>(($("#ai"+i)&&$("#ai"+i).value.trim())||VARAD[KISI_SAY][i]).slice(0,18));
  isimUygula(); uyariGoster("İsimler kaydedildi");
}
function isimUygula(){
  try{ localStorage.setItem("lingo_masalar_"+ADLAR.length, JSON.stringify(ADLAR));
       localStorage.setItem("lingo_masa_say", String(ADLAR.length)); }catch(e){}
  if(M.S && M.S.masalar.length!==ADLAR.length) M.kur(ADLAR);
  else if(M.S){ ADLAR.forEach((a,i)=>{ if(M.S.masalar[i]) M.S.masalar[i].ad=a; }); M.gonder(); }
  odaEkrani();
}
function uyariGoster(m){
  const d=document.createElement("div");
  d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:80px;"+
    "background:var(--ink);color:var(--zemin);padding:9px 16px;border-radius:999px;"+
    "font-weight:700;z-index:30";
  d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),1400);
}
function linkKopya(u){ if(navigator.clipboard) navigator.clipboard.writeText(u)
  .then(()=>uyariGoster("Link kopyalandı")); }
function katilEkran(){
  ekran(`<h2>Bağlanılıyor…</h2><p class="izle">Masalar getiriliyor</p>`);
  NET.katilBasla(null, "", -1, err=>{
    if(err) return ekran(`<h2>Bağlanılamadı</h2>
      <p>Masayı kuran cihazın sayfası açık olmalı.
         Önce biri <b>MASAYI BEN KURARIM</b>'a dokunsun.</p>
      <button class="buton" onclick="katilEkran()">TEKRAR DENE</button>
      <button class="buton ikinci" onclick="giris()">geri</button>`);
    kodEl.classList.remove("gizli"); kodEl.textContent=ODAAD;
    ekran(`<h2>Bağlandınız</h2><p class="izle">Masalar bekleniyor…</p>`);
  });
}
/* isimler kurandan geldikten sonra masa secimi */
function masaSecEkrani(S){
  masaSecili = null;
  ekran(`<span class="rozet">${ODAAD}</span>
    <h2>Hangi masadasınız?</h2>
    <p class="izle">Masanıza dokunun.</p>
    ${S.masalar.map((m,i)=>`<button class="buton ikinci" data-masa="${i}"
      onclick="masaAl(${i})">${m.ad}</button>`).join("")}
    <button class="buton ikinci" data-masa="-1" style="margin-top:14px"
      onclick="masaAl(-1)">Sadece izleyeceğim</button>`);
}
let masaSecili = null;
function masaAl(i){
  /* ayni tusa ikinci dokunus secimi kaldirir, baska tusa dokunus secimi tasir */
  masaSecili = (masaSecili === i) ? null : i;
  document.querySelectorAll(".kutu button[data-masa]").forEach(b => {
    b.className = (masaSecili !== null && b.getAttribute("data-masa") === String(masaSecili))
      ? "buton" : "buton ikinci";
  });
  const g = masaSecili === null ? -1 : masaSecili;
  NET.benim=g; masaSoruldu=true;
  try{ localStorage.setItem("lingo_masa_ben", String(g)); }catch(e){}
  NET.yolla({t:"masa", i:g});
  agYaz(); if(SON) ciz(SON);
}
function yeniden(){ M.kur(ADLAR); M.basla(); }
document.addEventListener("keydown", e=>{
  if(klv.classList.contains("gizli")||klv.classList.contains("kilit")) return;
  if(e.key==="Enter") NET.yolla({t:"gonder"});
  else if(e.key==="Backspace") NET.yolla({t:"sil"});
  else if(e.key.length===1){ const c=TRL(e.key); if(klvTus[c]) NET.yolla({t:"harf", c}); }
});
window.addEventListener("resize", ()=>{ if(SON) ciz(SON); });
function otoKatil(){
  let oto=null, ben=null;
  try{ oto=sessionStorage.getItem("lingo_masa_oto");
       sessionStorage.removeItem("lingo_masa_oto");
       ben=localStorage.getItem("lingo_masa_ben"); }catch(e){}
  if(oto!=="1" || ben===null) return false;
  const i=parseInt(ben,10);
  ekran(`<h2>Yeniden bağlanılıyor…</h2>
    <p class="izle">Bağlantı kopmuştu, masana geri dönülüyor.</p>`);
  NET.katilBasla(null, "", i, err=>{
    if(err) return ekran(`<h2>Bağlanılamadı</h2>
      <p>Masayı kuran cihazın sayfası açık olmalı.</p>
      <button class="buton" onclick="location.reload()">TEKRAR DENE</button>
      <button class="buton ikinci" onclick="giris()">baştan başla</button>`);
    kodEl.classList.remove("gizli"); kodEl.textContent=ODAAD;
    NET.benim=i; masaSoruldu=true;
    NET.yolla({t:"masa", i});
    agYaz();
  });
  return true;
}
function yukle(){
  TEMA = temaUygula(temaOku(), false);
  const td=document.getElementById("temad");
  if(td) td.onclick = temaCevir;
  LG_sesDugme(document.getElementById("sesd"));
  ekran(`<h1>LİNGO MASA</h1><p>Kelime havuzu yükleniyor…</p>`);
  fetch("oyun-veri.json").then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(d=>{ VERI=d; GECERLI={};
      for(const n in VERI.gecerli) GECERLI[n]=new Set(VERI.gecerli[n]);
      if(otoKatil()) return;
      giris(); })
    .catch(()=>ekran(`<h2>Yüklenemedi</h2>
      <button class="buton" onclick="location.reload()">YENİLE</button>`));
}
yukle();
