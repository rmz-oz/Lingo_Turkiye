<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1720">
<title>Gelişim raporu — Lingo</title>
<style>
:root{--kagit:#0f1720;--kart:#1a2430;--murekkep:#f2f5f8;--soluk:#8b98a6;
  --cizgi:#2c3947;--yesil:#2e9e5b;--sari:#e6b22e;--kirmizi:#d94a5a;--altin:#f4c95d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--kagit);color:var(--murekkep);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
header{background:#0a1119;border-bottom:1px solid var(--cizgi);padding:10px 12px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header a{color:var(--soluk);text-decoration:none;font-size:15px}
header b{font-size:13px;letter-spacing:1px;color:var(--altin);text-transform:uppercase}
.sar{max-width:600px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.4px}
h2{font-size:13px;letter-spacing:1.3px;text-transform:uppercase;color:var(--soluk);
  margin:22px 0 8px}
p{color:var(--soluk);font-size:15px;margin:0 0 10px;line-height:1.5}
.kisi{display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--kart);border:1px solid var(--cizgi);border-radius:999px;
  padding:8px 14px;margin:0 0 14px;font-size:14px;color:var(--soluk);cursor:pointer}
.kisi b{color:var(--murekkep);font-size:15px}
.kisi u{text-decoration:none;color:var(--yesil);font-weight:700;font-size:13px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;
  margin:10px 0 16px}
.kgrid button{background:#22303d;border:1.5px solid var(--cizgi);border-radius:11px;
  padding:13px 6px;color:var(--murekkep);font-weight:700;font-size:15px}
.kgrid button.on{background:var(--yesil);border-color:var(--yesil);color:#fff}
.ozet{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.ozet div{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;
  padding:12px 8px;text-align:center}
.ozet b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums}
.ozet span{font-size:11px;color:var(--soluk);text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--cizgi);text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--soluk)}
td.h{font-weight:800;font-size:17px;width:38px}
td.o{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;width:64px}
td.b{width:38%}
.cub{height:7px;border-radius:4px;background:#22303d;overflow:hidden}
.cub i{display:block;height:100%}
.i1{background:var(--yesil)}.i2{background:var(--sari)}.i3{background:var(--kirmizi)}
tr.tik{cursor:pointer}
.wrap{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.wrap span{font-family:ui-monospace,Menlo,monospace;font-size:14px;font-weight:700;
  padding:5px 9px;border-radius:7px;background:#3d1720;color:#f2a3ad;letter-spacing:1px}
.wrap span i{font-style:normal;font-size:10px;opacity:.75;margin-left:4px}
.buton{display:block;width:100%;background:var(--altin);color:#1a1200;border:0;
  border-radius:12px;padding:14px;font-weight:800;font-size:16px;margin-top:10px;
  text-align:center;text-decoration:none}
.buton.ikinci{background:transparent;color:var(--murekkep);border:1.5px solid var(--cizgi)}
.bos{background:var(--kart);border:1px dashed var(--cizgi);border-radius:12px;
  padding:22px 16px;text-align:center;color:var(--soluk);font-size:15px;line-height:1.55}
</style></head><body>
<header><a href="index.html">‹</a><b>Gelişim raporu</b></header>
<div class="sar" id="alan"></div>
<script>
const TRU = s => s.replace(/i/g,"İ").replace(/ı/g,"I").toUpperCase();
const $ = s => document.querySelector(s);
function defter(ad){
  try{ const d = JSON.parse(localStorage.getItem("lingo_defter_"+ad)||"[]");
       return Array.isArray(d) ? d : []; }catch(e){ return []; }
}
const KISI_VAR = ["Serpil","Zeynep","Yusuf","Ramiz","Misafir"];
let KISILER = KISI_VAR.slice(), KISI = null, secimAcik = false;
try{
  const k = JSON.parse(localStorage.getItem("lingo_kisiler")||"null");
  if(Array.isArray(k) && k.length) KISILER = k;
  /* oyunlarda masa adiyla acilmis defterleri de listeye kat */
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key && key.indexOf("lingo_defter_") === 0){
      const ad = key.slice(13);
      if(ad && KISILER.indexOf(ad) < 0) KISILER.push(ad);
    }
  }
  KISI = localStorage.getItem("lingo_kisi") || KISILER[0];
  if(KISILER.indexOf(KISI) < 0) KISILER.unshift(KISI);
  /* kaydi olan biri varsa onu goster */
  if(!defter(KISI).length){
    const dolu = KISILER.find(a => defter(a).length);
    if(dolu) KISI = dolu;
  }
}catch(e){ KISI = KISILER[0]; }

function kisiSec(a){ KISI=a; secimAcik=false;
  try{ localStorage.setItem("lingo_kisi",a); }catch(e){} ciz(); }
function sinif(o){ return o>=75 ? "i1" : (o>=50 ? "i2" : "i3"); }

function ciz(){
  const d = defter(KISI);
  const kisiSerit = `<div class="kisi" onclick="secimAcik=!secimAcik;ciz()">
      👤 <b>${KISI}</b> raporu <u>${secimAcik?"kapat":"kişi değiştir"}</u></div>
    ${secimAcik ? `<div class="kgrid">${KISILER.map(a =>
      `<button class="${a===KISI?"on":""}" onclick="kisiSec('${a.replace(/'/g,"")}')">
        ${a}${defter(a).length?" · "+defter(a).length:""}</button>`).join("")}</div>` : ""}`;

  if(!d.length){
    $("#alan").innerHTML = `<h1>Gelişim raporu</h1>${kisiSerit}
      <div class="bos">Henüz kayıt yok.<br>Alıştırma yaptıkça bilinen ve
        takılınan kelimeler burada birikir.</div>
      <a class="buton" href="alistirma4.html">4 HARFLİ ALIŞTIRMAYA BAŞLA</a>
      <a class="buton ikinci" href="index.html">ANA SAYFA</a>`;
    return;
  }
  const top = d.length, bil = d.filter(r=>r.k>0).length;
  const ort = bil ? (d.filter(r=>r.k>0).reduce((t,r)=>t+r.k,0)/bil) : 0;
  const son = d.slice(-50), sonBil = son.filter(r=>r.k>0).length;

  /* uzunluga gore */
  let uz = "";
  for(const n of [4,5,6,7]){
    const g = d.filter(r=>r.n===n); if(!g.length) continue;
    const o = Math.round(100*g.filter(r=>r.k>0).length/g.length);
    uz += `<tr><td class="h">${n}h</td><td class="b"><div class="cub">
      <i class="${sinif(o)}" style="width:${o}%"></i></div></td>
      <td style="color:var(--soluk);font-size:13px">${g.length} kelime</td>
      <td class="o">%${o}</td></tr>`;
  }
  /* harflere gore (en zayiftan) */
  const hs = {};
  for(const r of d){
    const k = r.h + "|" + r.n;                       // harf + uzunluk ayri ayri
    (hs[k] = hs[k] || {t:0, b:0, h:r.h, n:r.n}).t++;
    if(r.k>0) hs[k].b++;
  }
  const hl = Object.values(hs).filter(x=>x.t>=2)
    .map(x=>({...x, o: Math.round(100*x.b/x.t)}))
    .sort((a,b)=>a.o-b.o || b.t-a.t);
  const hsat = hl.slice(0,12).map(x=>
    `<tr class="tik" onclick="location.href='alistirma${x.n}.html#h=${encodeURIComponent(x.h)}'">
      <td class="h">${TRU(x.h)}<em style="font-style:normal;font-size:11px;
        color:var(--soluk);display:block;font-weight:600">${x.n}h</em></td>
      <td class="b"><div class="cub"><i class="${sinif(x.o)}" style="width:${x.o}%"></i></div></td>
      <td style="color:var(--soluk);font-size:13px">${x.b}/${x.t}</td>
      <td class="o">%${x.o}</td></tr>`).join("");

  /* takilinan kelimeler */
  const tk = {};
  for(const r of d) if(r.k===0) tk[r.w] = (tk[r.w]||0)+1;
  const tkl = Object.keys(tk).sort((a,b)=>tk[b]-tk[a]);
  const tkHtml = tkl.length
    ? `<div class="wrap">${tkl.slice(0,40).map(w=>
        `<span>${TRU(w)}${tk[w]>1?`<i>${tk[w]}×</i>`:""}</span>`).join("")}</div>`
    : `<p>Hiç takıldığın kelime yok — henüz.</p>`;
  const uzTekrar = [4,5,6,7].filter(n => tkl.some(w=>w.length===n));

  $("#alan").innerHTML = `<h1>Gelişim raporu</h1>${kisiSerit}
    <div class="ozet">
      <div><b>${top}</b><span>kelime</span></div>
      <div><b style="color:${sinif(Math.round(100*bil/top))==="i1"?"var(--yesil)":
        (sinif(Math.round(100*bil/top))==="i2"?"var(--sari)":"var(--kirmizi)")}"
        >%${Math.round(100*bil/top)}</b><span>bilinen</span></div>
      <div><b>${ort?ort.toFixed(1):"—"}</b><span>ort. tahmin</span></div>
      <div><b>%${son.length?Math.round(100*sonBil/son.length):0}</b><span>son 50</span></div>
    </div>
    <h2>Uzunluğa göre</h2>
    <table>${uz}</table>
    <h2>En zayıf harflerin</h2>
    <p style="font-size:13.5px">Harfin altında hangi uzunluk olduğu yazıyor. Satıra dokun, o harfle alıştırma başlasın.</p>
    <table><tr><th>harf</th><th>başarı</th><th>bilinen</th><th></th></tr>${hsat}</table>
    <h2>Takıldığın kelimeler${tkl.length?" · "+tkl.length:""}</h2>
    ${tkHtml}
    ${uzTekrar.map(n=>`<a class="buton" href="alistirma${n}.html#tekrar">
      ${n} HARFLİ TAKILDIKLARINI TEKRAR ET</a>`).join("")}
    <a class="buton ikinci" href="index.html">ANA SAYFA</a>
    <p style="font-size:12.5px;margin-top:14px">Kayıtlar bu telefonda,
      ${KISI} adına tutuluyor. <span style="color:var(--kirmizi);cursor:pointer"
      onclick="if(confirm('${KISI} kayıtları silinsin mi?')){
        localStorage.removeItem('lingo_defter_${KISI}');ciz();}">kayıtları sil</span></p>`;
}
ciz();
</script><script>setTimeout(function(){
  var log=[];
  try{
    log.push("kisi:"+(document.querySelector(".kisi")||{textContent:"YOK"}).textContent.replace(/\s+/g," ").trim());
    log.push("ozet:"+[].slice.call(document.querySelectorAll(".ozet div"))
      .map(x=>x.textContent.replace(/\s+/g," ").trim()).join(" | "));
    log.push("kisi-listesi:"+KISILER.join(","));
    log.push("bos-mu:"+!!document.querySelector(".bos"));
  }catch(e){ log.push("HATA:"+e.message); }
  document.body.setAttribute("data-test", log.join(" ~ "));
},1300);
</script></body></html>
