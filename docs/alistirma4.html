<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1720">
<title>4 harfli alıştırma: Lingo</title>
<style>
:root{--kagit:#0f1720;--kart:#1a2430;--murekkep:#f2f5f8;--soluk:#8b98a6;
  --cizgi:#2c3947;--yesil:#2e9e5b;--sari:#e6b22e;--gri:#3a4756;
  --kirmizi:#d94a5a;--altin:#f4c95d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--kagit);color:var(--murekkep);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer}
#bar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0a1119;
  border-bottom:1px solid var(--cizgi);flex:none}
#bar .etap{font-size:13px;letter-spacing:1px;font-weight:700;color:var(--altin);
  text-transform:uppercase}
#bar a{color:var(--soluk);text-decoration:none;font-size:14px}
#bar .para{font-weight:800;font-variant-numeric:tabular-nums}
#bar #ydg{margin-left:auto;border:1px solid var(--cizgi);background:transparent;
  color:#63707e;border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:800;
  letter-spacing:.6px}
#bar #ydg.on{background:var(--yesil);border-color:var(--yesil);color:#fff}
#bar #sesd{border:1px solid var(--cizgi);background:transparent;border-radius:99px;
  width:32px;height:28px;padding:0;font-size:14px;line-height:1}
#bar #sesd.kapali{opacity:.45}
#sure{width:100%;height:4px;background:#22303d;flex:none}
#sure i{display:block;height:100%;background:var(--altin);width:100%}
#sure.az i{background:var(--kirmizi)}
#orta{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:12px;gap:10px;min-height:0}
#orta.ust{justify-content:flex-start}
.baslik{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--soluk);
  font-weight:700;text-align:center}
#tahta{display:grid;gap:5px;justify-content:center}
#tahta .satir{display:grid;gap:5px}
.hucre{width:var(--hg);height:var(--hg);border:2px solid var(--cizgi);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:800;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:calc(var(--hg)*.52);
  background:#141d27}
.hucre.ilk{border-color:#4a5a6b;color:var(--altin)}
.hucre.dolu{border-color:#4a5a6b}
.hucre.tam{background:var(--yesil);border-color:var(--yesil);color:#fff}
.hucre.var{background:var(--sari);border-color:var(--sari);color:#231a00}
.hucre.yok{background:var(--gri);border-color:var(--gri);color:#8fa0b0}
.satir.aktif .hucre{border-color:#5d6f82}
.satir.sarsil{animation:sars .35s}
@keyframes sars{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
#klavye{flex:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  background:#0a1119;border-top:1px solid var(--cizgi)}
#klavye .sr{display:flex;gap:4px;justify-content:center;margin-bottom:4px}
#klavye button{flex:1 1 0;min-width:0;height:46px;border:0;border-radius:7px;
  background:#3a4756;color:#fff;font-weight:700;font-size:16px;padding:0}
#klavye button.gnis{flex:1.9 1 0;font-size:13px;letter-spacing:.5px}
#klavye button.dar{flex:1.25 1 0;font-size:12.5px;letter-spacing:.5px}
#klavye button.tam{background:var(--yesil)}
#klavye button.var{background:var(--sari);color:#231a00}
#klavye button.yok{background:#1e2933;color:#5d6b7a}
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;
  padding:20px 18px;max-width:520px;width:100%;text-align:center}
.kutu h1{font-size:30px;margin:0 0 6px;letter-spacing:-.5px}
.kutu h2{font-size:20px;margin:0 0 8px}
.kutu p{color:var(--soluk);margin:0 0 10px;font-size:15.5px;line-height:1.55}
.kutu p b{color:var(--murekkep)}
.buton{display:block;width:100%;background:var(--altin);color:#1a1200;border:0;
  border-radius:12px;padding:15px;font-weight:800;font-size:17px;margin-top:10px}
.buton.ikinci{background:transparent;color:var(--murekkep);border:1.5px solid var(--cizgi)}
.kucuk{font-size:13.5px;color:var(--soluk);line-height:1.5}
.tutar{font-size:44px;font-weight:800;color:var(--altin);letter-spacing:-1px;line-height:1.1}
.uyari{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#f2f5f8;
  color:#0f1720;padding:9px 16px;border-radius:999px;font-weight:700;font-size:14.5px;
  z-index:20;box-shadow:0 6px 22px rgba(0,0,0,.4)}
/* degerlendirme */
.dgr{max-width:560px;width:100%;text-align:left}
.dgr .yanlis{background:var(--kart);border:1px solid var(--kirmizi);border-radius:14px;
  padding:14px 16px;text-align:center;margin-bottom:10px}
.dgr .yanlis span{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--kirmizi);font-weight:700;display:block;margin-bottom:4px}
.dgr .yanlis b{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:3px}
.dgr .yanlis i{display:block;font-style:normal;font-size:14px;color:var(--soluk);
  margin-top:6px;line-height:1.45}
.dgr .oner{background:#132a1c;border:1px solid #2e6b45;border-radius:14px;
  padding:14px 16px;text-align:center;margin-bottom:12px}
.dgr .oner span{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;
  color:#6fcf97;font-weight:700;display:block;margin-bottom:6px}
.dgr .oner b{font-family:ui-monospace,Menlo,monospace;font-size:23px;letter-spacing:2px;
  display:block}
.dgr .oner i{font-style:normal;font-size:13.5px;color:#9fd4b4;display:block;margin-top:5px}
.dgr h3{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--soluk);
  margin:14px 0 8px}
.wrap{display:flex;flex-wrap:wrap;gap:5px}
.k{display:inline-block;padding:4px 8px;border-radius:6px;font-size:14px;font-weight:700;
  font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px;white-space:nowrap}
.k em{font-style:normal;font-size:9.5px;letter-spacing:0;margin-left:3px;opacity:.75;
  font-family:inherit;vertical-align:2px}
.k.bu{outline:2.5px solid var(--kirmizi);outline-offset:1.5px}
.c1{background:#fff9e3;color:#8a7000}.c2{background:#ffefb0;color:#7d5c00}
.c3{background:#ffe085;color:#7a4d00}.c4{background:#ffca6b;color:#7a3d00}
.c5{background:#ffae5e;color:#7a2e00}.c6{background:#f98e63;color:#762005}
.c7{background:#e56a63;color:#fff}.c8{background:#cf4a72;color:#fff}
.c9{background:#a3348a;color:#fff}.c10{background:#6a2b84;color:#fff}
.k.hic{background:transparent;border:1px solid var(--cizgi);color:var(--soluk);
  font-weight:600}
.lej{display:flex;gap:3px;flex-wrap:wrap;align-items:center;margin:6px 0 0;
  font-size:11.5px;color:var(--soluk)}
.lej i{font-style:normal;padding:2px 6px;border-radius:4px;font-weight:700;font-size:11px}
/* harf secimi */
.sec{max-width:560px;width:100%}
.sec h1{font-size:26px;margin:0 0 6px;letter-spacing:-.5px;text-align:center}
.sec .not{color:var(--soluk);font-size:14.5px;line-height:1.5;text-align:center;
  margin:0 0 12px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.hgrid button{border:0;border-radius:11px;padding:9px 4px 7px;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.hgrid b{font-size:22px;font-weight:800;letter-spacing:.5px}
.hgrid i{font-style:normal;font-size:10px;opacity:.85;font-weight:700;white-space:nowrap}
.hgrid em{font-style:normal;font-size:9px;opacity:.72;white-space:nowrap}
.z1{background:#2e9e5b;color:#fff}
.z2{background:#e6b22e;color:#3d2c00}
.z3{background:#d94a5a;color:#fff}
.karis{margin-top:14px;background:linear-gradient(135deg,#6c5ce7 0%,#8e6ce8 100%);
  color:#fff;border:0;box-shadow:0 4px 14px rgba(108,92,231,.35);
  display:flex;align-items:center;justify-content:center;gap:9px}
.karis .em{font-size:21px;line-height:1}
.karis small{display:block;font-size:12.5px;font-weight:600;opacity:.85;
  letter-spacing:.2px;margin-top:1px}
.karis .tx{text-align:left}
.rapb{display:flex;align-items:center;gap:12px;margin-top:14px;padding:13px 14px;
  background:#182430;border:1px solid var(--cizgi);border-radius:13px;
  text-decoration:none;color:var(--murekkep)}
.rapb .ik{width:38px;height:38px;border-radius:10px;background:#22303d;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:19px}
.rapb .tx{flex:1;min-width:0;text-align:left}
.rapb .tx b{display:block;font-size:15px;letter-spacing:.2px;line-height:1.25}
.rapb .tx span{display:block;font-size:12.5px;color:var(--soluk);margin-top:3px;
  line-height:1.45}
.rapb .ok{color:var(--soluk);font-size:20px;line-height:1;flex:none}
.lej3{display:flex;gap:5px;justify-content:center;align-items:center;
  margin:10px 0 2px;font-size:12px;color:var(--soluk);flex-wrap:wrap}
.lej3 i{font-style:normal;padding:2px 9px;border-radius:5px;font-weight:700;font-size:11.5px}
/* yardimli mod */
.yrd{width:100%;max-width:620px;margin-top:2px;display:flex;gap:10px;
  align-items:flex-start}
.ysol{flex:0 0 150px;background:#132a1c;border:1px solid #2e6b45;border-radius:10px;
  padding:9px 10px}
.ysag{flex:1;min-width:0}
.ysol .yh{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
  color:#6fcf97;font-weight:800;margin-bottom:6px;line-height:1.3}
.ysol .yp{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;
  color:#d8f3e2;letter-spacing:.4px;margin-bottom:4px}
@media(max-width:560px){
  .yrd{flex-direction:column;gap:7px}
  .ysol{flex:none;width:100%}
  .ysol .yp{display:inline-flex;margin:0 10px 3px 0}
}
.yrd .yb{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--soluk);
  letter-spacing:.6px;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.yrd .yb b{color:var(--yesil);font-size:15px}
.yrd .yb u{margin-left:auto;text-decoration:none;color:#63707e;font-weight:600}
.yw{display:flex;flex-wrap:wrap;gap:4px;max-height:34vh;overflow-y:auto;
  padding:2px 1px 4px}
.yw span{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;
  padding:2px 6px;border-radius:5px;letter-spacing:.5px;white-space:nowrap}
.yw span.ok{background:#1e4d33;color:#7fe0a6;border:1px solid #2e9e5b}
.yw span.no{background:transparent;color:#4d5763;text-decoration:line-through;
  border:1px solid #232e3a;font-weight:600}
.anah{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;
  padding:11px 14px;margin-top:12px;cursor:pointer}
.anah .t{text-align:left}
.anah .t b{display:block;font-size:15.5px}
.anah .t b u{text-decoration:none;color:var(--soluk);font-size:13px}
.anah.on .t b u{color:var(--yesil)}
.anah .t i{font-style:normal;font-size:12.5px;color:var(--soluk);line-height:1.35;
  display:block;margin-top:2px}
.anah .sw{width:46px;height:26px;border-radius:99px;background:#3a4756;flex:none;
  position:relative;transition:background .15s}
.anah .sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:99px;background:#fff;transition:left .15s}
.anah.on .sw{background:var(--yesil)}
.anah.on .sw:after{left:23px}
/* kutlama */
.kutla{position:fixed;inset:0;z-index:60;background:rgba(9,15,22,.94);
  display:flex;align-items:center;justify-content:center;padding:22px}
.kutla canvas{position:absolute;inset:0;width:100%;height:100%}
.kutla .ki{position:relative;text-align:center;max-width:400px;width:100%}
.kutla .kt{font-size:13px;letter-spacing:3.5px;text-transform:uppercase;
  color:var(--altin);font-weight:800;margin-bottom:8px}
.kutla .kb{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
.kutla .kw{font-family:ui-monospace,Menlo,monospace;font-size:30px;font-weight:800;
  letter-spacing:5px;color:#fff;background:var(--yesil);border-radius:12px;
  padding:12px 10px;margin-bottom:10px}
.kutla .kn{font-size:15px;color:var(--soluk);margin-bottom:16px}
/* kisi */
.kisi{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  background:var(--kart);border:1px solid var(--cizgi);border-radius:999px;
  padding:7px 14px;margin:0 auto 10px;font-size:14px;color:var(--soluk);
  cursor:pointer;max-width:340px}
.kisi b{color:var(--murekkep);font-size:15px}
.kisi u{text-decoration:none;color:var(--yesil);font-weight:700;font-size:13px;
  margin-left:8px;white-space:nowrap}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;
  margin:10px 0}
.kgrid button{background:#22303d;border:1.5px solid var(--cizgi);border-radius:11px;
  padding:14px 6px;color:var(--murekkep);font-weight:700;font-size:16px}
.kgrid button.on{background:var(--yesil);border-color:var(--yesil);color:#fff}
/* rozet */
.rozkut{background:linear-gradient(135deg,#3a2f0c,#4a3a10);border:1px solid var(--altin);
  border-radius:13px;padding:12px 14px;margin-top:12px;text-align:left}
.rozkut .bs{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--altin);
  font-weight:800;margin-bottom:8px}
.rozsat{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.rozsat:last-child{margin-bottom:0}
.rozsat .em{font-size:26px;line-height:1}
.rozsat b{font-size:15.5px;display:block}
.rozsat span{font-size:12.5px;color:var(--soluk)}
.unvkut{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;
  padding:11px 14px;margin-top:10px;text-align:left}
.unvkut b{color:var(--altin);font-size:15.5px}
.unvkut span{display:block;font-size:12.5px;color:var(--soluk);margin-top:2px}
.unvkut .c{height:5px;background:#22303d;border-radius:3px;margin-top:7px;overflow:hidden}
.unvkut .c i{display:block;height:100%;background:var(--altin)}
.lgroz{font-size:15px;margin-right:2px}
.unvyeni{background:linear-gradient(135deg,#f4c95d,#e0a92e);color:#1a1200;
  border-radius:14px;padding:14px;margin-top:12px;text-align:center;
  box-shadow:0 5px 18px rgba(244,201,93,.3)}
.unvyeni .uy1{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;
  opacity:.75}
.unvyeni .uy2{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:3px 0 2px}
.unvyeni .uy3{font-size:12.5px;opacity:.8}
.uret{background:linear-gradient(135deg,#3a2f0c,#4a3a10);border:1px solid var(--altin);
  border-radius:13px;padding:14px;margin:10px 0 4px;text-align:center}
.uret b{display:block;font-size:19px;color:var(--altin);letter-spacing:-.2px;
  margin-bottom:10px}
.ub{display:flex;gap:8px}
.ub .buton{margin-top:0;font-size:14px;padding:12px 6px}
input.adg{width:100%;background:#22303d;border:1.5px solid var(--cizgi);border-radius:11px;
  padding:13px;color:var(--murekkep);font:inherit;font-weight:700;text-align:center;
  margin:8px 0}
.sifir{font-size:12.5px;color:#5f6b78;text-align:center;margin-top:14px;line-height:1.6}
.sifir span{color:var(--kirmizi);cursor:pointer;text-decoration:underline}
.gizli{display:none!important}
</style><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="fiko-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head><body>
<div id="bar"><a href="index.html">‹</a><span class="etap">ALIŞTIRMA · 4 HARFLİ</span>
  <button id="ydg" onclick="yardimDegis()">YARDIM</button>
  <button id="sesd" onclick="sesDegis()">🔊</button>
  <span class="para" id="skor">0 / 0</span></div>
<div id="sure" class="gizli"><i></i></div>
<div id="orta"></div>
<div id="klavye" class="gizli"></div>
<script src="rozet.js?v=6"></script>

let fisekRAF = null;
function durdurFisek(){ if(fisekRAF){ cancelAnimationFrame(fisekRAF); fisekRAF = null; } }
function havaiFisek(cv){
  const az = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ctx = cv.getContext("2d");
  const W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  const RENK = ["#f4c95d","#2e9e5b","#e6b22e","#6c5ce7","#d94a5a","#7fe0a6","#fff"];
  let par = [], son = 0, bas = 0;
  function patlat(){
    const x = W*(0.18 + Math.random()*0.64), y = H*(0.12 + Math.random()*0.42);
    const c = RENK[Math.floor(Math.random()*RENK.length)];
    const n = 34 + Math.floor(Math.random()*20);
    for(let i = 0; i < n; i++){
      const a = Math.PI*2*i/n + Math.random()*0.25, v = 1.5 + Math.random()*2.8;
      par.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, c,
                o: 1, r: 1.5 + Math.random()*1.5});
    }
  }
  function tur(t){
    if(!bas) bas = t;
    ctx.clearRect(0, 0, W, H);
    if(t - son > 500 && t - bas < 3200){ son = t; patlat(); }
    par = par.filter(p => p.o > 0.02);
    for(const p of par){
      p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.vx *= 0.986; p.vy *= 0.986; p.o *= 0.971;
      ctx.globalAlpha = p.o; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.284); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if(par.length || t - bas < 3200) fisekRAF = requestAnimationFrame(tur);
    else fisekRAF = null;
  }
  if(az){ patlat(); ctx.globalAlpha = 1; return; }
  patlat(); fisekRAF = requestAnimationFrame(tur);
}
