<script>if(typeof LG_kervanMeta !== "function") window.LG_kervanMeta = function(){ return {}; };</script>
<script>if(typeof LG_papatyaMeta !== "function") window.LG_papatyaMeta = function(){ return {}; };</script>
<script>
const TRU = s => s.replace(/i/g,"İ").replace(/ı/g,"I").toUpperCase();
const $ = s => document.querySelector(s);
const defter = LG_defter;
const KISI_VAR = ["Serpil","Zeynep"];
let KISILER = LG_kisiler(KISI_VAR), KISI = null, secimAcik = false, acikGun = 0;
KISI = LG_kisiDogrula(KISILER);
if(!KISI || KISI === LG_KAYITSIZ)
  KISI = KISILER.find(a => LG_defter(a).length) || KISILER[0];

/* --- yarisma tarihi --- */
function tarihAl(){ return localStorage.getItem("lingo_yarisma") || "2026-09-12"; }
function tarihYaz(v){ try{ localStorage.setItem("lingo_yarisma", v); }catch(e){} ciz(); }
function kalanGun(){
  const t = new Date(tarihAl()+"T00:00:00");
  const b = new Date(); b.setHours(0,0,0,0);
  return Math.max(0, Math.round((t-b)/86400000));
}
/* --- gun tarihleri: 1. gun = yarismadan 4 gun once --- */
function gunTarihi(i){
  const t = new Date(tarihAl()+"T00:00:00");
  t.setDate(t.getDate() - (5 - i));      /* 1. gun = yarismadan 4 gun once */
  return t;
}
function ayniGun(a,b){ return a.toDateString() === b.toDateString(); }
function gunKayit(d, i){
  const t = gunTarihi(i);
  return d.filter(r => ayniGun(new Date(r.t), t));
}
const AYLAR=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
function tarihYazi(t){ return t.getDate()+" "+AYLAR[t.getMonth()]; }
/* --- gorev durumu --- */
function planAl(){
  try{ return JSON.parse(localStorage.getItem("lingo_plan_"+KISI)||"{}"); }catch(e){ return {}; }
}
function gorevDegis(id){
  const p = planAl(); p[id] = !p[id];
  try{ localStorage.setItem("lingo_plan_"+KISI, JSON.stringify(p)); }catch(e){}
  ciz();
}
function kisiSec(a){ KISI=a; secimAcik=false;
  try{ localStorage.setItem("lingo_kisi",a); }catch(e){} ciz(); }

/* --- 4 gunluk program --- */
const GUNLER = [
  {ad:"Açılış ezberi", sure:"~1 sa 15 dk · 110 kelime",
   nicin:"En çok gelen 10 harf (K S B D T M A P Y E) tüm cevapların <b>%59'unu</b> "+
         "oluşturuyor. Bu harflerin açılış ikililerini bilmek, her soruya doğru "+
         "başlamak demek, ezberlenecek toplam 20 ikili.",
   gorev:[
     'Ders notu: <a href="4harf.html">4 harfli</a> sayfasını aç, K S B D T M A P Y E harflerinin açılış ikililerini oku',
     'Ders notu: <a href="5harf.html">5 harfli</a> sayfasında aynı 10 harfin ikililerini oku',
     '<a href="alistirma4.html#h=k">4 harfli K</a> ile bir tur · sonra S ve B',
     'Açılış quizi: <a href="4harf.html">4 harfli sayfanın Quiz sekmesi</a>, 1. bölüm'],
   hedef:{4:60, 5:30, 6:15, 7:5}},
  {ad:"Kalabalık harfler", sure:"~1 sa 35 dk · 140 kelime",
   nicin:"5 harfliler bölüm başına en çok soru gelen grup (13,6 soru) ve K S B D T "+
         "tek başına tüm cevapların <b>%35'i</b>. Bugün bu beş harfin kelimelerini görüyorsun.",
   gorev:[
     '<a href="alistirma5.html#h=k">5 harfli K</a> · <a href="alistirma5.html#h=s">S</a> · <a href="alistirma5.html#h=b">B</a>, birer tur',
     '<a href="alistirma5.html#h=d">5 harfli D</a> ve <a href="alistirma5.html#h=t">T</a>, birer tur',
     'Yardımlı modu aç, kelimelerin nasıl elendiğini izle',
     '<a href="alistirma4.html">4 harfli karışık</a>: 2 tur'],
   hedef:{4:30, 5:90, 6:15, 7:5}},
  {ad:"Uzun kelimeler ve puzzle", sure:"~1 sa 20 dk · 120 kelime",
   nicin:"6 harflide tanınma %70'e düşüyor, puzzle ise cevapların %22'si ve ayrı "+
         "bir beceri: tanımdan kelime bulmak. Bugün ikisini çalışıyorsun.",
   gorev:[
     '<a href="alistirma6.html#h=k">6 harfli K</a> · <a href="alistirma6.html#h=m">M</a> · <a href="alistirma6.html#h=b">B</a>, birer tur',
     '<a href="oyun.html">Tek kişilik oyunu</a> baştan sona oyna, üç puzzle çıkacak',
     '<a href="7harf.html">7 harfli ders notuna</a> göz at (23 soru, sadece tanışmak için)',
     'Puzzle\'da takıldığın tanımları not et'],
   hedef:{4:15, 5:30, 6:60, 7:15}},
  {ad:"Prova günü", sure:"~1 sa 20 dk · 120 kelime",
   nicin:"Bugün yeni şey öğrenilmez, eksikler kapatılır ve yarışma temposuna alışılır. "+
         "Süre baskısı altında oynamak, bilmekten farklı bir beceri.",
   gorev:[
     '<a href="rapor.html">Rapora bak</a>, en zayıf 3 harfini bul',
     'O üç harften birer tur alıştırma yap',
     '<a href="masa.html">Ailecük</a>\'te tam bir yarışma oyna, etaplar, düello, final',
     'Duvar sayfasındaki açılış ikililerine son bir bakış'],
   hedef:{4:30, 5:45, 6:30, 7:15}}
];

/* --- unvanlar --- */
function ciz(){
  const d = defter(KISI), p = planAl();
  const kalan = kalanGun();
  const U = LG_unvan(d.length), unv = U.simdi, sonraki = U.sonraki;
  const roz = LG_rozet(d, p, LG_kervanMeta(KISI), LG_papatyaMeta(KISI)), acikRoz = roz.filter(r=>r.v).length;

  /* bugun hangi gun: tamamlanmamis ilk gun */
  let bugun = GUNLER.findIndex((g,i)=>ayniGun(gunTarihi(i+1), new Date()));
  if(bugun < 0){
    bugun = GUNLER.findIndex((g,i)=>g.gorev.some((_,j)=>!p[(i+1)+"-"+j]));
    if(bugun < 0) bugun = GUNLER.length-1;
  }

  const gunHtml = GUNLER.map((g,i)=>{
    const kg = gunKayit(d, i+1), kgb = kg.filter(r=>r.k>0);
    const gt = gunTarihi(i+1), bugunMu = ayniGun(gt, new Date());
    const say = g.gorev.filter((_,j)=>p[(i+1)+"-"+j]).length;
    const oran = Math.round(100*say/g.gorev.length);
    const tam = say === g.gorev.length;
    const ac = acikGun === i+1 || (acikGun === 0 && i === bugun);
    return `<div class="gun ${tam?"tam":""} ${i===bugun&&!tam?"bugun":""} ${ac?"acik":""}">
      <div class="bas" onclick="acikGun=${acikGun===i+1?0:i+1};ciz()">
        <div class="no">${tam?"✓":(i+1)}</div>
        <div class="bilgi"><b>${i+1}. gün: ${g.ad}</b>
          <span>${tarihYazi(gt)}${bugunMu?" · bugün":""} · ${g.sure} ·
            ${say}/${g.gorev.length} görev</span></div>
        <div class="oran">%${oran}</div></div>
      <div class="cub"><i style="width:${oran}%"></i></div>
      <div class="ic">
        <div class="nicin">${g.nicin}</div>
        ${g.gorev.map((t,j)=>`<div class="gorev ${p[(i+1)+"-"+j]?"ok":""}">
          <span class="kut" onclick="gorevDegis('${(i+1)}-${j}')"></span>
          <span class="met">${t}</span></div>`).join("")}
        <div class="hedef"><b>🎯 Günün hedefi</b>
          <div class="hsat">${[4,5,6,7].filter(n=>g.hedef[n]).map(n=>{
            const c = kg.filter(r=>r.n===n).length, h = g.hedef[n];
            const o = Math.min(100, Math.round(100*c/h));
            return `<div class="hk">
              <div class="hb"><b>${n} harfli</b><u>${c}/${h}</u></div>
              <div class="cub2"><i class="${c>=h?"tam":""}" style="width:${o}%"></i></div>
            </div>`;}).join("")}</div>
          <div style="margin-top:8px;font-size:12.5px">${kg.length} kelime çözüldü
            ${kgb.length?`· başarı %${Math.round(100*kgb.length/kg.length)}`:""}</div>
        </div>
      </div></div>`;
  }).join("");

  const topGorev = GUNLER.reduce((t,g)=>t+g.gorev.length,0);
  const yapilan = Object.values(p).filter(Boolean).length;

  $("#alan").innerHTML = `
    ${kalan === 0 ? `<a class="bugunbtn" href="yarisma.html">
        🎬 BUGÜN YARIŞMA GÜNÜ: İYİ ŞANSLAR ▸</a>` : ""}
    <div class="sayim"><b>${kalan}</b><span>${kalan?"GÜN KALDI":"YARIŞMA GÜNÜ"}</span>
      <input type="date" value="${tarihAl()}" onchange="tarihYaz(this.value)"></div>
    <div class="kisi" onclick="secimAcik=!secimAcik;ciz()">
      <span class="sol"><span class="av">${TRU(KISI[0]||"?")}</span>
        <span><b>${KISI}</b><i>${unv.ad}</i></span></span>
      <u>${secimAcik?"kapat":"kişi değiştir"}</u></div>
    ${secimAcik?`<div class="kgrid">${KISILER.map(a=>
      `<button class="${a===KISI?"on":""}" onclick="kisiSec('${a.replace(/'/g,"")}')">${a}</button>`
      ).join("")}</div>`:""}
    <div class="unv"><b>${unv.ad}</b>
      <span>${d.length} kelime çözüldü${sonraki ? ` · ${sonraki.ad} için ${U.kalan} kelime daha` : " · en üst ünvan"}</span>
      <div class="cub"><i style="width:${U.oran}%"></i></div></div>

    <h2>Program · ${yapilan}/${topGorev} görev</h2>
    ${gunHtml}

    <h2>Rozetler · ${acikRoz}/${roz.length}</h2>
    <div class="roz">${roz.map(r=>`<div class="${r.v?"ac":""}">
      <div class="em">${r.e}</div><b>${r.a}</b><span>${r.s}</span></div>`).join("")}</div>

    <a class="buton" href="alistirma5.html">BUGÜNKÜ ALIŞTIRMAYA BAŞLA</a>
    <a class="buton ikinci" href="sertifika.html">🏅 SERTİFİKAM</a>
    <a class="buton ikinci" href="rapor.html">📊 GELİŞİM RAPORU</a>
    <a class="buton ikinci" href="index.html">ANA SAYFA</a>`;
}
ciz();
</script><script src="menu.js?v=1"></script>
