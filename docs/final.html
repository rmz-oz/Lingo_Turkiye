<title>Final Alıştırması</title>
<style>

  --kagit:#0f1720; --kart:#1a2430; --murekkep:#f2f5f8; --soluk:#8b98a6;
  --cizgi:#2c3947; --yesil:#2e9e5b; --sari:#e6b22e; --gri:#3a4756;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--kagit);color:var(--murekkep);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;

.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
button{font:inherit;cursor:pointer}
/* ust bar */
#bar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0a1119;
  border-bottom:1px solid var(--cizgi);flex:none}
#bar .etap{font-size:13px;letter-spacing:1px;font-weight:700;color:var(--altin);

  margin-left:10px;flex:none}
#bar #sesd.kapali{opacity:.45}
#bar .geri{color:var(--soluk);text-decoration:none;font-size:22px;line-height:1;

#bar .geri:active{opacity:.6}
#sure{width:100%;height:4px;background:#22303d;flex:none}
#sure i{display:block;height:100%;background:var(--altin);width:100%;transition:width .1s linear}

/* orta alan */
#orta{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;

#orta.oyun{gap:6px;padding:6px 10px}

#orta.sikisik .altsat .buton,#orta.sikisik #mikb{padding:7px 4px;font-size:13.5px}

#orta > :last-child{margin-bottom:auto}
.baslik{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--soluk);

/* tahta */
#tahta{display:grid;gap:5px;justify-content:center}
#tahta .satir{display:grid;gap:5px}
.hucre{width:var(--hg);height:var(--hg);border:2px solid var(--cizgi);border-radius:8px;

.hucre.ilk{border-color:#4a5a6b;color:var(--altin)}
.hucre.dolu{border-color:#4a5a6b}
.hucre.tam{background:var(--yesil);border-color:var(--yesil);color:#fff}
.hucre.var{background:var(--sari);border-color:var(--sari);color:#231a00}
.hucre.yok{background:var(--gri);border-color:var(--gri);color:#8fa0b0}
.satir.aktif .hucre{border-color:#5d6f82}
.satir.sarsil{animation:sars .35s}
@keyframes sars{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
/* puzzle */
.ipucu{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;
  padding:13px 15px;max-width:460px;text-align:center;font-size:17px;line-height:1.45}
.ipucu b{color:var(--altin);display:block;font-size:12px;letter-spacing:1.2px;
  text-transform:uppercase;margin-bottom:6px}
/* klavye */
#klavye{flex:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  background:#0a1119;border-top:1px solid var(--cizgi)}
#klavye .sr{display:flex;gap:4px;justify-content:center;margin-bottom:5px}
#klavye{--tush:clamp(48px,8.6vh,72px)}
#klavye button{flex:1 1 0;min-width:0;height:var(--tush);border:0;
  border-radius:8px;background:#3a4756;color:#fff;font-weight:700;
  font-size:clamp(16px,2.3vh,20px);padding:0}
#klavye button.gnis{flex:1.9 1 0;font-size:13px;letter-spacing:.5px}
#klavye button.dar{flex:1.9 1 0;font-size:13px;letter-spacing:.5px}
#klavye button.tam{background:var(--yesil)}

/* kartlar / ekranlar */
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;
  padding:22px 20px;max-width:460px;width:100%;text-align:center}
.kutu h1{font-size:32px;margin:0 0 4px;letter-spacing:-.5px}
.kutu h2{font-size:21px;margin:0 0 10px}
.kutu p{color:var(--soluk);margin:0 0 12px;font-size:15.5px;line-height:1.55}

.buton{display:block;width:100%;background:var(--altin);color:#1a1200;border:0;

.buton.ikinci{background:transparent;color:var(--murekkep);border:1.5px solid var(--cizgi)}
.tutar{font-size:40px;font-weight:800;color:var(--altin);letter-spacing:-1px;

.kucuk{font-size:13.5px;color:var(--soluk);line-height:1.5}
.kural{text-align:left;font-size:14.5px;color:var(--soluk);line-height:1.6;

.ornekler{display:flex;gap:6px;justify-content:center;margin:10px 0}

.uyari{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#f2f5f8;

.fbar{display:flex;gap:5px;max-width:430px;width:100%;margin:0 auto 2px}

.cubuk{height:7px;background:#22303d;border-radius:4px;overflow:hidden;margin-top:5px}

/* ses tanima */
.altsat{display:flex;gap:6px;max-width:430px;width:100%;margin-top:4px;

.altsat .buton{margin-top:0;flex:1.6 1 0;padding:9px 6px;font-size:15px;border-radius:10px}
.altsat .buton:disabled{opacity:.45}

#duy{font-size:12.5px;color:var(--soluk);text-align:center;line-height:1.35;

#duy:empty{display:none}
#duy b{color:var(--altin);font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
#duy s{text-decoration:none;color:var(--kirmizi)}
#bar .para{color:var(--altin)}
#bar .para.az{color:var(--kirmizi)}

/* --- gezinme tuslari buyutuldu: rahat dokunulsun --- */
#bar{gap:13px;padding-top:9px;padding-bottom:9px}
#bar .geri{font-size:31px;line-height:1;padding:0 8px 4px 2px;min-width:30px;

#bar #sesd,#bar #temad{width:44px;height:38px;font-size:20px;border-radius:99px;

/* centik payi: saat ve kamera cubugunun altina girmesin */

/* --- geri oku: buyuk ve rahat dokunulur --- */

  min-width:46px;height:44px;margin-left:-6px;padding:0}
#bar .geri:active,header .geri:active{opacity:.5}

<script>
let VERI = null, TANIM = {};
const TRU = s => s.replace(/i/g,"İ").replace(/ı/g,"I").toUpperCase();
const TL  = n => n.toLocaleString("tr-TR");
const $   = s => document.querySelector(s);
const orta = $("#orta"), klv = $("#klavye"), bar = $("#etapAd"), sayacEl = $("#para");
const sureKap = $("#sure"), sureBar = sureKap.querySelector("i");

const SATIR = 5;
/* 3. etap: odul her tahminde duser (Ailecuk duellosuyla ayni) */

let kullanilan = new Set(), sayac = null;
const GECERLI = {};

/* ---------------- istatistige dayali kelime secimi ---------------- */
const KUM = {};
function kumul(n){
  if(KUM[n]) return KUM[n];
  const a = VERI.arsiv[n], c = []; let t = 0;
  for(const [w, k] of a){ t += k; c.push(t); }
  return KUM[n] = {c, t, a};
}
function agirlikliArsiv(n){
  const {c, t, a} = kumul(n), r = Math.random()*t;
  let lo = 0, hi = c.length-1;
  while(lo < hi){ const m = (lo+hi)>>1; if(c[m] <= r) lo = m+1; else hi = m; }
  return a[lo][0];
}
function kelimeSec(n){
  n = String(n);
  const Y = VERI.yeni[n] || [];
  for(let t = 0; t < 400; t++){
    let w;
    if(Math.random() < 0.80 || !Y.length) w = agirlikliArsiv(n);
    else w = Y[Math.floor(Math.pow(Math.random(), 1.8) * Y.length)];
    if(w && !kullanilan.has(w)){ kullanilan.add(w); return w; }
  }
  return agirlikliArsiv(n);
}

/* ---------------- yardimcilar ---------------- */
function defterYaz(w, hak){
  try{
    const ad = localStorage.getItem("lingo_kisi");
    if(!ad || ad === "__kayitsiz__") return;
    const k = "lingo_defter_" + ad;
    const d = JSON.parse(localStorage.getItem(k) || "[]");
    d.push({w: w, n: w.length, h: w[0], k: hak, t: Date.now()});
    while(d.length > 3000) d.shift();
    localStorage.setItem(k, JSON.stringify(d));
  }catch(e){}
}
function uyar(m){
  const d = document.createElement("div"); d.className = "uyari"; d.textContent = m;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1300);
}
function renk(gizli, tah){
  const n = gizli.length, r = new Array(n).fill("yok"), kal = {};
  for(let i = 0; i < n; i++)
    if(tah[i] === gizli[i]) r[i] = "tam"; else kal[gizli[i]] = (kal[gizli[i]]||0)+1;
  for(let i = 0; i < n; i++)
    if(r[i] !== "tam" && kal[tah[i]] > 0){ r[i] = "var"; kal[tah[i]]--; }
  return r;
}
function durdur(){ if(sayac){ clearInterval(sayac); sayac = null; } }
function sureGoster(g){ sureKap.classList.toggle("gizli", !g); }
function sureBasla(sn, bitince, tikla){
  durdur(); sureGoster(true); sureKap.classList.remove("az");
  const bas = Date.now(), top = sn*1000; let son = sn;
  sayac = setInterval(() => {
    const kalan = Math.max(0, top - (Date.now()-bas));
    sureBar.style.width = (100*kalan/top) + "%";
    sureKap.classList.toggle("az", kalan < top*0.31);
    const s2 = Math.ceil(kalan/1000);
    if(tikla && s2 !== son){ son = s2; tikla(s2); if(s2 <= 5 && s2 > 0) LG_ses("sure"); }
    if(kalan <= 0){ durdur(); bitince(); }
  }, 100);
}

/* ---------------- klavye ---------------- */
const DIZ = ["ertyuıopğü", "asdfghjklşi", "zcvbnmöç"];   // Türkçe Q
let klvDurum = {}, klvTus = {};
function klavyeCiz(gir, sil, gonder){
  klv.innerHTML = ""; klvTus = {};
  DIZ.forEach((sr, k) => {
    const d = document.createElement("div"); d.className = "sr";
    for(const c of sr){
      const b = document.createElement("button"); b.textContent = TRU(c);
      b.onclick = () => gir(c); klvTus[c] = b; d.appendChild(b);
    }
    if(k === 1){ const b = document.createElement("button");     // SİL, TAMAM'in ustunde
      b.className = "dar"; b.textContent = "SİL"; b.onclick = sil; d.appendChild(b); }
    if(k === 2){ const b = document.createElement("button");
      b.className = "gnis"; b.textContent = "TAMAM"; b.onclick = gonder; d.appendChild(b); }
    klv.appendChild(d);
  });
  klv.classList.remove("gizli");
  for(const c in klvDurum) if(klvTus[c]) klvTus[c].className = klvDurum[c];
}
function klvBoya(tah, r){
  const oncelik = {tam:3, var:2, yok:1};
  for(let i = 0; i < tah.length; i++){
    const c = tah[i];
    if((oncelik[klvDurum[c]]||0) < oncelik[r[i]]){
      klvDurum[c] = r[i]; if(klvTus[c]) klvTus[c].className = r[i];
    }
  }
}

/* ---------------- ses tanima ---------------- */
const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
let tanir = null, dinliyor = false, sesUygula = null, sesBaglam = null, sesHavuz = null;
let sonucGeldi = false, hataGeldi = false, sonAra = "", araZaman = null;
let sesSay = {toplam: 0, tam: 0, yakin: 0, bos: 0};

/* tanıyıcı "kırk" yerine 40 yazabiliyor, rakamlari yaziya cevir */
const SBIR = ["", "bir", "iki", "üç", "dört", "beş", "altı", "yedi", "sekiz", "dokuz"];
const SON10 = ["", "on", "yirmi", "otuz", "kırk", "elli", "altmış", "yetmiş",
               "seksen", "doksan"];
function sayiYazi(n){
  if(!isFinite(n) || n < 0) return "";
  if(n === 0) return "sıfır";
  let y = "";
  if(n >= 1000000){ const m = Math.floor(n / 1000000);
    y += (m === 1 ? "bir" : sayiYazi(m)) + "milyon"; n %= 1000000; }
  if(n >= 1000){ const b = Math.floor(n / 1000);
    y += (b === 1 ? "" : sayiYazi(b)) + "bin"; n %= 1000; }
  if(n >= 100){ const c = Math.floor(n / 100);
    y += (c === 1 ? "" : SBIR[c]) + "yüz"; n %= 100; }
  return y + SON10[Math.floor(n / 10)] + SBIR[n % 10];
}
function sesTemiz(t){
  return String(t).replace(/\d+/g, m => sayiYazi(parseInt(m, 10))).toLocaleLowerCase("tr")
    .replace(/[âÂ]/g, "a").replace(/[îÎ]/g, "i").replace(/[ûÛ]/g, "u")
    .replace(/[^a-zçğıöşü]/g, "");
}
function mesafe(a, b){
  const m = a.length, n = b.length;
  if(Math.abs(m - n) > 3) return 99;
  let onc = new Array(n + 1), simdi = new Array(n + 1);
  for(let j = 0; j <= n; j++) onc[j] = j;
  for(let i = 1; i <= m; i++){
    simdi[0] = i;
    for(let j = 1; j <= n; j++){
      const c = a[i-1] === b[j-1] ? 0 : 1;
      simdi[j] = Math.min(simdi[j-1] + 1, onc[j] + 1, onc[j-1] + c);
    }
    const t = onc; onc = simdi; simdi = t;
  }
  return onc[n];
}
/* duyulan metni o turdaki gecerli kelimelere esle */
function sesEsle(secenek){
  const n = sesBaglam.n, ilk = sesBaglam.ilk;
  if(!sesHavuz) sesHavuz = [...GECERLI[n]].filter(w => w[0] === ilk);
  let iyi = null;
  for(const ham of secenek){
    const c = sesTemiz(ham);
    if(!c) continue;
    if(c.length === n && c[0] === ilk && GECERLI[n].has(c))
      return {w: c, ham: c, d: 0};
    for(const w of sesHavuz){
      const d = mesafe(c, w);
      if(!iyi || d < iyi.d) iyi = {w: w, ham: c, d: d};
      if(d === 0) break;
    }
  }
  return iyi;
}

/* duyulan secenekleri tahtaya yaz */
function sesIsle(secenek){
  if(sonucGeldi) return;
  sonucGeldi = true;
  sesSay.toplam++;
  const e = sesEsle(secenek);
  const duyulan = sesTemiz(secenek[0] || "");
  if(!e || e.d > 2){
    sesSay.bos++;
    return mikDurum(false, `duydum: <b>${duyulan ? TRU(duyulan) : "?"}</b>
      <s>bu uzunlukta karşılığı yok</s>`);
  }
  if(sesUygula) sesUygula(e.w);
  if(e.d === 0){ sesSay.tam++;
    mikDurum(false, `duydum: <b>${TRU(e.w)}</b> · yazdım, TAMAM'a basın`); }
  else{ sesSay.yakin++;
    mikDurum(false, `duydum: <b>${TRU(duyulan)}</b> · en yakını <b>${TRU(e.w)}</b>,
      yanlışsa SİL ile düzeltin`); }
}
function sesKur(){
  const r = new SRC();
  r.lang = "tr-TR"; r.continuous = false; r.interimResults = true; r.maxAlternatives = 6;
  r.onstart = () => { sonucGeldi = false; hataGeldi = false; sonAra = "";
    clearTimeout(araZaman);
    mikDurum(true, "şimdi söyleyin"); };
  r.onresult = ev => {
    let ara = "", son = null;
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const res = ev.results[i];
      if(res.isFinal) son = res; else ara += res[0].transcript;
    }
    if(!son){                                  /* konusurken anlik yazi */
      if(ara.trim()){ sonAra = ara.trim();
        mikDurum(true, `duyuluyor: <b>${sonAra}</b>`); }
      return;
    }
    const secenek = [];
    for(let i = 0; i < son.length; i++) secenek.push(son[i].transcript);
    sesIsle(secenek);
  };
  r.onerror = ev => {
    hataGeldi = true; dinliyor = false;
    const izin = ev.error === "not-allowed" || ev.error === "service-not-allowed";
    if(ev.error === "aborted") return;
    const m = {"no-speech": "ses gelmedi, tekrar deneyin",
               "audio-capture": "mikrofon başka uygulamada, onu kapatın",
               "network": "internet gerekiyor"}[ev.error] || ev.error;
    mikDurum(false, izin
      ? `<s>mikrofon izni kapalı</s> · adres çubuğundaki kilit simgesine basın,
         <b>İzinler</b>, <b>Mikrofon</b>, <b>İzin ver</b>, sonra sayfayı yenileyin`
      : `<s>${m}</s>`);
  };
  /* Android'de kesin sonuc bazen hic gelmiyor, son anlik yaziyi kullan */
  r.onend = () => { dinliyor = false;
    const b = document.getElementById("mikb");
    if(b){ b.classList.remove("dinle"); b.innerHTML = "🎙 SÖYLE"; }
    if(!sonucGeldi && sonAra) return sesIsle([sonAra]);
    if(!sonucGeldi && !hataGeldi)
      mikDurum(false, "<s>ses alınamadı</s> · tuşa basıp bir saniye sonra konuşun");
  };
  r.onspeechend = () => {                    /* kesin sonuc gelmezse kisa bekle, sonra yaz */
    clearTimeout(araZaman);
    araZaman = setTimeout(() => { if(!sonucGeldi && sonAra) sesIsle([sonAra]); }, 900);
  };
  return r;
}
function sesDur(){
  dinliyor = false; clearTimeout(araZaman); sonAra = ""; sonucGeldi = true;
  if(tanir){ try{ tanir.abort(); }catch(e){} }
}
window.mikBas = function(){
  if(!SRC) return uyar("Bu tarayıcı sesle yazmayı desteklemiyor");
  if(dinliyor){ sesDur(); return; }
  if(!tanir) tanir = sesKur();
  try{ tanir.start(); dinliyor = true; mikDurum(true, "hazırlanıyor, bir saniye"); }
  catch(e){ try{ tanir.abort(); }catch(e2){} dinliyor = false; }
};

/* ---------------- lingo kelimesi ---------------- */
function hucreBoy(n){
  const g = Math.min(window.innerWidth - 26, 430);
  const enBoy = Math.floor((g - (n-1)*5) / n);
  /* tahtanin payina dusen yukseklik: ekran eksi bar, klavye, serit, butonlar */
  const kl = klv.getBoundingClientRect().height || Math.round(window.innerHeight*0.24);
  const kalanY = window.innerHeight - kl - 190;
  const boyY = Math.floor((kalanY - (FSATIR-1)*5) / FSATIR);
  return Math.max(28, Math.min(58, enBoy, boyY > 0 ? boyY : enBoy));
}
/* tahta ekrani kaydirma gerektirmesin: sigmazsa hucreleri kucult */
function boyAyarla(){
  const t = document.getElementById("tahta"); if(!t) return;
  const tasti = () => orta.scrollHeight > orta.clientHeight + 1;
  let hg = parseInt(t.style.getPropertyValue("--hg"), 10) || 40, kez = 0;
  /* once hucreler makul bir alt sinira kadar kucultulur */
  while(tasti() && hg > 34 && kez++ < 24){ hg -= 2; t.style.setProperty("--hg", hg + "px"); }
  /* yetmezse klavye kisilir */
  const tus = klv.querySelector("button");
  let kh = tus ? Math.round(tus.getBoundingClientRect().height) : 46;
  kez = 0;
  while(tasti() && kh > 36 && kez++ < 16){ kh -= 2; klv.style.setProperty("--tush", kh + "px"); }
  /* hala sigmadiysa hucreler biraz daha */
  kez = 0;
  while(tasti() && hg > 26 && kez++ < 12){ hg -= 2; t.style.setProperty("--hg", hg + "px"); }
  /* cok kisa ekran: serit ve klavye son bir tur kisilir */
  if(tasti()) orta.classList.add("sikisik");
  kez = 0;
  while(tasti() && kh > 32 && kez++ < 8){ kh -= 2; klv.style.setProperty("--tush", kh + "px"); }
}

      h[i].textContent = giris[i] ? TRU(giris[i]) : "";
      h[i].className = "hucre" + (giris[i] ? " dolu" : "");

  function gir(c){ if(giris.length < n){ giris += c; yaz(); } }

  function sarsil(){
    satirlar[sat].classList.add("sarsil");

  function gonder(){
    if(kapandi) return;

  const enUzak = girilen.length ? girilen[girilen.length - 1].n : 0;

  m.enUzak = Math.max(m.enUzak || 0, enUzak);

  m.gecmis = m.gecmis.slice(0, 8);

  let toplamSn = 0;

    toplamSn += k.sn;
    return `${n} harfliyi <b>${toplamSn}.</b> saniyede`;

  const bas = tamam ? "Final tamamlandı" : "Süre bitti";
  ekran(`<div class="eyebrow">${bas}</div>
    <h1>${tamam ? "Dördünü de bildin" : (enUzak ? enUzak + " harfliye kadar geldin"
                                               : "İlk kelimeyi geçemedin")}</h1>
    <div class="tutar">${kullanilanSure} sn</div>
    <p class="kucuk">${tamam
      ? `120 saniyenin <b>${kullanilanSure}</b> saniyesini kullandın,
         <b>${kalan}</b> saniye artırdın.`
      : `Süre doldu. O ana kadar <b>${bilinen.length}</b> kelime bildin.`}</p>
    ${zaman ? `<p class="kucuk">${zaman} bildin.</p>` : ""}
    <table class="ist">
      <tr><th>Uzunluk</th><th>Kelime</th><th>Nasıl</th><th style="text-align:right">Süre</th></tr>
      ${satirlar}
    </table>
    <div class="rek">
      <div><b>${m.deneme}</b><span>deneme</span></div>
      <div><b>${m.tam}</b><span>tamamlanan</span></div>
      <div><b>${m.enIyi ? m.enIyi + " sn" : "-"}</b><span>en iyi süre</span></div>
    </div>
    ${m.gecmis.length > 1 ? `<p class="eyebrow" style="margin-top:12px">Son denemeler</p>
      <div class="gec">${m.gecmis.slice(0, 5).map(g =>
        `${new Date(g.t).toLocaleDateString("tr-TR")} · ${g.tam
          ? `<b>tamam, ${g.sn} sn</b>` : `${g.uzak ? g.uzak + " harfliye kadar" : "ilk kelime"}`}`
        ).join("<br>")}</div>` : ""}
    <button class="buton" onclick="basla()">TEKRAR DENE</button>
    <a class="buton ikinci" href="rapor.html">📊 GELİŞİM RAPORUM</a>
    <a class="buton ikinci" href="index.html">ANA SAYFA</a>`);
}

document.addEventListener("keydown", e => {
  if(klv.classList.contains("gizli")) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if(k === "Enter"){ const b = [...klv.querySelectorAll("button")]
      .find(x => x.textContent === "TAMAM"); if(b){ e.preventDefault(); b.click(); } }
  else if(k === "Backspace"){ const b = [...klv.querySelectorAll("button")]
      .find(x => x.textContent === "SİL"); if(b){ e.preventDefault(); b.click(); } }
  else if(k.length === 1){ const c = k.toLocaleLowerCase("tr");
    if(klvTus[c]){ e.preventDefault(); klvTus[c].click(); } }
});

function yukle(){
  LG_sesDugme($("#sesd"));
  orta.innerHTML = `<div class="kutu"><h2>Hazırlanıyor…</h2>
    <p class="kucuk">Kelime havuzu yükleniyor.</p></div>`;
  Promise.all([
    fetch("oyun-veri.json").then(r => r.json()),
    fetch("oyun-tanim.json").then(r => r.json()).catch(() => ({}))
  ]).then(([v, t]) => {
    VERI = v; TANIM = t || {};
    for(const n of [4,5,6,7]) GECERLI[n] = new Set(v.gecerli[n]);
    KISILER = LG_kisiler(KISI_VAR);
    KISI = LG_kisiDogrula(KISILER) || KISILER[0];
    if(!KISI || KISI === LG_KAYITSIZ) return kisiEkran();
    girisEkran();
  }).catch(e => {
    orta.innerHTML = `<div class="kutu"><h2>Açılamadı</h2>
      <p class="kucuk">${(e && e.message) || e}</p>
      <button class="buton" onclick="location.reload()">YENİLE</button></div>`;
  });
}
yukle();
